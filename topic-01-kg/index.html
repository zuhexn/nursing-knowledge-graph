    paintGraph();
    for (var i = 0; i < ids.length; i++) {
      if (offscreen(ids[i])) { fitView(isNarrow() ? 40 : 80); break; }
    }
    scheduleLabelAvoid();
    return ids.length;
  }
  function removeNode(id) {
    if (!id) return false;
    delete state.vis[id];
    delete state.expanded[id];
    delete state.locked[id];
    if (state.selected === id) {
      state.selected = null;
      state.trail = [];
      document.getElementById("panel").classList.remove("open");
      document.getElementById("scrim").classList.remove("show");
      document.body.classList.remove("panel-open");
    }
    paintGraph();
    scheduleLabelAvoid();
    return true;
  }
  /* 把图例里刚点开的这类节点补上：只补「挂在已展开节点上的」那些 ——
     否则用户点开「文献」，画布上什么也不会发生（它们根本还没被展开过）。 */
  function revealNeighborsOfType(k) {
    var added = 0;
    Object.keys(state.vis).forEach(function (vid) {
      var ids = neighborsOf(vid).filter(function (nid) {
        var n = NODE[nid];
        return n && n.type === k && !state.vis[nid];
      });
      if (!ids.length) return;
      var pts = placeAround(vid, ids);
      ids.forEach(function (nid, i) {
        if (state.vis[nid]) return;
        state.vis[nid] = true;
        state.pos[nid] = pts[i];
        added++;
      });
    });
    return added;
  }
  function toggleLock(id) {
    if (!id) return;
    if (state.locked[id]) delete state.locked[id];
    else state.locked[id] = true;
    paintGraph();
  }
  /* 检索命中的节点可能不在画布上（还没展开到）—— 选中前先把它放出来 */
  function revealNode(id) {
    if (state.vis[id]) return;
    var c = chart.convertFromPixel({ seriesIndex: 0 },
      [chart.getWidth() / 2, chart.getHeight() / 2]) || [0, 0];
    state.pos[id] = [c[0], c[1]];
    state.vis[id] = true;
  }

  /* ============ 只看这一圈（ego network） ============
     全局 92 个点在手机上不可读；但「当前节点 + 一跳邻居」通常 5–15 个，
     一屏放得下、标签也放得下。这是图谱在手机上真正可用的画法：
     不是看全图，是沿关系走。 */
  function enterEgo(id) {
    if (!id || !NODE[id]) return;
    /* 进邻域 = 从「找词」切到「沿关系走」：清掉检索，
       否则搜索下拉会在切到画布 60ms 后重新盖住这一圈。 */
    if (state.query) {
      state.query = ""; state.hits = []; state.hitsMap = {};
      var sEl = document.getElementById("search");
      if (sEl) sEl.value = "";
      var cEl = document.getElementById("clearSearch");
      if (cEl) cEl.style.display = "none";
      var chips = document.getElementById("searchChips");
      if (chips) chips.style.display = "";
      renderListResults([]);
    }
    document.getElementById("suggest").style.display = "none";
    /* 文献节点的邻居全是文献边 —— 看它的这一圈时必须把文献边打开 */
    if (!hasKnowledgeEdge(id)) state.showEvidence = true;
    state.ego = id;
    state.selected = id;
    revealNode(id);
    var all = neighborsOf(id).filter(function (nid) {
      if (!NODE[nid] || typeHidden(nid)) return false;
      if (state.showEvidence) return true;
      return (degree[nid] || 0) === 0 || hasKnowledgeEdge(nid);
    });
    /* 超大枢纽（35 个邻居）一屏放不下：按数据声明的类型顺序取前 N 个，
       剩下的在角标里如实说「另有 N 个」—— 想看就点邻居换中心继续走。 */
    var cap = isNarrow() ? EGO_MAX_NARROW : EGO_MAX_WIDE;
    var chosen = sortByTypeOrder(all).slice(0, cap);
    state.egoSet = {};
    state.egoSet[id] = true;
    chosen.forEach(function (nid) { state.egoSet[nid] = true; });
    state.egoHidden = Math.max(0, all.length - chosen.length);
    var missing = chosen.filter(function (nid) { return !state.vis[nid]; });
    if (missing.length) {
      freezeLayout();
      var pts = placeAround(id, missing);
      missing.forEach(function (nid, i) {
        state.vis[nid] = true;
        state.pos[nid] = pts[i];
      });
      state.expanded[id] = true;
    }
    if (state.view !== "graph") setView("graph");
    freezeLayout();
    paintGraph();
    initialView();
    scheduleLabelAvoid();
    updateActions();
    syncEvidenceUI();
    if (isNarrow()) {
      document.getElementById("panel").classList.remove("open");
      document.getElementById("scrim").classList.remove("show");
      document.body.classList.remove("panel-open");
    }
  }
  function exitEgo() {
    state.ego = null;
    state.egoSet = null;
    state.egoHidden = 0;
    paintGraph();
    initialView();
    updateActions();
  }
  /* 点选按「离手指最近的点」算，而不是「画在最上层的那个」：
     节点小、彼此又挨得近时，zrender 的命中是「画得晚的赢」——
     点 A 会打开 B。最近邻之后，指头粗一点也点得中，点哪儿就是哪儿。 */
  function nearestNode(px, py, maxDist) {
    var best = null, bestD = maxDist;
    var ego = egoIds();
    Object.keys(state.vis).forEach(function (id) {
      if (typeHidden(id)) return;
      if (ego && !ego[id]) return;
      var p = state.pos[id];
      if (!p) return;
      var q = chart.convertToPixel({ seriesIndex: 0 }, p);
      if (!q || isNaN(q[0]) || isNaN(q[1])) return;
      var dx = q[0] - px, dy = q[1] - py;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d <= bestD) { bestD = d; best = id; }
    });
    return best;
  }

  /* ============ 构建 ECharts 数据 ============ */
  function nodeSymbolSize(n) {
    var base = typeOf(n).size || 24;
    var d = degree[n.id] || 0;
    var s = Math.round(base * (0.72 + 0.75 * Math.sqrt(d / maxDeg)));
    /* 手机上节点要小 —— 逐步展开之后屏幕上本来就只有十几二十个节点，
       不再靠「把节点撑大」来点得中（点选按最近邻算，见 nearestNode）。 */
    return isNarrow() ? Math.max(13, Math.round(s * 0.62)) : s;
  }
  /* 画布上的标签只放「短名」—— 文献题名动辄一两百字符，
     原样画出来会冲出屏幕右边（完整题名在 tooltip 与详情面板里看得到）。 */
  function shortLabel(name) {
    var s = String(name == null ? "" : name);
    if (s.length <= 16) return s;
    var cut = s.slice(0, 16);
    /* 拉丁文按词边界切，别切在半截单词上 */
    if (!/[\u4e00-\u9fff]/.test(cut)) {
      var sp = cut.lastIndexOf(" ");
      if (sp >= 8) cut = cut.slice(0, sp);
    }
    return cut.replace(/[\s,;:.]+$/, "") + "…";
  }
  /* 文本像素宽度：用真实字体量，别估。
     估算（拉丁按 0.56 字宽）会系统性偏窄 —— 实测 "Management and…" 在 13px 下
     真实 121px / 估算 109px，偏窄 11%：避让算出来的框比画出来的字窄，
     两个标签就会压到一起。真量一次（canvas measureText）成本可忽略。 */
  var _measureCtx = null, _measureCache = {};
  function measureCtx() {
    if (_measureCtx === null) {
      try { _measureCtx = document.createElement("canvas").getContext("2d"); }
      catch (e) { _measureCtx = false; }
    }
    return _measureCtx || null;
  }
  function textWidth(str, fs) {
    var key = fs + "|" + str;
    if (_measureCache[key] != null) return _measureCache[key];
    var w = 0, ctx = measureCtx();
    if (ctx) {
      try {
        ctx.font = fs + "px sans-serif";
        w = ctx.measureText(str).width;
      } catch (e) { w = 0; }
    }
    if (!w) {   /* 量不出来（字体未就绪 / 老浏览器）→ 退回估算 */
      for (var i = 0; i < str.length; i++) {
        w += str.charCodeAt(i) > 0x2e80 ? fs : fs * 0.56;
      }
    }
    _measureCache[key] = w;
    return w;
  }
  /* 候选标签：窄屏只标枢纽，宽屏标度数高的 —— 画不画还要过「避让」 */
  function shouldShowLabel(n) {
    if (state.labelsAll) return true;
    /* 窄屏：先都试着标 —— 放不下的由避让算法自动不画。
       逐步展开之后画面上的节点本来就少，标出来才认得出哪个是哪个。 */
    if (isNarrow()) return true;
    return (degree[n.id] || 0) >= 5;
  }
  function buildNodes() {
    var ego = egoIds();
    return (G.nodes || []).filter(function (n) {
      if (!state.vis[n.id]) return false;
      if (ego && !ego[n.id]) return false;
      /* 文献边隐藏时，只有文献边的节点（文献节点）不画 —— 否则是一圈孤立点 */
      if (!state.showEvidence && (degree[n.id] || 0) > 0 && !hasKnowledgeEdge(n.id)) return false;
      return true;
    }).map(function (n) {
      var t = typeOf(n);
      /* 框架节点（论文的一级/二级框架）用菱形 + 虚线边 —— 一眼看得出哪些是「骨架」 */
      var fw = isFramework(n);
      var it = {
        id: n.id,
        name: n.name,
        category: t.index,
        symbolSize: fw ? Math.round(nodeSymbolSize(n) * 1.3) : nodeSymbolSize(n),
        symbol: fw ? "diamond" : (t.shape === "pin" ? "circle" : (t.shape || "circle")),
        itemStyle: {
          color: t.color,
          borderColor: fw ? "#a86404" : "rgba(255,255,255,.9)",
          borderWidth: fw ? 2 : 1.2,
          borderType: fw ? "dashed" : "solid",
          shadowBlur: 12,
          shadowColor: "rgba(30,60,100,.22)"
        },
        label: {
          /* 布局没定型之前不画标签 —— 标签是按坐标摆的，
             坐标还在动，摆出来的字就追不上节点（还会互相压字）。
             定型之后一次性算准，见 freezeLayout()。 */
          show: state.frozen && shouldShowLabel(n) && !state.labelOff[n.id],
          fontSize: isNarrow() ? 15.5 : 13.5,
          color: "#12233a",
          position: state.labelSide[n.id] || "right",
          distance: 5,
          formatter: shortLabel(n.name),
          textBorderColor: "#ffffff",
          textBorderWidth: 3
        },
        _type: n.type,
        _degree: degree[n.id] || 0
      };
      /* 冻结后的坐标写回数据项 —— 这样后续任何一次 setOption
         （筛类型 / 高亮 / 重排标签）都不会让节点跳回原点。 */
      var p = state.pos[n.id];
      if (p) { it.x = p[0]; it.y = p[1]; }
      return it;
    });
  }
  function buildLinks() {
    var ego = egoIds();
    return (G.edges || []).filter(function (e) {
      if (!(state.vis[e.source] && state.vis[e.target])) return false;
      if (ego && !(ego[e.source] && ego[e.target])) return false;
      if (!state.showEvidence && isEvidenceEdge(e)) return false;
      return true;
    }).map(function (e) {
      var a = NODE[e.source], b = NODE[e.target];
      return {
        source: e.source,
        target: e.target,
        value: e.label,
        lineStyle: {
          color: (a ? typeOf(a).color : "#b9cfe6"),
          opacity: .42, width: 1.1, curveness: .06
        }
      };
    });
  }

  /* ============ 初始化图表 ============ */
  var chart = echarts.init(document.getElementById("chart"), null, { renderer: "canvas" });
  applySeed();          /* 画布从「主题节点 + 一圈邻居」起步，不是一屏铺满 */
  var option = {
    backgroundColor: "transparent",
    animationDuration: 700,
    /* 手势更新必须立即生效：默认 300ms 的更新动画会让画布追不上手指 */
    animationDurationUpdate: 0,
    animationEasingUpdate: "quinticInOut",
    tooltip: {
      confine: true,          /* 手机上提示框不许溢出画布 */
      backgroundColor: "rgba(255,255,255,.97)",
      borderColor: "#b9cfe6",
      borderWidth: 1,
      padding: [9, 13],
      textStyle: { color: "#12233a", fontSize: 13.5 },
      formatter: function (p) {
        if (p.dataType === "edge") {
          var a = NODE[p.data.source], b = NODE[p.data.target];
          return '<b style="color:#a86404">' + esc(p.data.value) + '</b><br>' +
            esc(a ? a.name : "") + " → " + esc(b ? b.name : "");
        }
        var n = NODE[p.data.id];
        if (!n) return "";
        var t = typeOf(n);
        return '<b style="font-size:16px">' + esc(n.name) + '</b>' +
          '<br><span style="color:' + t.color + '">' + esc(t.label) + '</span>' +
          '<br><span style="color:#5b7595">度数 ' + (degree[n.id] || 0) + ' · 点击可查看详情并展开关联</span>';
      }
    },
    series: [{
      id: "kg",
      type: "graph",
      layout: "force",
      /* 手势由下面的 pointer 处理器自己接管：ECharts 自带的 roam 在
         空白区不响应、双指缩放比例也不是 1:1；roam/draggable 关掉，
         避免两套手势互相打架。 */
      roam: false,
      draggable: false,
      zoom: 0.82,
      categories: CATS.map(function (t) { return { name: t.label, itemStyle: { color: t.color } }; }),
      data: buildNodes(),
      links: buildLinks(),
      edgeSymbol: ["none", "arrow"],
      edgeSymbolSize: 5,
      force: isNarrow()
        /* 手机画布小 → 斥力小、连线短 → 布局更紧凑，缩小后仍看得清 */
        ? { repulsion: 210, edgeLength: [46, 118], gravity: 0.055, friction: 0.18, layoutAnimation: true, initLayout: "circular" }
        : { repulsion: 380, edgeLength: [70, 190], gravity: 0.075, friction: 0.16, layoutAnimation: true, initLayout: "circular" },
      emphasis: {
        focus: "adjacency",
        scale: 1.16,
        itemStyle: { borderColor: "#a86404", borderWidth: 3 },
        label: { show: true, fontSize: 15, fontWeight: "bold" },
        lineStyle: { width: 2.6, opacity: .95 }
      },
      blur: {
        itemStyle: { opacity: .16 },
        label: { show: false },
        lineStyle: { opacity: .05 }
      },
      select: {
        itemStyle: { borderColor: "#a86404", borderWidth: 3 },
        label: { show: true },
        disabled: false
      },
      labelLayout: { hideOverlap: true },
      lineStyle: { curveness: .06 }
    }]
  };
  chart.setOption(option);

  /* 视口变化先跟着重排；只有宽度变了（旋转 / 改窗口）才重新适配视图 */
  var lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    chart.resize();
    if (window.innerWidth !== lastW) {
      lastW = window.innerWidth;
      setTimeout(function () { initialView(); }, 260);
      setTimeout(function () { initialView(); }, 1200);   /* 布局还在长 → 补一次适配 */
    }
  });

  /* ============ 图例（由数据自带，不在代码里写死） ============ */
  function syncEvidenceUI() {
    var el = document.getElementById("legendEvidence");
    if (el) el.classList.toggle("off", !state.showEvidence);
    var lab = document.getElementById("legendEvidenceState");
    if (lab) {
      var n = (G.edges || []).filter(isEvidenceEdge).length;
      lab.textContent = (state.showEvidence ? "显示" : "隐藏") + " · " + n + " 条";
    }
  }
  function renderLegend() {
    var body = document.getElementById("legend-body");
    var countMap = {};
    (G.nodes || []).forEach(function (n) { countMap[n.type] = (countMap[n.type] || 0) + 1; });
    var items = CATS.filter(function (t) { return countMap[t.key]; });
    body.innerHTML = '<div class="lg-items">' + items.map(function (t) {
      return '<div class="lg-item' + (state.hidden[t.key] ? " off" : "") + '" data-type="' + esc(t.key) + '" title="' + esc(t.desc || t.label) + '">' +
        '<span class="lg-dot" style="background:' + t.color + '"></span>' +
        '<span>' + esc(t.label) + '</span>' +
        '<span class="lg-count">' + (countMap[t.key] || 0) + '</span></div>';
    }).join("") + '</div>' +
      '<div class="legend-head" style="margin:16px 0 10px;"><h4>关系边</h4></div>' +
      '<div class="lg-items"><div class="lg-item' + (state.showEvidence ? "" : " off") + '" id="legendEvidence" ' +
      'title="有文献支持的边默认隐藏：它们占全部边的一半，画出来会盖住知识结构">' +
      '<span class="lg-dot" style="background:#a86404"></span><span>文献边</span>' +
      '<span class="lg-count" id="legendEvidenceState"></span></div></div>';
    syncEvidenceUI();
    body.querySelectorAll(".lg-item[data-type]").forEach(function (el) {
      el.addEventListener("click", function () {
        var k = el.dataset.type;
        /* 点「文献」这类只靠文献边连接的类型时，自动把文献边打开 ——
           否则节点被隐藏，点了像没反应。 */
        if (!state.showEvidence && evidenceOnlyTypes()[k]) {
          state.showEvidence = true;
          syncEvidenceUI();
        }
        state.hidden[k] = !state.hidden[k];
        el.classList.toggle("off", !!state.hidden[k]);
        if (!state.hidden[k]) revealNeighborsOfType(k);
        applyFilter();
      });
    });
    var evEl = document.getElementById("legendEvidence");
    if (evEl) {
      evEl.addEventListener("click", function () {
        state.showEvidence = !state.showEvidence;
        syncEvidenceUI();
        /* 邻域模式下重算这一圈：打开/关闭文献边会改变圈里该有谁 */
        if (state.ego) { enterEgo(state.ego); return; }
        if (state.showEvidence) {
          /* 打开文献边时，把只靠文献边连接的节点补到画布上 */
          var etypes = evidenceOnlyTypes();
          Object.keys(etypes).forEach(function (k) { revealNeighborsOfType(k); });
        }
        applyFilter();
        updateActions();
      });
    }
    document.getElementById("legendAll").addEventListener("click", function () {
      var offTypes = Object.keys(state.hidden).filter(function (k) { return state.hidden[k]; });
      state.hidden = {};
      body.querySelectorAll(".lg-item[data-type]").forEach(function (el) { el.classList.remove("off"); });
      offTypes.forEach(function (k) { revealNeighborsOfType(k); });
      applyFilter();
    });
  }

  /* ============ 画布渲染：一个出口 ============
     隐藏类型 / 检索命中 / 选中聚焦 / 锁定，全部在这里一次算完。
     旧的 applyFilter 与 focusSet 各算一套 —— focusSet 里漏掉了「隐藏类型」
     这一支，于是点一下节点，刚才筛掉的类型又全冒出来。合并成一个出口，
     不再有两套口径。 */
  function paintGraph() {
    var sel = (state.selected && state.vis[state.selected]) ? state.selected : null;
    var focus = null;
    if (sel) {
      focus = {};
      focus[sel] = true;
      neighborsOf(sel).forEach(function (nid) { if (state.vis[nid]) focus[nid] = true; });
    }
    var nodes = buildNodes().map(function (d) {
      if (state.hidden[d._type]) {
        d.itemStyle = { opacity: 0, color: "transparent", borderWidth: 0, shadowBlur: 0 };
        d.label.show = false;
        return d;
      }
      if (state.query) {
        if (state.hitsMap[d.id]) {
          d.itemStyle = { color: typeOf(d).color, borderColor: "#a86404", borderWidth: 2, opacity: 1, shadowBlur: 18, shadowColor: "rgba(168,100,4,.45)" };
          d.label.show = true;
        } else {
          d.itemStyle = { color: typeOf(d).color, opacity: .12, borderWidth: 0, shadowBlur: 0 };
          d.label.show = false;
        }
      } else if (focus) {
        if (focus[d.id]) {
          d.itemStyle = {
            color: typeOf(d).color,
            borderColor: d.id === sel ? "#a86404" : "rgba(168,100,4,.55)",
            borderWidth: d.id === sel ? 3 : 2,
            opacity: 1, shadowBlur: 16, shadowColor: "rgba(30,60,100,.35)"
          };
          d.label.show = true;
        } else {
          d.itemStyle = { color: typeOf(d).color, opacity: .14, borderWidth: 0, shadowBlur: 0 };
          d.label.show = false;
        }
      }
      /* 锁定 = 画一圈青边（重置时保留它；展开时新节点避开它） */
      if (state.locked[d.id]) {
        d.itemStyle.borderColor = "#1d5fb0";
        if (!focus || !focus[d.id]) d.itemStyle.borderWidth = 2;
      }
      return d;
    });
    var links = buildLinks().map(function (l) {
      var a = NODE[l.source], b = NODE[l.target];
      if ((a && state.hidden[a.type]) || (b && state.hidden[b.type])) {
        l.lineStyle = { opacity: 0, width: 0 };
        return l;
      }
      if (state.query) {
        if (state.hitsMap[l.source] && state.hitsMap[l.target]) {
          l.lineStyle = { color: "#a86404", opacity: .95, width: 2.2, curveness: .06 };
        } else {
          l.lineStyle = { color: "#b9cfe6", opacity: .12, width: 1, curveness: .06 };
        }
      } else if (focus) {
        if (focus[l.source] && focus[l.target]) {
          l.lineStyle = { color: "#a86404", opacity: .9, width: 2.2, curveness: .06 };
        } else {
          l.lineStyle = { color: "#b9cfe6", opacity: .1, width: 1, curveness: .06 };
        }
      }
      return l;
    });
    chart.setOption({ series: [{ id: "kg", data: nodes, links: links }] });
    updateStats();
  }
  function applyFilter() { freezeLayout(); paintGraph(); }

  /* 选中一个节点 → 高亮它 + 它的直接关联节点，其余压暗 */
  function focusSet() {
    /* 列表视图下画布不可见 —— 不碰它（碰了会白白重启一次力导向布局） */
    if (state.view === "list") return;
    freezeLayout();          /* 换数据会重启布局 → 先定型（已定型则空转） */
    paintGraph();
  }

  /* ============ 检索（三通道） ============ */
  function doSearch(q) {
    var box = document.getElementById("suggest");
    state.query = (q || "").trim();
    document.getElementById("clearSearch").style.display = state.query ? "block" : "none";
    var chips = document.getElementById("searchChips");
    if (chips) chips.style.display = state.query ? "none" : "";
    if (!state.query) {
      box.style.display = "none";
      state.hits = []; state.hitsMap = {};
      renderListResults([]);
      focusSet();
      return;
    }
    var res = C.search(G, state.query);
    var hits = res.hits || [];
    state.hits = hits.map(function (n) { return n.id; });
    state.hitsMap = {};
    state.hits.forEach(function (id) { state.hitsMap[id] = true; });

    var qn = C.norm(state.query);
    hits.sort(function (a, b) {
      var an = C.norm(a.name).indexOf(qn), bn = C.norm(b.name).indexOf(qn);
      if (an !== bn) return (an < 0 ? 999 : an) - (bn < 0 ? 999 : bn);
      return (degree[b.id] || 0) - (degree[a.id] || 0);
    });

    var note = "";
    if (res.channel === "evidenceType") {
      note = '按<b>文献类型</b>「' + esc(res.evidenceType) + '」命中 ' + hits.length + ' 个节点';
    } else {
      note = '按<b>名称 / 别名</b>命中 ' + hits.length + ' 个节点';
    }
    /* 列表视图：结果直接铺在列表里（下拉建议在手机上会盖住内容） */
    renderListResults(hits);

    /* 画布视图：下拉建议（inline 样式会盖过样式表，所以这里必须显式开关） */
    if (state.view !== "graph") {
      /* 手机上「打了字却看不到变化」= 以为页面坏了 ⇒ 把结果滚到眼前。
         （结果块在分类流上方；不滚的话用户看着分类卡以为检索没生效）
         ⚠️ 只在结果块**不在视野里**时滚 —— 每敲一个字都把用户拽回顶部
            = 另一种难用（正在读结果的人会被打断）。 */
      if (state.query) {
        try {
          var vr = lgResults.getBoundingClientRect();
          var lr = document.getElementById("viewList").getBoundingClientRect();
          if (vr.top < lr.top || vr.bottom > lr.bottom) {
            lgResults.scrollIntoView({ block: "start" });
          }
        } catch (e) {}
      }
      focusSet();
      return;
    }
    var top = hits.slice(0, 24);
    box.innerHTML = '<div id="suggestNote">' + note + '</div>' +
      (top.length ? top.map(function (n, i) {
        var t = typeOf(n);
        return '<div class="sg-item' + (i === 0 ? " active" : "") + '" data-id="' + esc(n.id) + '">' +
          '<span class="sg-dot" style="background:' + t.color + '"></span>' +
          '<span class="sg-name">' + esc(n.name) + '</span>' +
          '<span class="sg-type">' + esc(t.label) + '</span></div>';
      }).join("") : '<div class="sg-empty">未找到匹配节点</div>');
    box.style.display = "block";
    box.querySelectorAll(".sg-item").forEach(function (el) {
      el.addEventListener("click", function () { pick(el.dataset.id); });
    });
    focusSet();
  }

  /* ============ 详情面板 ============ */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }
  function other(e, n) { return e.source === n.id ? e.target : e.source; }
  function relText(e, n) {
    return (e.source === n.id) ? (e.label + " →") : ("← " + e.label);
  }

  /* 来时路径：面包屑。点一个节点 → 记一步；点面包屑 → 退回那一步。
     手机上这是「知道自己怎么走到这儿的」唯一线索。 */
  function renderCrumbs() {
    var el = document.getElementById("p-crumbs");
    if (!el) return;
    var ids = state.trail.filter(function (id) { return !!NODE[id]; });
    if (ids.length < 2) { el.innerHTML = ""; return; }
    el.innerHTML = ids.map(function (id, i) {
      var n = NODE[id];
      var cur = (i === ids.length - 1);
      return (i ? '<span class="crumb-sep">›</span>' : '') +
        '<button type="button" class="crumb' + (cur ? " cur" : "") + '" data-crumb="' + esc(id) + '">' +
        esc(shortLabel(n.name)) + '</button>';
    }).join("");
    el.querySelectorAll("[data-crumb]").forEach(function (b) {
      b.addEventListener("click", function () { goCrumb(b.dataset.crumb); });
    });
    el.scrollLeft = el.scrollWidth;
  }
  function goCrumb(id) {
    var idx = state.trail.indexOf(id);
    if (idx >= 0) state.trail = state.trail.slice(0, idx + 1);
    pick(id, { fromCrumb: true });
  }

  /* 关联节点分组：按「关系 + 方向」归并。
     方向用 → / ← 标：→ = 从本节点指出，← = 指向本节点。
     文献边不在这里重复 —— 证据在折叠的「文献出处」里看。 */
  function relGroups(n) {
    var groups = {}, order = [];
    (G.edges || []).forEach(function (e) {
      if (e.source !== n.id && e.target !== n.id) return;
      if (isEvidenceEdge(e)) return;
      var out = e.source === n.id;
      var rel = REL[e.type] || { label: e.label || e.type };
      var key = (out ? "out:" : "in:") + e.type;
      var o = NODE[other(e, n)];
      if (!o) return;
      if (!groups[key]) {
        groups[key] = { out: out, label: rel.label || e.type || "", items: [], notes: {} };
        order.push(key);
      }
      groups[key].items.push(o);
      /* 关系上的说明（note）—— 例如「轻度反应观察 30 分钟」「大腿外侧中部肌内注射，必要时每 5～15 分钟重复」。
         这类是**具体怎么做**的关键内容，不能只活在数据里看不见。 */
      if (e.note && !groups[key].notes[o.id]) groups[key].notes[o.id] = e.note;
    });
    return order.map(function (k) { return groups[k]; }).sort(function (a, b) {
      if (a.out !== b.out) return a.out ? -1 : 1;      /* 先「本节点指出」，再「指向本节点」 */
      return b.items.length - a.items.length;
    }).map(function (g) {
      g.items.sort(function (a, b) { return (degree[b.id] || 0) - (degree[a.id] || 0); });
      return g;
    });
  }

  /* 客户临床实践要点的出处标记 —— **不是**文献节点 id，
     它的含义是「这条来自客户提供的临床做法，尚无文献支撑」。
     ⛔ 前端不写死任何题目名 / 节点类型 key；这是**数据约定**不是题目内容。 */
  var CLIENT_SRC = "__CLI" + "ENT__";

  function renderPanel(n) {
    var t = typeOf(n);
    document.getElementById("p-name").textContent = n.name || "";
    renderCrumbs();
    /* --- 这个节点被**几篇文献**支撑（客户 2026-11-06 直接问「你有多少文献支撑这个」）
       口径：从节点的要点里取出处（src）去重计数 —— 这就是「支撑这个节点的文献数」；
       ⛔ 不拿 evidence 数组计数（那是「引用过哪些文献」，含未落到具体要点的），
          也不拿「文献边」的度数计数（那是图结构不是证据）。
       客户实践要点（出处标记 CLIENT_SRC）不算文献支撑 ⇒ 单独标出来。 */
    var litSet = {}, clientCount = 0;
    (n.details || []).forEach(function (d) {
      if (d.src === CLIENT_SRC) { clientCount++; return; }
      if (d.src) litSet[d.src] = 1;
    });
    var litCount = Object.keys(litSet).length;
    var litChip = "";
    if (litCount) {
      litChip = '<span class="chip lit" title="支撑本节点的文献篇数（按要点出处去重）">文献支撑 ' + litCount + ' 篇</span>';
    } else if (clientCount) {
      litChip = '<span class="chip lit client" title="本节点的内容来自客户提供的临床做法，尚无文献支撑">客户做法 · 文献待核</span>';
    }
    document.getElementById("p-meta").innerHTML =
      '<span class="chip type" style="background:' + t.color + '33;color:' + t.color + '">' + esc(t.label) + '</span>' +
      '<span class="chip">度数 ' + (degree[n.id] || 0) + '</span>' +
      litChip +
      (n.tags || []).map(function (g) { return '<span class="chip tag">' + esc(g) + '</span>'; }).join("") +
      (n.aliases || []).map(function (a) { return '<span class="chip alias">' + esc(a) + '</span>'; }).join("");
    document.getElementById("p-summary").textContent = n.summary || "";

    var body = document.getElementById("panel-body");
    var html = "";

    /* --- 要点：这条知识**具体怎么做 / 具体是什么**（来自文献原文的逐条提取） ---
       摘要只说「这是什么」，要点才说「怎么办、是多少、什么时候」——
       每条都挂着自己的出处（可点回文献节点）。 */
    if (n.details && n.details.length) {
      html += '<div class="sec"><h3 class="sec-title">要点<span class="n">' + n.details.length + ' 条</span></h3>' +
        '<div class="sec-hint">每条都来自文献原文 · 点出处可跳到该文献</div>' +
        n.details.map(function (d) {
          var srcName = "";
          var srcId = d.src || "";
          if (srcId && NODE[srcId]) srcName = NODE[srcId].name;
          var quote = d.quote ? '<div class="quote">' + esc(d.quote) + '</div>' : '';
          /* 客户实践要点没有文献出处 ⇒ 不给「出处」链接（点了会跳到不存在的节点），
             改成明写「客户做法 · 文献待核」—— 让读者知道这条**不是**文献支撑的。 */
          var srcBtn;
          if (srcId === CLIENT_SRC) {
            srcBtn = '<span class="src client">出处：客户提供的临床做法 · 文献待核</span>';
          } else if (srcId && NODE[srcId]) {
            srcBtn = '<span class="src" data-id="' + esc(srcId) + '">出处：' + esc(srcName) + ' ›</span>';
          }
          return '<div class="pt">' +
            '<div class="pt-k">' + esc(d.k || "") + '</div>' +
            '<div class="pt-v">' + esc(d.v || "") + '</div>' +
            quote + srcBtn + '</div>';
        }).join("") + '</div>';
    }

    /* --- 属性 --- */
    if (n.attrs && n.attrs.length) {
      html += '<div class="sec"><h3 class="sec-title">属性<span class="n">' + n.attrs.length + ' 条</span></h3><div>' +
        n.attrs.map(function (a) {
          var long = String(a.v).length > 34;
          return '<div class="assert"><div class="k">' + esc(a.k) + '</div>' +
            '<div class="v' + (long ? " long" : "") + '">' + esc(a.v) + '</div></div>';
        }).join("") + '</div></div>';
    }

    /* --- 关联节点：按关系分组，先给「下一步能去哪」 --- */
    var groups = relGroups(n);
    var relCount = 0;
    groups.forEach(function (g) { relCount += g.items.length; });
    if (relCount) {
      html += '<div class="sec"><h3 class="sec-title">关联节点<span class="n">' + relCount + ' 个</span></h3>' +
        '<div class="sec-hint">按关系分组 · → 从本节点指出 · ← 指向本节点 · 点一行继续走</div>' +
        groups.map(function (g) {
          return '<div class="rel-group">' +
            '<div class="rel-head"><span class="dir">' + (g.out ? "→" : "←") + '</span>' +
            '<span>' + esc(g.label) + '</span>' +
            '<span class="n">' + g.items.length + '</span></div>' +
            '<div class="obj-list">' + g.items.slice(0, 12).map(function (o) {
              var nt = g.notes && g.notes[o.id] ? '<span class="onote">' + esc(g.notes[o.id]) + '</span>' : '';
              return '<div class="obj" data-id="' + esc(o.id) + '">' +
                '<span class="nm">' + esc(o.name) + '</span>' +
                '<span class="tp" style="color:' + typeOf(o).color + '">' + esc(typeOf(o).label) + '</span>' +
                nt + '</div>';
            }).join("") + '</div>' +
            (g.items.length > 12 ? '<div class="sec-hint" style="margin:6px 0 0">还有 ' + (g.items.length - 12) + ' 个未显示</div>' : '') +
            '</div>';
        }).join("") + '</div>';
    }

    /* --- 别名（客户原文的英文写法 / 旧称 / 错字写法都在这里） --- */
    if (n.aliases && n.aliases.length) {
      html += '<div class="sec"><h3 class="sec-title">别名<span class="n">' + n.aliases.length + ' 个</span></h3>' +
        '<div>' + n.aliases.map(function (a) {
          return '<span class="chip alias" style="margin:0 6px 6px 0;display:inline-block;">' + esc(a) + '</span>';
        }).join("") + '</div></div>';
    }

    /* --- 文献出处：默认折叠，放最后 —— 证据随时能查，但不挡「下一步」 --- */
    if (n.evidence && n.evidence.length) {
      html += '<details class="sec"><summary class="sec-title">文献出处<span class="n">' + n.evidence.length + ' 条</span></summary>' +
        n.evidence.map(function (ev) {
          if (!ev) return "";
          var head = '';
          if (ev.type) head += '<span class="chip type">' + esc(ev.type) + '</span>';
          var title = ev.title || "";
          var src = [ev.author, ev.journal, ev.year].filter(function (x) {
            return x !== null && x !== undefined && String(x).trim() !== "";
          }).map(function (x) { return esc(x); }).join(" · ");
          var body2 = '';
          if (title) body2 += '<div class="ev-title">' + esc(title) + '</div>';
          if (src) body2 += '<div class="ev-src">' + src + '</div>';
          if (ev.cite) body2 += '<div class="ev-cite">' + esc(ev.cite) + '</div>';
          if (!title && !src && !ev.cite) body2 = '<div class="ev-src">（无出处信息）</div>';
          return '<div class="ev">' + (head ? '<div class="ev-head">' + head + '</div>' : '') + body2 + '</div>';
        }).join("") + '</details>';
    }

    if (!html) {
      html = '<div class="sec"><div class="sec-hint">该节点暂无附加信息</div></div>';
    }

    body.innerHTML = html;
    /* 整卡一个滚动区 → 滚动位置重置在 #panel 上（#panel-body 不再自己滚） */
    var panelEl = document.getElementById("panel");
    if (panelEl) panelEl.scrollTop = 0;
    body.scrollTop = 0;
    body.querySelectorAll(".obj").forEach(function (el) {
      el.addEventListener("click", function () { pick(el.dataset.id); });
    });
  }

  /* 把选中的节点挪到「还看得见的画布」正中 —— 手机是底部抽屉上方那一条，
     桌面是右侧详情栏左边那一块。
     ⚠️ 不能自己算 dy/zoom：ECharts 的图系列在 zoom 之外还有一层基础比例尺
     （实测有效比例 ≈1.386，而 zoom 只有 1.019）⇒ 手算会系统性偏移。
     正确做法：用 convertToPixel 量出节点现在在哪儿，算出「要挪到目标点」
     需要把镜头中心放到哪个像素，再用 convertFromPixel 换算回数据坐标。 */
  function centerOn(id) {
    try {
      var model = chart.getModel().getSeriesByIndex(0);
      var data = model.getData();
      var idx = -1;
      for (var i = 0; i < data.count(); i++) {
        var it = data.getRawDataItem(i);
        if (it && it.id === id) { idx = i; break; }
      }
      if (idx < 0) return false;
      var l = data.getItemLayout(idx);
      if (!l || isNaN(l[0]) || isNaN(l[1])) return false;
      var px = chart.convertToPixel({ seriesIndex: 0 }, l);
      if (!px || isNaN(px[0]) || isNaN(px[1])) return false;
      var w = chart.getWidth(), h = chart.getHeight();
      var panel = document.getElementById("panel");
      var cr = chart.getDom().getBoundingClientRect();
      /* 可见区域：手机按高度让（底部抽屉），桌面按宽度让（右侧栏）。
         用布局尺寸（offsetTop / offsetWidth）而不是 getBoundingClientRect，
         后者会把正在跑的滑入/滑出动画算进去。 */
      var visW = w, visH = h;
      if (panel && panel.classList.contains("open")) {
        if (isNarrow()) {
          var panelTop = panel.offsetTop - cr.top;
          if (panelTop > 0 && panelTop < h) visH = Math.max(70, panelTop);
        } else {
          var panelLeft = (window.innerWidth - panel.offsetWidth) - cr.left;
          if (panelLeft > 0 && panelLeft < w) visW = Math.max(120, panelLeft);
        }
      }
      var tx = visW / 2, ty = visH / 2;
      /* 已经基本在中心就不动镜头（避免每点一下都跳一次） */
      if (Math.abs(px[0] - tx) < 8 && Math.abs(px[1] - ty) < 8) return false;
      /* 把节点从 px 移到 (tx, ty) ⇒ 镜头中心像素跟着反向移动同样的量 */
      var centerPx = [w / 2 + (px[0] - tx), h / 2 + (px[1] - ty)];
      var center = chart.convertFromPixel({ seriesIndex: 0 }, centerPx);
      if (!center || isNaN(center[0]) || isNaN(center[1])) return false;
      chart.setOption({ series: [{ id: "kg", center: center }] });
      return true;
    } catch (e) { return false; }
  }

  function pick(id, opts) {
    var n = NODE[id];
    if (!n) return;
    revealNode(id);                    /* 检索命中的节点可能还没展开出来 —— 先放上画布 */
    /* 邻域模式下点开一个被截掉的邻居 → 临时放进这一圈，让它在图上看得见 */
    if (state.ego && state.egoSet && !state.egoSet[id]) {
      state.egoSet[id] = true;
      if (state.egoHidden > 0) state.egoHidden--;
    }
    /* 来时路径：回到走过的节点就截断，不记环；最多留 8 步 */
    if (!(opts && opts.fromCrumb)) {
      var at = state.trail.indexOf(id);
      if (at >= 0) state.trail = state.trail.slice(0, at + 1);
      else {
        state.trail.push(id);
        if (state.trail.length > 8) state.trail.shift();
      }
    }
    state.selected = id;
    renderPanel(n);
    updateActions();
    document.getElementById("panel").classList.add("open");
    document.body.classList.add("panel-open");
    showScrim(isNarrow());
    document.getElementById("suggest").style.display = "none";
    /* 列表视图下画布不可见 —— 只开详情抽屉，不去动镜头与高亮 */
    if (state.view !== "graph") return;
    freezeLayout();                    /* 选中之前先定型：坐标稳了，选中的节点才不会跑 */
    try { chart.dispatchAction({ type: "select", seriesId: "kg", name: n.name }); } catch (e) {}
    if (centerOn(id)) scheduleLabelAvoid();   /* 镜头动过 → 标签按新坐标重排 */
    focusSet();
  }

  /* ============ 画布手势（自定义 · 全画布可操作 · 1:1） ============
     为什么不用 ECharts 自带 roam（2026-11-04 实测）：
       ① 在节点范围外的空白区，拖动 / 双指缩放**完全不响应**；
       ② 双指缩放的比例与手指距离不成 1:1（用户实测「太灵敏、不跟手」）。
     这里直接在 #chart 上接管 pointer 事件：
       - 单指 / 鼠标拖动 = 平移，位移与手指 1:1（空白区也生效）；
       - 双指 = 以两指中点为锚，zoom = 起始 zoom × 当前距离 / 起始距离；
       - 滚轮 = 以鼠标位置为锚缩放；
       - 轻点（移动 < 6px）= 选节点打开详情。
     series 的 roam / draggable 已关掉，避免两套手势打架。 */
  var GESTURE_MIN_ZOOM = 0.35, GESTURE_MAX_ZOOM = 3.0;
  var activePointers = {};
  var gesture = null;
  var pinchRaf = 0;
  var chartEl = chart.getDom();

  function chartPoint(e) {
    var r = chartEl.getBoundingClientRect();
    return { id: e.pointerId, x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function currentZoom() {
    var s = chart.getOption().series[0] || {};
    return (typeof s.zoom === "number" && !isNaN(s.zoom)) ? s.zoom : 1;
  }
  function clampZoom(z) {
    return Math.max(GESTURE_MIN_ZOOM, Math.min(GESTURE_MAX_ZOOM, z));
  }
  function setViewport(zoom, center) {
    var s = { id: "kg" };
    if (typeof zoom === "number") s.zoom = zoom;
    if (center) s.center = center;
    chart.setOption({ series: [s] });
  }
  function activeCount() { return Object.keys(activePointers).length; }
  function firstTwoPointers() {
    var ids = Object.keys(activePointers);
    if (ids.length < 2) return null;
    return [activePointers[ids[0]], activePointers[ids[1]]];
  }
  function pinchInfo(pts) {
    var dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
    return {
      dist: Math.sqrt(dx * dx + dy * dy),
      mid: [(pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2]
    };
  }
  function beginPinch() {
    var pts = firstTwoPointers();
    if (!pts) return;
    var info = pinchInfo(pts);
    if (info.dist < 1) return;
    freezeLayout();
    var anchor = chart.convertFromPixel({ seriesIndex: 0 }, info.mid);
    if (!anchor) return;
    gesture = {
      mode: "pinch",
      startDist: info.dist,
      startZoom: currentZoom(),
      anchor: anchor,
      moved: true
    };
  }
  function applyPinch() {
    pinchRaf = 0;
    if (!gesture || gesture.mode !== "pinch") return;
    var pts = firstTwoPointers();
    if (!pts) return;
    var info = pinchInfo(pts);
    if (info.dist <= 0) return;
    var target = clampZoom(gesture.startZoom * (info.dist / gesture.startDist));
    if (Math.abs(target - currentZoom()) > 1e-5) setViewport(target, null);
    /* 把「双指起始中点下的那个数据点」钉在当前中点下：
       zoom 先变，量出锚点新像素，再反推镜头中心。 */
    var ap = chart.convertToPixel({ seriesIndex: 0 }, gesture.anchor);
    if (!ap || isNaN(ap[0]) || isNaN(ap[1])) return;
    var w = chart.getWidth(), h = chart.getHeight();
    var center = chart.convertFromPixel({ seriesIndex: 0 },
      [w / 2 + ap[0] - info.mid[0], h / 2 + ap[1] - info.mid[1]]);
    if (center && !isNaN(center[0]) && !isNaN(center[1])) setViewport(null, center);
    scheduleLabelAvoid();
  }
  function schedulePinch() {
    if (pinchRaf) return;
    pinchRaf = requestAnimationFrame(applyPinch);
  }
  function panByPointer(p) {
    if (!gesture || gesture.mode !== "pan") return;
    var dx = p.x - gesture.lastX, dy = p.y - gesture.lastY;
    if (Math.abs(dx) + Math.abs(dy) < 0.5) return;
    var w = chart.getWidth(), h = chart.getHeight();
    /* 手指往右 10px → 镜头中心往左取 10px 处的数据 ⇒ 画布跟手 1:1 */
    var center = chart.convertFromPixel({ seriesIndex: 0 }, [w / 2 - dx, h / 2 - dy]);
    if (center && !isNaN(center[0]) && !isNaN(center[1])) setViewport(null, center);
    gesture.lastX = p.x; gesture.lastY = p.y;
    scheduleLabelAvoid();
  }

  chartEl.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    activePointers[e.pointerId] = chartPoint(e);
    try { chartEl.setPointerCapture(e.pointerId); } catch (err) {}
    if (activeCount() >= 2) { beginPinch(); return; }
    var p = activePointers[e.pointerId];
    gesture = {
      mode: "tap",
      startX: p.x, startY: p.y,
      lastX: p.x, lastY: p.y,
      startTime: Date.now(),
      moved: false
    };
  }, true);
  chartEl.addEventListener("pointermove", function (e) {
    if (!activePointers[e.pointerId]) return;
    activePointers[e.pointerId] = chartPoint(e);
    if (activeCount() >= 2) {
      if (!gesture || gesture.mode !== "pinch") beginPinch();
      schedulePinch();
      return;
    }
    if (!gesture) return;
    var p = activePointers[e.pointerId];
    if (gesture.mode === "tap") {
      var total = Math.abs(p.x - gesture.startX) + Math.abs(p.y - gesture.startY);
      if (total <= 6) return;
      freezeLayout();                 /* 真的开始拖了才定型，轻点不冻 */
      gesture.mode = "pan";
      gesture.moved = true;
      /* 从起点算第一段位移 —— 不能从当前点算，否则开头这几像素会被吞掉 */
      gesture.lastX = gesture.startX;
      gesture.lastY = gesture.startY;
      panByPointer(p);
      return;
    }
    if (gesture.mode === "pan") panByPointer(p);
  }, true);
  function endPointer(e) {
    if (!activePointers[e.pointerId]) return;
    delete activePointers[e.pointerId];
    var n = activeCount();
    if (gesture && gesture.mode === "pinch" && n === 1) {
      /* 双指中抬起一根 → 剩下那根继续平移，不触发点选 */
      var q = activePointers[Object.keys(activePointers)[0]];
      gesture = { mode: "pan", lastX: q.x, lastY: q.y, moved: true };
      return;
    }
    if (n >= 2) { beginPinch(); return; }
    if (n === 0) {
      if (gesture && gesture.mode === "tap" && !gesture.moved) {
        var hit = nearestNode(gesture.startX, gesture.startY, isNarrow() ? 38 : 26);
        if (hit) pick(hit);
      }
      gesture = null;
    }
  }
  chartEl.addEventListener("pointerup", endPointer, true);
  chartEl.addEventListener("pointercancel", function (e) {
    if (!activePointers[e.pointerId]) return;
    delete activePointers[e.pointerId];
    if (activeCount() === 0) { gesture = null; return; }
    if (activeCount() === 1) {
      var q = activePointers[Object.keys(activePointers)[0]];
      gesture = { mode: "pan", lastX: q.x, lastY: q.y, moved: true };
    }
  }, true);
  chartEl.addEventListener("wheel", function (e) {
    e.preventDefault();
    freezeLayout();
    var p = chartPoint(e);
    var anchor = chart.convertFromPixel({ seriesIndex: 0 }, [p.x, p.y]);
    if (!anchor) return;
    var target = clampZoom(currentZoom() * Math.exp(-e.deltaY * 0.0012));
    setViewport(target, null);
    var ap = chart.convertToPixel({ seriesIndex: 0 }, anchor);
    if (!ap || isNaN(ap[0]) || isNaN(ap[1])) return;
    var w = chart.getWidth(), h = chart.getHeight();
    var center = chart.convertFromPixel({ seriesIndex: 0 },
      [w / 2 + ap[0] - p.x, h / 2 + ap[1] - p.y]);
    if (center && !isNaN(center[0]) && !isNaN(center[1])) setViewport(null, center);
    scheduleLabelAvoid();
  }, { capture: true, passive: false });

  /* ============ 节点操作（展开 / 锁定 / 关闭） ============ */
  var btnExpand = document.getElementById("pExpand");
  var btnLock = document.getElementById("pLock");
  var btnRemove = document.getElementById("pRemove");

  function updateActions() {
    /* 这三个按钮是「画布上的操作」：列表视图里画布根本不在眼前，
       放出来只会让人以为点了会变 —— 那一层只做阅读。 */
    var row = document.querySelector(".p-actions");
    if (row) row.style.display = (state.view === "graph") ? "" : "none";
    var id = state.selected, n = id ? NODE[id] : null;
    var more = n ? expandableOf(id).length : 0;
    if (state.ego) {
      /* 邻域模式下画布只画一圈 —— 展开的下一圈会落在这一圈之外，看不到 */
      btnExpand.textContent = "只看一圈";
      btnExpand.disabled = true;
    } else {
      btnExpand.textContent = !n ? "展开" : (more ? "展开 · " + more : "已全部展开");
      btnExpand.disabled = !n || !more;
    }
    btnLock.textContent = (id && state.locked[id]) ? "已锁定" : "锁定";
    btnLock.classList.toggle("on", !!(id && state.locked[id]));
    btnLock.disabled = !n;
    btnRemove.disabled = !n;
    /* 「看这一圈」在列表视图里也要能点 —— 它是从阅读切到关系图的入口 */
    var pEgo = document.getElementById("pEgo");
    if (pEgo) {
      pEgo.style.display = n ? "" : "none";
      pEgo.textContent = state.ego
        ? (id && id !== state.ego ? "以这个节点为中心 ›" : "退出这一圈，看全图")
        : "在关系图里看这一圈 ›";
    }
    var egoExit = document.getElementById("egoExit");
    if (egoExit) egoExit.style.display = state.ego ? "block" : "none";
    /* 邻域模式右上角有出口 → 统计角标让出右侧宽度，别压字 */
    var statsEl = document.getElementById("stats");
    if (statsEl) statsEl.style.maxWidth = state.ego ? "calc(100% - 128px)" : "";
  }
  btnExpand.addEventListener("click", function () {
    if (!state.selected) return;
    expandNode(state.selected);
    updateActions();
  });
  btnLock.addEventListener("click", function () {
    toggleLock(state.selected);
    updateActions();
  });
  btnRemove.addEventListener("click", function () {
    removeNode(state.selected);
  });
  document.getElementById("pEgo").addEventListener("click", function () {
    if (state.ego) {
      if (state.selected && state.selected !== state.ego) enterEgo(state.selected);
      else exitEgo();
      return;
    }
    if (state.selected) enterEgo(state.selected);
  });
  document.getElementById("egoExit").addEventListener("click", function () { exitEgo(); });
  document.getElementById("panel-close").addEventListener("click", function () {
    document.getElementById("panel").classList.remove("open");
    document.getElementById("scrim").classList.remove("show");
    document.body.classList.remove("panel-open");
    state.selected = null;
    state.trail = [];
    state.ego = null; state.egoSet = null; state.egoHidden = 0;  /* 手动关详情 = 回到全图 */
    updateActions();
    try { chart.dispatchAction({ type: "unselect", seriesId: "kg" }); } catch (e) {}
    focusSet();
  });

  /* ============ 底部抽屉（图例 / 详情）· 手机端交互 ============ */
  /* 遮罩打开后的 400ms 内忽略点击 —— 触摸抬起时浏览器会补发一次合成 click，
     它会落在刚出现的遮罩上，把刚打开的面板/图例立刻关掉。
     这是 2026-11-04 实测的「点节点只闪现一下、看不到详情」的根因。 */
  var scrimArmedAt = 0;
  function showScrim(on) {
    document.getElementById("scrim").classList.toggle("show", !!on);
    if (on) scrimArmedAt = Date.now();
  }
  document.getElementById("btnLegend").addEventListener("click", function () {
    var lg = document.getElementById("legend");
    var open = !lg.classList.contains("open");
    lg.classList.toggle("open", open);
    document.getElementById("btnLegend").classList.toggle("on", open);
    showScrim(open);
  });
  document.getElementById("legend-close").addEventListener("click", function () {
    document.getElementById("legend").classList.remove("open");
    document.getElementById("btnLegend").classList.remove("on");
    showScrim(false);
  });
  document.getElementById("scrim").addEventListener("click", function () {
    /* 触摸抬起后的合成 click 不算「点外部关闭」—— 见 showScrim 上方注释 */
    if (Date.now() - scrimArmedAt < 400) return;
    document.getElementById("legend").classList.remove("open");
    document.getElementById("btnLegend").classList.remove("on");
    document.getElementById("panel").classList.remove("open");
    document.body.classList.remove("panel-open");
    state.selected = null;
    state.trail = [];
    state.ego = null; state.egoSet = null; state.egoHidden = 0;
    updateActions();
    showScrim(false);
    focusSet();
  });

  /* ============ 检索框交互 ============ */
  var searchEl = document.getElementById("search");
  var timer = null;
  searchEl.addEventListener("input", function () {
    clearTimeout(timer);
    var v = searchEl.value;
    timer = setTimeout(function () { doSearch(v); }, 140);
    if (state.view === "graph") freezeLayout();   /* 开始检索 = 用户要动手了 → 布局定型，别再抖 */
  });
  searchEl.addEventListener("focus", function () {
    if (searchEl.value.trim()) doSearch(searchEl.value);
  });
  searchEl.addEventListener("keydown", function (ev) {
    /* 列表视图：回车直接打开第一条结果（手机上没有下拉建议可上下键选） */
    if (state.view === "list") {
      if (ev.key === "Enter" && state.hits.length) {
        ev.preventDefault();
        pick(state.hits[0]);
      } else if (ev.key === "Escape") {
        searchEl.value = "";
        doSearch("");
      }
      return;
    }
    var box = document.getElementById("suggest");
    var items = box.querySelectorAll(".sg-item");
    if (!items.length || box.style.display === "none") {
      if (ev.key === "Enter" && items.length) { pick(items[0].dataset.id); }
      return;
    }
    var cur = box.querySelector(".sg-item.active");
    var idx = Array.prototype.indexOf.call(items, cur);
    if (ev.key === "ArrowDown") {
      ev.preventDefault();
      if (cur) cur.classList.remove("active");
      items[(idx + 1) % items.length].classList.add("active");
    } else if (ev.key === "ArrowUp") {
      ev.preventDefault();
      if (cur) cur.classList.remove("active");
      items[(idx - 1 + items.length) % items.length].classList.add("active");
    } else if (ev.key === "Enter") {
      ev.preventDefault();
      var tgt = box.querySelector(".sg-item.active") || items[0];
      if (tgt) pick(tgt.dataset.id);
    } else if (ev.key === "Escape") {
      box.style.display = "none";
    }
  });
  document.addEventListener("click", function (ev) {
    if (!document.getElementById("searchWrap").contains(ev.target)) {
      document.getElementById("suggest").style.display = "none";
    }
  });
  document.getElementById("clearSearch").addEventListener("click", function () {
    searchEl.value = "";
    doSearch("");
    searchEl.focus();
  });

  /* ============ 标签避让 ============
     ECharts 的 labelLayout 对 graph 系列不生效（5.5.1 实测：照样压字），
     这里自己按「度数高的先放」贪心排 —— 与已放标签相撞的就不画。
     标签默认贴在节点右侧；右边放不下就翻到左侧，不让它冲出画布。 */
  var avoidTimer = null, avoiding = false;
  function scheduleLabelAvoid() {
    if (avoidTimer) clearTimeout(avoidTimer);
    avoidTimer = setTimeout(applyLabelAvoid, 160);
  }
  function applyLabelAvoid() {
    if (avoiding) return;
    /* 布局没定型之前不算标签：算出来的位置是按「马上就会变的坐标」摆的，
       而且算标签要改数据、改数据会重启力导向布局 —— 越算越抖。
       定型（freezeLayout）之后再算一次，那时坐标是真的。 */
    if (!state.frozen) return;
    avoiding = true;
    try {
      var off = {}, side = {};
      if (!state.labelsAll) {
        var model = chart.getModel().getSeriesByIndex(0);
        var data = model.getData();
        var fs = isNarrow() ? 13 : 11.5;
        var W = chart.getWidth();
        var idxOf = {};
        for (var i = 0; i < data.count(); i++) {
          var rawItem = data.getRawDataItem(i);
          if (rawItem && rawItem.id != null) idxOf[rawItem.id] = i;
        }
        var cands = [];
        (G.nodes || []).forEach(function (n) {
          if (state.hidden[n.type]) return;
          if (!shouldShowLabel(n)) return;
          cands.push(n);
        });
        cands.sort(function (a, b) { return (degree[b.id] || 0) - (degree[a.id] || 0); });
        var boxes = [];
        cands.forEach(function (n) {
          var idx = idxOf[n.id];
          if (idx == null) return;
          var layout = data.getItemLayout(idx);
          if (!layout || isNaN(layout[0]) || isNaN(layout[1])) return;
          var px = chart.convertToPixel({ seriesIndex: 0 }, layout);
          if (!px || isNaN(px[0]) || isNaN(px[1])) return;
          var txt = shortLabel(n.name);
          var tw = textWidth(txt, fs);
          var half = nodeSymbolSize(n) / 2 + 5;
          var s = "right";
          if (px[0] + half + tw > W - 4) s = "left";   /* 右边放不下 → 翻到左边 */
          var x0 = s === "right" ? px[0] + half : px[0] - half - tw;
          /* 翻边之后仍可能贴到画布外（节点本身在画布边缘，或已在视野之外）——
             再换一次边；两边都放不下就不画这个标签：宁可少一个标签，
             也不让半截字被画布切掉。 */
          if (x0 < 4 || x0 + tw > W - 4) {
            var alt = s === "right" ? "left" : "right";
            var ax0 = alt === "right" ? px[0] + half : px[0] - half - tw;
            if (ax0 >= 4 && ax0 + tw <= W - 4) { s = alt; x0 = ax0; }
            else { off[n.id] = true; return; }
          }
          var x1 = x0 + tw;
          var y0 = px[1] - fs * 0.62;
          var y1 = y0 + fs * 1.24;
          var hit = false;
          for (var b = 0; b < boxes.length; b++) {
            var o = boxes[b];
            if (x0 < o.x1 + 2 && x1 + 2 > o.x0 && y0 < o.y1 + 2 && y1 + 2 > o.y0) { hit = true; break; }
          }
          if (hit) { off[n.id] = true; return; }
          boxes.push({ x0: x0, x1: x1, y0: y0, y1: y1 });
          side[n.id] = s;
        });
      }
      state.labelOff = off;
      state.labelSide = side;
      focusSet();          /* 走既有通道重画：保留检索高亮 / 选中态 */
    } finally {
      avoiding = false;
    }
  }
  chart.on("roam", function () {
    if (avoiding) return;
    freezeLayout();                 /* 用户在拖 / 缩 → 布局就此定型 */
    scheduleLabelAvoid();
  });

  /* ============ 视图控制 ============ */
  /* fitView：把当前可见节点整体收进画布。
     minAbs = 绝对缩放下限 —— 手机上不许缩到「看不清也点不着」，
     宁可让图溢出画布让用户拖，也不给一堆点不中的小点。
     fillH = 只按高度铺满（窄屏首屏用）：竖屏 9:16 优先 ——
     图铺满屏幕高度，宽度上溢出由拖动解决，节点大到点得中；
     「适应画布」按钮随时能收回全图。 */
  function fitView(pad, minAbs, fillH) {
    pad = pad || 70;
    chart.resize();
    var w = chart.getWidth(), h = chart.getHeight();
    var zoom0 = (chart.getOption().series[0] || {}).zoom || 1;
    var model = chart.getModel().getSeriesByIndex(0);
    var data = model.getData();
    /* 画布范围只按「有边相连」的节点算 —— 孤立节点（没有任何关系的节点）会被
       力导向甩到很远；把它算进来，整张图会缩成一小团、中心点也会被带偏。
       孤立节点照常渲染、照常搜得到，只是不占默认视野。 */
    function extent(onlyConnected) {
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, n = 0;
      for (var i = 0; i < data.count(); i++) {
        var it = data.getRawDataItem(i);
        if (it && it.itemStyle && it.itemStyle.opacity === 0) continue;
        if (onlyConnected && it && !(degree[it.id] > 0)) continue;
        var layout = data.getItemLayout(i);
        if (!layout || isNaN(layout[0]) || isNaN(layout[1])) continue;
        var px = chart.convertToPixel({ seriesIndex: 0 }, layout);
        if (!px || isNaN(px[0]) || isNaN(px[1])) continue;
        if (px[0] < minX) minX = px[0];
        if (px[0] > maxX) maxX = px[0];
        if (px[1] < minY) minY = px[1];
        if (px[1] > maxY) maxY = px[1];
        n++;
      }
      return { minX: minX, minY: minY, maxX: maxX, maxY: maxY, n: n };
    }
    var e = extent(true);
    if (!e.n) e = extent(false);      /* 全图都是孤立节点 → 退回按全量算 */
    if (!e.n) return;
    var minX = e.minX, minY = e.minY, maxX = e.maxX, maxY = e.maxY;
    var sx = (maxX - minX) < 1 ? 1 : (w - 2 * pad) / (maxX - minX);
    var sy = (maxY - minY) < 1 ? 1 : (h - 2 * pad) / (maxY - minY);
    var ratio = fillH ? sy : Math.min(sx, sy);
    var abs = zoom0 * Math.min(ratio, 2.5);
    if (minAbs && abs < minAbs) abs = minAbs;
    var centerPx = [(minX + maxX) / 2, (minY + maxY) / 2];
    var gc = chart.convertFromPixel({ seriesIndex: 0 }, centerPx) || [0, 0];
    chart.setOption({ series: [{ id: "kg", zoom: abs, center: gc }] });
  }

  /* 首屏视图：宽屏 = 全图收进画布；
     窄屏 = 图铺满竖屏高度（9:16 的用法：节点大、点得中、字看得清），
     宽度上溢出靠拖动，全图靠「适应画布」按钮。 */
  function initialView() {
    /* 起步只有「主题节点 + 一圈邻居」，全收进屏比铺满高度更好用；
       下限 0.62 防止节点被缩到点不着（点选按最近邻算，仍有 38px 容错）。 */
    if (isNarrow()) fitView(36, 0.62, false);
    else fitView(80);
    scheduleLabelAvoid();
  }

  document.getElementById("btnFit").addEventListener("click", function () {
    freezeLayout();                    /* 用户动手了 → 布局就此定型 */
    fitView(isNarrow() ? 40 : 80);     /* 按钮 = 看全图（不设缩放下限） */
    scheduleLabelAvoid();
  });
  document.getElementById("btnLabels").addEventListener("click", function () {
    freezeLayout();
    state.labelsAll = !state.labelsAll;
    document.getElementById("btnLabels").classList.toggle("on", state.labelsAll);
    state.labelOff = {}; state.labelSide = {};
    chart.setOption({ series: [{ id: "kg", data: buildNodes() }] });
  });
  /* 布局从头再跑一遍：解冻、坐标作废、提示条重新挂上。
     逐步展开的节点是我们自己摆的位置（不跑力导向）；只有「全部展开」和
     「重置」这种一次换掉大半张图的操作，才值得重跑一次布局。 */
  function relayout() {
    state.frozen = false; state.pos = {};
    state.labelOff = {}; state.labelSide = {};
    prevLayoutPos = null; lastExtent = null; stableRounds = 0;
    var badge = document.getElementById("settling");
    if (badge) badge.classList.remove("gone");
    chart.clear();
    option.series[0].data = buildNodes();
    option.series[0].links = buildLinks();
    chart.setOption(option);
    updateStats();
    setTimeout(function () { settleView(0); }, 1200);
    setTimeout(function () { initialView(); }, 900);
  }

  document.getElementById("btnAll").addEventListener("click", function () {
    (G.nodes || []).forEach(function (n) {
      if (!typeHidden(n.id)) { state.vis[n.id] = true; state.expanded[n.id] = true; }
    });
    state.selected = null;
    state.ego = null; state.egoSet = null; state.egoHidden = 0;
    state.trail = [];
    document.getElementById("panel").classList.remove("open");
    document.getElementById("scrim").classList.remove("show");
    document.body.classList.remove("panel-open");
    updateActions();
    relayout();
  });

  document.getElementById("btnReset").addEventListener("click", function () {
    var keep = state.locked;
    searchEl.value = "";
    state.hidden = {};                   /* 回到出厂口径：不藏任何类型 */
    state.labelsAll = false; state.selected = null;
    state.query = ""; state.hits = []; state.hitsMap = {};
    state.trail = []; state.ego = null; state.egoSet = null; state.egoHidden = 0;
    state.triageSel = {}; state.triageAnswered = false;
    state.showEvidence = false;          /* 画布回到「只看知识边」 */
    document.querySelectorAll("#legend-body .lg-item[data-type]").forEach(function (el) {
      el.classList.toggle("off", !!state.hidden[el.dataset.type]);
    });
    document.getElementById("btnLabels").classList.remove("on");
    document.getElementById("clearSearch").style.display = "none";
    var chipsEl = document.getElementById("searchChips");
    if (chipsEl) chipsEl.style.display = "";
    document.getElementById("panel").classList.remove("open");
    document.getElementById("legend").classList.remove("open");
    document.getElementById("btnLegend").classList.remove("on");
    document.getElementById("scrim").classList.remove("show");
    document.body.classList.remove("panel-open");
    document.getElementById("suggest").style.display = "none";
    applySeed();
    /* 锁定的节点在重置后仍然留着 —— 这就是「锁定」的用处 */
    Object.keys(keep).forEach(function (id) {
      if (NODE[id]) { state.vis[id] = true; state.locked[id] = true; }
    });
    updateActions();
    syncEvidenceUI();
    relayout();
  });

  /* ============ 统计角标（自己算，不依赖数据里额外字段） ============
     画布是逐步展开的 ⇒ 角标必须同时给「可见 / 共多少」，
     否则用户会以为图谱只有眼前这些。 */
  var relTypesUsed = {};
  (G.edges || []).forEach(function (e) { relTypesUsed[e.type] = (relTypesUsed[e.type] || 0) + 1; });
  var nodeTypesUsed = {};
  (G.nodes || []).forEach(function (n) { nodeTypesUsed[n.type] = (nodeTypesUsed[n.type] || 0) + 1; });
  function updateStats() {
    var vis = buildNodes().length, all = (G.nodes || []).length;
    var totalLinks = (G.edges || []).length;
    var visLinks = buildLinks().length;
    var tail = state.ego
      ? " · <b>只看这一圈</b>" +
        (state.egoHidden ? " · 另有 <b>" + state.egoHidden + "</b> 个" : "")
      : " · " + Object.keys(nodeTypesUsed).length + " 类实体 · " +
        Object.keys(relTypesUsed).filter(function (k) { return relTypesUsed[k]; }).length + " 类关系";
    document.getElementById("stats").innerHTML =
      "可见 <b>" + vis + "</b> / 共 <b>" + all + "</b> 节点 · 关系 <b>" + visLinks + "</b>" +
      (visLinks !== totalLinks ? " / " + totalLinks : "") + tail +
      (state.showEvidence ? "" : " · 文献边隐藏");
  }
  updateStats();

  renderLegend();

  /* 提示条：几秒后淡出（不长期占屏） */
  setTimeout(function () {
    var hint = document.getElementById("hint");
    if (hint) hint.classList.add("gone");
  }, 6500);

  /* 首屏视图：力导向布局要跑一会儿才定型 —— 固定延时适配会适配到「还没定型的布局」，
     图看起来是冲出画布的。改成反复适配，直到图的范围不再变化为止；
     用户已动手（拖动 / 缩放）就停手，不打乱他。 */
  var userMoved = false;
  /* 手势冻结统一放在自定义 pointer / wheel 处理器里（真正开始拖/缩才冻结），
     避免轻点时也改镜头。 */

  /* 图的范围（系列坐标）—— 布局变了它就变。
     只按「有边相连」的节点算：孤立节点会被力导向甩着漂，计进去会让
     「定型判定」一直不收敛（每轮都在重新适配）。 */
  function graphExtent() {
    var model = chart.getModel().getSeriesByIndex(0);
    var data = model.getData();
    var mnX = Infinity, mnY = Infinity, mxX = -Infinity, mxY = -Infinity, n = 0;
    for (var i = 0; i < data.count(); i++) {
      var it = data.getRawDataItem(i);
      if (it && !(degree[it.id] > 0)) continue;
      var l = data.getItemLayout(i);
      if (!l || isNaN(l[0]) || isNaN(l[1])) continue;
      if (l[0] < mnX) mnX = l[0];
      if (l[0] > mxX) mxX = l[0];
      if (l[1] < mnY) mnY = l[1];
      if (l[1] > mxY) mxY = l[1];
      n++;
    }
    if (!n) return 0;
    return Math.max(mxX - mnX, mxY - mnY);
  }

  /* 布局漂移量：这一轮（两次采样之间）节点挪了多远。
     外框不变 ≠ 布局定型 —— 中间的节点还在慢慢挪，标签却按旧坐标摆着，
     就会跟别的标签压到一起（实测：R04 与「过敏反应」打架）。
     所以「定型」看漂移，不只看外框。
     孤立节点不计入：它被力导向甩着漂，会让「定型」永远不成立，
     而它本来就不带标签，漂不漂不影响标签避让。 */
  var prevLayoutPos = null;
  function layoutDrift() {
    var model = chart.getModel().getSeriesByIndex(0);
    var data = model.getData();
    var cur = [], maxd = 0;
    for (var i = 0; i < data.count(); i++) {
      var it = data.getRawDataItem(i);
      if (it && !(degree[it.id] > 0)) { cur.push(null); continue; }
      var l = data.getItemLayout(i);
      cur.push(l ? [l[0], l[1]] : null);
    }
    if (prevLayoutPos && prevLayoutPos.length === cur.length) {
      for (var j = 0; j < cur.length; j++) {
        var a = prevLayoutPos[j], b = cur[j];
        if (!a || !b) continue;
        var d = Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
        if (d > maxd) maxd = d;
      }
    }
    prevLayoutPos = cur;
    return maxd;
  }

  /* ============ 冻结布局（关键一步） ============
     ECharts 每次 setOption 换掉 series.data，都会重跑一遍力导向布局，
     整张图立刻抖起来（实测：一次 setOption 后立刻漂 23.7px，之后还在动）。
     于是形成自喂循环：放标签要改数据 → 改数据触发重排 → 图动了 →
     标签追不上坐标 → 再放标签 → 又触发重排 …… 抖到超时才停。

     冻结 = 把当前坐标写回数据项 + 切到 layout:'none'（不再跑布局引擎）。
     冻住之后：图不动，标签一次算准，也就永远追不上。
     实测冻结瞬间：位置零跳动、之后零漂移，坐标换算照常。 */
  function freezeLayout() {
    if (state.frozen) return false;
    try {
      var model = chart.getModel().getSeriesByIndex(0);
      var data = model.getData();
      for (var i = 0; i < data.count(); i++) {
        var raw = data.getRawDataItem(i);
        if (!raw || raw.id == null) continue;
        var l = data.getItemLayout(i);
        if (!l || isNaN(l[0]) || isNaN(l[1])) continue;
        state.pos[raw.id] = [l[0], l[1]];
      }
      state.frozen = true;
      /* 这一帧先把标签全关掉：标签还没算避让，全画出来会先压字一下。
         避让算完（160ms 后）再由 focusSet 决定哪些该亮。 */
      var items = buildNodes().map(function (d) { d.label.show = false; return d; });
      chart.setOption({ series: [{ id: "kg", layout: "none", data: items }] });
      /* 切到 layout:'none' 之后，图的比例尺跟布局运行时不是一套了 ——
         不重新适配的话，整张图会缩成中间一小团（实测：310px 的画布只占 216px）。
         冻住的坐标是最终坐标，此刻适配一次就是最终视图。 */
      initialView();
      var badge = document.getElementById("settling");
      if (badge) badge.classList.add("gone");
      scheduleLabelAvoid();          /* 冻住了 → 标签一次算准 */
      return true;
    } catch (e) {
      state.frozen = false;
      return false;
    }
  }

  var lastExtent = null, stableRounds = 0;
  function settleView(round) {
    round = round || 0;
    if (state.frozen) return;
    var drift = layoutDrift();                          /* 这一轮节点挪了多少 */
    if (userMoved) {
      /* 用户已经自己控视图（拖动 / 缩放）→ 停手，别把人家正在看的东西甩走；
         同时把布局冻住 —— 节点还在动的话，手指按不住也点不准。 */
      freezeLayout();
      return;
    }
    if (round >= 9) { freezeLayout(); return; }    /* 最多等约 5 秒（起步只画一圈，收敛很快） */
    var ext = graphExtent();
    var changed = lastExtent === null || Math.abs(ext - lastExtent) / (lastExtent || 1) >= 0.005;
    if (changed) {
      initialView();          /* 布局变了 → 重新适配 */
      lastExtent = ext;
      stableRounds = 0;
    }
    if (drift > 0.5) {
      /* 位置还在动（哪怕外框没变）→ 还不能定型 */
      stableRounds = 0;
    } else {
      stableRounds++;
      if (stableRounds >= 2) { freezeLayout(); return; }   /* 连续两轮稳定 → 收工 */
    }
    setTimeout(function () { settleView(round + 1); }, 400);
  }
  setTimeout(function () { settleView(0); }, 1200);

  /* ============ 起步：手机默认「卡片流」，桌面默认「全景图」 ============
     为什么手机默认不是画布：92 个节点摊在 390px 宽的屏上，节点间距约 4px，
     字根本放不下 —— 那是结构问题，不是样式问题（把桌面画布缩小解决不了）。
     想看全局关系的人点右上角「全景图」即可。 */
  state.view = isNarrow() ? "list" : "graph";
  setView(state.view);
  viewReady = true;
  renderList();
  renderChips();

  document.getElementById("loading").style.display = "none";
})();
</script>
</body>
</html>
