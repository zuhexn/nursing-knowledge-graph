<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱</title>
  <style>
  :root{
    /* ---- 浅蓝主题（客户 2026-11-06：「底色换一个吧」→ 客户定「浅蓝色吧」）----
       口径：**页面底浅蓝 · 卡片近白 · 文字深蓝黑 · 强调色各压深一档**
       —— 浅底上原来的暖金 #a86404 / 亮蓝 #1d5fb0 对比度不足，浅底上要压深才读得清。 */
    --bg:#eaf2fb;          /* 页面底：浅蓝 */
    --panel:#ffffff;       /* 卡片：近白 */
    --panel-2:#f2f7fd;     /* 次级面：极浅蓝 */
    --line:#c7d9ee;        /* 描边：浅蓝灰 */
    --text:#12233a;        /* 正文：深蓝黑 */
    --text-dim:#5b7595;    /* 弱化文字 */
    --accent:#a86404;      /* 暖金强调（浅底压深） */
    --accent-2:#1d5fb0;    /* 亮蓝强调（浅底压深） */
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
    --bar-h:calc(58px + var(--sab));
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",sans-serif;
    background:var(--bg);color:var(--text);
    overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;
  }

  /* ============ 应用外壳（手机优先：一屏铺满 · 自身不滚动） ============ */
  #app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;}

  /* ---------- 顶部：标题行 + 检索框 ---------- */
  #topbar{
    flex:0 0 auto;position:relative;z-index:20;
    padding:calc(var(--sat) + 9px) 13px 9px;
    background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(247,251,255,.94));
    border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;gap:8px;
  }
  #brandRow{display:flex;align-items:center;gap:10px;min-width:0;}
  #brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3;}
  #brand b{font-size:18px;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #brand span{font-size:14px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  #searchWrap{position:relative;width:100%;}
  #search{
    width:100%;height:44px;border-radius:22px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);padding:0 42px 0 40px;
    /* ⛔ 字号必须 ≥16px —— iOS 聚焦小于 16px 的输入框会自动放大整页 */
    font-size:18px;font-family:inherit;outline:none;transition:.18s;
  }
  #search:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(29,95,176,.18);}
  #search::placeholder{color:#6b84a3;}
  .search-ico{position:absolute;left:13px;top:13px;width:18px;height:18px;opacity:.55;pointer-events:none;}
  #clearSearch{
    position:absolute;right:11px;top:11px;width:22px;height:22px;border-radius:50%;
    border:none;background:#b9cfe6;color:#3d5878;cursor:pointer;display:none;
    font-size:15.5px;line-height:1;padding:0;
  }
  #suggest{
    position:absolute;top:50px;left:0;right:0;max-height:46vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 18px 40px rgba(30,60,100,.22);display:none;padding:6px;z-index:30;
    -webkit-overflow-scrolling:touch;
  }
  #suggestNote{padding:8px 11px;font-size:14.5px;color:var(--text-dim);border-bottom:1px solid var(--line);margin-bottom:4px;}
  #suggestNote b{color:var(--accent-2);font-weight:600;}
  .sg-item{display:flex;align-items:center;gap:10px;padding:12px 11px;border-radius:8px;cursor:pointer;}
  .sg-item:hover,.sg-item.active{background:var(--panel-2);}
  .sg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .sg-name{font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sg-type{font-size:14.5px;color:var(--text-dim);flex-shrink:0;}
  .sg-empty{padding:16px;text-align:center;color:var(--text-dim);font-size:15.5px;}

  /* ---------- 工具条（手机 = 固定底部条） ---------- */
  #tools{
    position:fixed;left:0;right:0;bottom:0;z-index:25;
    display:flex;gap:8px;align-items:stretch;
    padding:7px 10px calc(var(--sab) + 7px);
    background:linear-gradient(0deg,rgba(255,255,255,.98),rgba(240,247,255,.94));
    border-top:1px solid var(--line);
  }
  .btn{
    flex:1 1 0;min-width:0;height:44px;padding:0 4px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-size:16px;font-family:inherit;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:translateY(1px);background:#dbe8f7;}
  .btn:hover{border-color:var(--accent-2);color:#fff;background:#dbe8f7;}
  .btn.on{background:rgba(168,100,4,.12);border-color:var(--accent);color:var(--accent);}

  /* ---------- 舞台（画布） ---------- */
  #stage{flex:1 1 auto;position:relative;min-height:0;}
  #chart{
    position:absolute;top:0;left:0;right:0;bottom:var(--bar-h);
    /* 整个图谱画布（含空白区）都接收拖/缩手势，浏览器不要抢去做页面滚动/缩放 */
    touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;
  }
  #chart:active{cursor:grabbing;}
  #chart canvas{touch-action:none;}

  /* ---------- 统计角标 ---------- */
  #stats{
    position:absolute;left:10px;top:8px;z-index:12;
    background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:9px;
    padding:5px 9px;font-size:14px;color:var(--text-dim);line-height:1.5;
    max-width:calc(100% - 20px);pointer-events:none;
  }
  #stats b{color:var(--accent);font-size:15px;}
  /* 邻域模式的出口：面板关掉之后也能一键回全图 */
  #egoExit{
    position:absolute;right:10px;top:8px;z-index:12;display:none;
    border:1px solid var(--accent);border-radius:9px;background:rgba(168,100,4,.12);
    color:var(--accent);font-family:inherit;font-size:14.5px;padding:6px 10px;cursor:pointer;
  }
  #egoExit:hover{background:rgba(168,100,4,.22);color:#fff;}

  /* ---------- 提示条（8 秒后淡出） ---------- */
  #hint{
    position:absolute;left:10px;right:10px;bottom:calc(var(--bar-h) + 8px);z-index:12;
    font-size:13.5px;color:#5b7595;text-align:center;
    background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:9px;padding:5px 10px;
    pointer-events:none;transition:opacity .6s;
  }
  #hint b{color:#3d5878;font-weight:600;}
  #hint.gone{opacity:0;}

  /* ---------- 底部抽屉（详情 / 图例共用） ---------- */
  #scrim{
    position:fixed;inset:0;z-index:30;background:rgba(20,40,70,.34);
    opacity:0;pointer-events:none;transition:opacity .24s;
  }
  #scrim.show{opacity:1;pointer-events:auto;}

  #panel{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    /* 抽屉不占满屏：上面要留出画布 —— 展开一个节点之后，新长出来的那一圈
       就在抽屉上方，看得到才算「点了一个，长出一片」。 */
    height:min(62vh,560px);height:min(62dvh,560px);
    background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    transform:translateY(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    /* ⭐ 整张卡一个滚动区（不是「固定头 + 小滚动正文」）——
       标题 / 摘要 / 按钮 / 属性 / 关联 / 文献连成一体，往下滑就能看全。 */
    display:block;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    box-shadow:0 -18px 44px rgba(30,60,100,.22);
  }
  #panel.open{transform:translateY(0);}
  #panel::before{
    content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
    width:42px;height:4px;border-radius:3px;background:#9fb9d6;
  }
  #panel-head{padding:22px 52px 12px 16px;position:relative;}
  /* 关闭按钮脱离头部、直接挂在滚动容器上 → position:sticky 才能整卡吸顶 */
  #panel-close{
    position:sticky;top:10px;float:right;z-index:6;
    margin:10px 12px 0 0;width:32px;height:32px;border-radius:9px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);
    cursor:pointer;font-size:18px;line-height:1;padding:0;
  }
  #panel-close:hover{color:#fff;border-color:var(--accent-2);}
  #p-name{font-size:21px;font-weight:700;margin:0 0 8px 0;line-height:1.35;}
  #p-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .chip{font-size:14.5px;padding:3px 10px;border-radius:12px;background:#e2ecf8;color:#2c4463;}
  /* 文献支撑数（客户 2026-11-06 问「你有多少文献支撑这个」）——
     浅底上用蓝底蓝字，与普通 chip 区分开；「客户做法·文献待核」用琥珀色标出 */
  .chip.lit{background:rgba(29,95,176,.12);color:#12457f;font-weight:600;}
  .chip.lit.client{background:rgba(168,100,4,.14);color:#7a4a02;font-weight:600;}
  .chip.type{font-weight:600;}
  .chip.tag{background:transparent;border:1px solid var(--line);color:var(--text-dim);}
  .chip.alias{background:transparent;border:1px dashed #9fb9d6;color:#3d5878;}
  #p-summary{margin:12px 0 0;font-size:16px;line-height:1.75;color:#2c4463;}
  /* 节点操作（展开 / 锁定 / 关闭）—— Neo4j 那三个选项放在详情卡头部：
     手指点完节点，按钮就在眼前，不用在画布上够小图标。 */
  .p-actions{display:flex;gap:8px;margin:14px 0 0;}
  .p-act{
    flex:1;min-width:0;min-height:44px;padding:8px 6px;border-radius:10px;
    border:1px solid var(--line);background:rgba(29,95,176,.07);color:var(--text);
    font-size:16px;font-family:inherit;cursor:pointer;white-space:nowrap;
    transition:border-color .15s,color .15s,background .15s;
  }
  .p-act:hover:not(:disabled){border-color:var(--accent);color:#fff;}
  .p-act:disabled{opacity:.4;cursor:default;}
  .p-act.on{border-color:var(--accent-2);color:var(--accent-2);background:rgba(168,100,4,.10);}
  .p-act.danger{color:#a33527;border-color:rgba(255,120,100,.34);}
  .p-act.danger:hover:not(:disabled){border-color:#b03a26;color:#b03a26;background:rgba(255,120,100,.1);}
  /* 「在关系图里看这一圈」—— 把当前节点 + 一跳邻居收成一屏 */
  .p-view{
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
    margin:10px 0 0;min-height:40px;border-radius:10px;
    border:1px solid var(--line);background:rgba(29,95,176,.10);color:#12457f;
    font-family:inherit;font-size:16px;cursor:pointer;transition:.15s;
  }
  .p-view:hover{border-color:var(--accent-2);color:#fff;}
  /* 来时路径：从哪儿点进来的，一眼看见，也能原路退回 */
  #p-crumbs{
    display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap;
    margin:0 0 8px 0;font-size:15px;color:var(--text-dim);scrollbar-width:none;
  }
  #p-crumbs::-webkit-scrollbar{display:none;}
  .crumb{
    border:none;background:none;color:var(--text-dim);font-family:inherit;
    font-size:15px;cursor:pointer;padding:2px 0;max-width:140px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .crumb:hover{color:var(--accent-2);}
  .crumb.cur{color:var(--text);font-weight:600;}
  .crumb-sep{color:#9fb9d6;flex-shrink:0;}
  /* 正文不再自己滚 —— 滚动交给 #panel（整卡一体）。
     右侧留出 52px 给吸顶关闭按钮，滚到哪儿都不会压住内容。 */
  #panel-body{padding:6px 52px calc(var(--sab) + 26px) 16px;}

  .sec{margin-top:18px;}
  .sec-title{
    display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;
    color:var(--accent);letter-spacing:.5px;margin:0 0 10px;
  }
  .sec-title::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent);}
  .sec-title .n{margin-left:auto;font-weight:400;color:#6b84a3;font-size:14px;}
  .sec-hint{font-size:14.5px;color:#6b84a3;margin:-6px 0 8px;}

  .assert{
    display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed #cfe0f3;font-size:16px;
  }
  .assert:last-child{border-bottom:none;}
  .assert .k{
    flex-shrink:0;width:92px;color:var(--text-dim);font-size:15.5px;line-height:1.7;
  }
  .assert .v{flex:1;line-height:1.75;word-break:break-word;white-space:pre-wrap;color:#1e3450;}
  .assert .v.long{font-size:15.5px;color:#2c4463;}

  .ev{
    border:1px solid var(--line);border-radius:9px;background:var(--panel-2);
    padding:11px 12px;margin-bottom:9px;
  }
  .ev:last-child{margin-bottom:0;}
  .ev-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .ev-title{font-size:16px;font-weight:600;color:#1e3450;line-height:1.6;}
  .ev-src{font-size:15.5px;color:var(--text-dim);line-height:1.7;margin-top:4px;}
  .ev-cite{font-size:14.5px;color:#6b84a3;line-height:1.7;margin-top:4px;word-break:break-word;}

  .obj-list{display:flex;flex-direction:column;gap:8px;}
  .obj{
    display:flex;align-items:center;gap:9px;padding:11px 11px;border-radius:9px;
    background:var(--panel-2);border:1px solid transparent;cursor:pointer;transition:.15s;
  }
  .obj:active{border-color:var(--accent-2);}
  .obj .rel{
    font-size:14px;color:var(--text-dim);background:#e2ecf8;border-radius:5px;
    padding:3px 7px;flex-shrink:0;min-width:54px;text-align:center;
  }
  .obj .nm{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .obj .tp{font-size:14px;color:var(--text-dim);flex-shrink:0;}

  /* 关联节点：按「关系 + 方向」分组 —— 十几条平铺读不出结构，分组后
     一眼能看出「它会导致什么 / 由什么处理 / 依据是什么」。 */
  .rel-group{margin-bottom:12px;}
  .rel-group:last-child{margin-bottom:0;}
  .rel-head{
    display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;
    color:#3d5878;margin:0 0 6px;
  }
  .rel-head .dir{
    flex-shrink:0;width:18px;height:18px;border-radius:5px;background:#e2ecf8;
    color:var(--accent);font-size:14px;line-height:18px;text-align:center;font-weight:700;
  }
  .rel-head .n{margin-left:auto;font-weight:400;color:#6b84a3;font-size:14px;}

  /* 文献出处默认折叠：证据要随时能查，但不该挡在「下一步」前面。 */
  details.sec > summary.sec-title{cursor:pointer;list-style:none;margin:0 0 10px;}
  details.sec > summary.sec-title::-webkit-details-marker{display:none;}
  details.sec > summary.sec-title::after{
    content:"展开";margin-left:auto;font-size:14px;color:var(--text-dim);font-weight:400;
  }
  details.sec[open] > summary.sec-title::after{content:"收起";}
  details.sec > summary.sec-title .n{margin-left:0;}

  /* ---------- 图例（手机 = 底部抽屉；桌面 = 左下角浮层） ---------- */
  #legend{
    position:fixed;left:0;right:0;bottom:0;z-index:35;
    max-height:min(64vh,560px);max-height:min(64dvh,560px);
    background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    transform:translateY(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    padding:20px 16px calc(var(--sab) + 20px);overflow-y:auto;
    box-shadow:0 -18px 44px rgba(30,60,100,.22);
  }
  #legend.open{transform:translateY(0);}
  #legend::before{
    content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
    width:42px;height:4px;border-radius:3px;background:#9fb9d6;
  }
  .legend-head{display:flex;align-items:center;gap:10px;margin:0 0 10px;}
  #legend h4{margin:0;font-size:16px;color:var(--text-dim);font-weight:600;letter-spacing:.6px;}
  #legendAll{margin-left:auto;font-size:15px;font-weight:400;color:var(--accent-2);cursor:pointer;}
  #legend-close{
    width:28px;height:28px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text-dim);cursor:pointer;font-size:17px;line-height:1;padding:0;
  }
  #legend-close:hover{color:#fff;border-color:var(--accent-2);}
  .lg-items{display:flex;flex-wrap:wrap;gap:8px;}
  .lg-item{
    display:flex;align-items:center;gap:7px;font-size:16px;padding:8px 12px 8px 10px;
    border-radius:16px;background:#f2f7fd;border:1px solid transparent;
    cursor:pointer;user-select:none;transition:.15s;
  }
  .lg-item:active{border-color:#9fb9d6;}
  .lg-item.off{opacity:.32;}
  .lg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .lg-count{color:#6b84a3;font-size:14px;}

  /* ---------- 首屏遮罩 ---------- */
  #loading{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);z-index:60;color:var(--text-dim);font-size:16px;flex-direction:column;gap:12px;
  }
  .spin{width:26px;height:26px;border:2px solid #b9cfe6;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* 布局中的提示：力导向布局跑完之前，图上还没有标签。
     不说一声，用户看到的是「一张没字的光秃秃的图」—— 像坏了。
     标签一算准就撤掉。 */
  #settling{
    position:absolute;left:50%;top:14px;transform:translateX(-50%);
    display:flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.95);border:1px solid #b9cfe6;border-radius:999px;
    padding:6px 13px;font-size:15px;color:#3d5878;pointer-events:none;
    transition:opacity .25s;z-index:6;
  }
  #settling.gone{opacity:0;}
  #settling .spin{width:13px;height:13px;border-width:1.5px;}

  /* ===================================================================
     列表视图（手机默认 · 卡片流为主；画布降级为「全景图」这一可选层）
     —— 为什么不是「把桌面画布缩小放到手机上」：
        上百个节点摊在 390px 宽的屏上，节点间距约 4px，字根本放不下 ——
        那是结构问题，不是样式问题（缩小画布解决不了）。
        手机这条路走「知识框架树 → 词条卡 → 关联链条」，画布保留在「全景图」里，
        想看全局关系的人再点进去 —— 论文口径的「点选逐步延展」在列表里同样成立。
     =================================================================== */
  #viewList{
    position:absolute;top:0;left:0;right:0;bottom:0;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 13px calc(var(--sab) + 30px);
    visibility:hidden;pointer-events:none;
  }
  #viewList.on{visibility:visible;pointer-events:auto;}
  #viewGraph{position:absolute;top:0;left:0;right:0;bottom:0;visibility:hidden;pointer-events:none;}
  #viewGraph.on{visibility:visible;pointer-events:auto;}

  .lg-lead{font-size:15.5px;line-height:1.8;color:#2c4463;margin:0 0 8px;}
  .lg-disc{
    font-size:14.5px;line-height:1.7;color:#5b7595;margin:0 0 4px;
    border-left:2px solid var(--line);padding-left:9px;
  }
  .lg-ch{
    display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;
    color:var(--accent);letter-spacing:.5px;margin:20px 0 10px;
  }
  .lg-ch::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent);}
  .lg-ch .lg-n{font-weight:400;color:#6b84a3;font-size:14px;}

  /* ---------- 就医警示（患者层的「正确引导」落点） ---------- */
  .lg-urgent{
    border:1px solid #e0a49a;background:rgba(217,94,75,.10);border-radius:14px;padding:12px 12px 6px;
  }
  .lg-uh{
    display:flex;align-items:flex-start;gap:8px;margin:0 0 10px;
    font-size:16px;font-weight:700;color:#a33527;line-height:1.55;
  }
  .lg-uh::before{
    content:"!";flex-shrink:0;width:19px;height:19px;border-radius:50%;
    background:#c0392b;color:#fff;font-size:16px;text-align:center;line-height:19px;font-weight:700;
  }
  .u-item{
    display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;
    background:var(--panel-2);border:1px solid var(--line);border-radius:11px;
    padding:11px 12px;margin-bottom:8px;cursor:pointer;font-family:inherit;color:var(--text);
    -webkit-tap-highlight-color:transparent;transition:.15s;
  }
  .u-item:active{border-color:#b03a26;transform:translateY(1px);}
  .u-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;}
  .u-plain{font-size:15.5px;font-weight:600;color:#8c2a1d;line-height:1.55;}
  .u-act{font-size:15.5px;color:var(--accent);line-height:1.6;}
  .u-link{font-size:14.5px;color:var(--text-dim);line-height:1.5;}

  /* ---------- 分诊（患者第一屏：先对号入座，再给行动） ----------
     为什么不是一张静态警示列表：扫码那一刻，人问的是「我现在这样算不算」，
     不是「有哪些危险情况」。所以每条警示都要能被点选，选完直接给结论。 */
  .triage-hint{font-size:15.5px;color:#3d5878;line-height:1.75;margin:0 0 10px;}
  .triage .u-item{position:relative;padding-left:40px;}
  .u-check{
    position:absolute;left:12px;top:13px;width:18px;height:18px;border-radius:50%;
    border:1.5px solid #6b84a3;background:transparent;flex-shrink:0;transition:.15s;
  }
  .triage .u-item.sel{border-color:#b03a26;background:rgba(217,94,75,.12);}
  .triage .u-item.sel .u-check{border-color:#b03a26;background:#c0392b;}
  .triage .u-item.sel .u-check::after{
    content:"✓";position:absolute;inset:0;color:#fff;font-size:15px;
    line-height:18px;text-align:center;font-weight:700;
  }
  .triage-actions{display:flex;gap:8px;margin:10px 0 0;}
  .triage-btn{
    flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-family:inherit;font-size:16px;
    cursor:pointer;transition:.15s;
  }
  .triage-btn:hover{border-color:var(--accent-2);color:#fff;}
  .triage-result{
    position:sticky;top:0;z-index:2;
    margin:0 0 10px;border-radius:11px;padding:11px 12px;font-size:16px;line-height:1.75;
    border:1px solid var(--line);background:var(--panel-2);color:#2c4463;
    box-shadow:0 8px 20px rgba(30,60,100,.16);
  }
  .triage-result:empty{display:none;}
  .triage-result b{color:#fff;}
  .triage-result.red{border-color:#e0a49a;background:rgba(217,94,75,.14);color:#8c2a1d;}
  .triage-result.green{border-color:#8fc4a8;background:rgba(56,140,95,.12);color:#1d6b46;}

  /* ---------- 检索推荐词（数据驱动 · 只在没输入时出现） ---------- */
  #searchChips{
    display:flex;align-items:center;gap:6px;overflow-x:auto;
    padding:0 1px 12px;scrollbar-width:none;
  }
  #searchChips::-webkit-scrollbar{display:none;}
  .chips-label{font-size:14.5px;color:#6b84a3;flex-shrink:0;}
  .s-chip{
    flex:0 0 auto;border:1px solid var(--line);border-radius:999px;
    background:var(--panel-2);color:var(--text-dim);font-family:inherit;
    font-size:14.5px;padding:5px 10px;cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;transition:.15s;
  }
  .s-chip:hover,.s-chip:active{border-color:var(--accent-2);color:#fff;}

  /* ---------- 分类卡 ---------- */
  .cat{border:1px solid var(--line);border-radius:13px;background:var(--panel);margin-bottom:9px;overflow:hidden;}
  .cat.open{border-color:#9fb9d6;}
  .cat-head{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:none;padding:13px 13px;color:var(--text);cursor:pointer;
    font-family:inherit;-webkit-tap-highlight-color:transparent;
  }
  .cat-head:active{background:var(--panel-2);}
  .cat-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .cat-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .cat-label{font-size:17px;font-weight:600;line-height:1.4;}
  .cat-desc{
    font-size:14.5px;color:var(--text-dim);line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .cat-n{font-size:15px;color:var(--accent);flex-shrink:0;}
  .cat-arrow{font-size:18px;color:#6b84a3;flex-shrink:0;line-height:1;transition:transform .18s;}
  .cat.open .cat-arrow{transform:rotate(90deg);}
  /* 二级框架卡：缩进一级 + 轻一点 —— 一级框架是「章节」，二级框架是「小节」 */
  .cat.sub{margin-left:12px;border-style:dashed;}
  .cat.sub .cat-label{font-size:16px;}
  .cat.sub .cat-dot{width:8px;height:8px;}
  /* 模块根（题目的那一个节点） */
  .mod-root{border:1px solid #9fb9d6;border-radius:13px;background:var(--panel);margin-bottom:9px;overflow:hidden;}
  .mod-root .row{border-bottom:none;}


  /* ---------- 检查后须知（患者层的第一段） ---------- */
  .lg-urgent.aftercare{border-color:#8fc4a8;background:rgba(56,140,95,.10);}
  /* 须知是**正常流程**，不是急症 ⇒ 不用红色的「!」 */
  .lg-urgent.aftercare .lg-uh{color:#1d6b46;}
  .lg-urgent.aftercare .lg-uh::before{content:"✓";background:#2f7a5b;}
  .ac-list{display:flex;flex-direction:column;gap:9px;}
  .ac-item{
    border:1px solid var(--line);border-radius:11px;background:var(--panel);
    padding:11px 12px;display:flex;flex-direction:column;gap:5px;
  }
  .ac-plain{font-size:16px;line-height:1.6;}
  .ac-act{font-size:15px;color:var(--text-dim);line-height:1.6;}
  .triage-lead{font-size:16px;color:var(--text);line-height:1.6;margin:0 0 8px;}

  /* ---------- 节点「要点」（来自文献原文的逐条提取） ---------- */
  .pt{border-left:2px solid var(--accent);padding:2px 0 2px 10px;margin-bottom:11px;}
  .pt:last-child{margin-bottom:0;}
  .pt-k{font-size:15px;color:var(--accent);font-weight:600;margin-bottom:3px;}
  .pt-v{font-size:16px;line-height:1.65;}
  .pt .quote{font-size:14.5px;color:var(--text-dim);line-height:1.55;margin-top:4px;
             padding-left:8px;border-left:1px dashed var(--line);}
  .pt .src{display:inline-block;margin-top:5px;font-size:14px;color:var(--accent-2);cursor:pointer;}
  /* 客户实践要点的出处：**不可点**（没有文献节点可跳）⇒ 用琥珀色 + 无手型 */
  .pt .src.client{color:#7a4a02;background:rgba(168,100,4,.10);padding:2px 8px;border-radius:9px;cursor:default;}

  /* ---------- 关系上的说明（note）---------- */
  .obj .onote{display:block;font-size:14px;color:var(--text-dim);line-height:1.5;margin-top:2px;}

  /* ---------- 词条卡（分类展开后 / 检索结果） ---------- */
  .cat-body{padding:2px 9px 9px;border-top:1px solid var(--line);}
  /* 框架内的缩进层级：数据里同归属的「属于」上下级 */
  .row.d1{margin-left:14px;padding-left:12px;border-left:2px solid #b9cfe6;}
  .row.d2{margin-left:28px;padding-left:12px;border-left:2px solid #b9cfe6;}
  .row.d3{margin-left:42px;padding-left:12px;border-left:2px solid #b9cfe6;}
  .row{
    display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px dashed #cfe0f3;
    padding:12px 4px;cursor:pointer;font-family:inherit;color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  .row:last-child{border-bottom:none;}
  .row:active{background:var(--panel-2);}
  .row-top{display:flex;align-items:baseline;gap:8px;}
  .row-name{flex:1;min-width:0;font-size:15.5px;font-weight:600;line-height:1.45;}
  .row-tp{font-size:14px;flex-shrink:0;}
  .row-sum{
    font-size:15px;color:var(--text-dim);line-height:1.65;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .lg-empty{font-size:16px;color:var(--text-dim);padding:16px 4px;}
  #lgInner{max-width:820px;margin:0 auto;}

  /* ---------- 视图切换（顶栏分段控件） ---------- */
  #viewTabs{display:flex;gap:2px;flex-shrink:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:2px;}
  .tab{
    border:none;background:none;color:var(--text-dim);font-family:inherit;
    font-size:15px;padding:7px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;transition:.15s;
  }
  .tab.on{background:rgba(168,100,4,.12);color:var(--accent);font-weight:600;}
  .tab:hover{color:#fff;}

  /* 列表视图里不出现画布专属控件 */
  body[data-view="list"] #legend,body[data-view="list"] #suggest{display:none;}

  /* 滚动条 */
  #panel::-webkit-scrollbar,#suggest::-webkit-scrollbar,#legend::-webkit-scrollbar{width:7px;}
  #panel::-webkit-scrollbar-thumb,#suggest::-webkit-scrollbar-thumb,#legend::-webkit-scrollbar-thumb{background:#b9cfe6;border-radius:4px;}
  #panel::-webkit-scrollbar-track,#suggest::-webkit-scrollbar-track,#legend::-webkit-scrollbar-track{background:transparent;}

  /* ===================================================================
     宽屏（桌面 / 平板横屏）：恢复左右分栏 + 顶部横条
     —— 手机优先，宽屏只做「覆盖」，不另写一套逻辑
     =================================================================== */
  @media (min-width:861px){
    :root{--bar-h:0px;}
    #topbar{
      flex-direction:row;align-items:center;gap:14px;height:64px;padding:0 20px;
    }
    #brandRow{flex:0 1 auto;}
    #brand{flex:none;max-width:38vw;}
    #searchWrap{flex:1 1 auto;max-width:420px;min-width:180px;}
    #search{height:38px;font-size:16px;padding:0 40px 0 38px;border-radius:19px;}
    .search-ico{left:14px;top:10px;width:16px;height:16px;}
    #clearSearch{right:12px;top:8px;}
    #suggest{top:44px;max-height:340px;}
    .sg-item{padding:9px 11px;}
    .sg-name{font-size:16px;}
    #tools{position:static;flex:0 0 auto;margin-left:auto;padding:0;border:none;background:none;}
    .btn{flex:0 0 auto;height:36px;padding:0 15px;font-size:15.5px;border-radius:9px;}
    .only-mobile{display:none;}
    #scrim{display:none;}
    #panel{
      position:absolute;top:64px;right:0;bottom:0;left:auto;width:440px;max-width:92vw;height:auto;
      border-left:1px solid var(--line);border-top:none;border-radius:0;
      transform:translateX(100%);box-shadow:none;
    }
    #panel.open{transform:translateX(0);box-shadow:-22px 0 48px rgba(30,60,100,.2);}
    #panel::before{display:none;}
    #panel-head{padding:18px 56px 14px 20px;}
    #panel-close{top:10px;margin:10px 14px 0 0;width:28px;height:28px;}
    #p-name{font-size:22px;}
    .p-act{min-height:36px;font-size:15.5px;}
    #panel-body{padding:6px 56px 28px 20px;}
    #legend{
      position:absolute;left:16px;right:auto;bottom:16px;top:auto;max-width:290px;max-height:none;
      border:1px solid var(--line);border-radius:12px;padding:12px 14px;transform:none;
      box-shadow:none;overflow:visible;
    }
    #legend::before{display:none;}
    #legend h4{font-size:15px;}
    .lg-item{font-size:14.5px;padding:3px 9px 3px 7px;}
    /* 桌面列表视图：详情面板是右侧常驻栏 —— 列表给它让出宽度，
       否则正文会被盖住（2026-11-04 实测：导语被截在面板下面）。 */
    body.panel-open[data-view="list"] #viewList{padding-right:min(460px,52vw);}
    #hint{display:none;}
    #stats{left:16px;top:16px;font-size:14.5px;padding:9px 13px;}
  }
  </style>
</head>
<body>

<div id="loading"><div class="spin"></div><div>正在加载图谱数据…</div></div>

<div id="app">

  <header id="topbar">
    <div id="brandRow">
      <div id="brand">
        <b id="brandTitle">知识图谱</b>
        <span id="brandSub"></span>
      </div>
      <div id="viewTabs">
        <button type="button" class="tab" id="tabList" data-view="list">知识浏览</button>
        <button type="button" class="tab" id="tabGraph" data-view="graph">全景图</button>
      </div>
    </div>

    <div id="searchWrap">
      <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="#5b7595" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search" type="text" placeholder="检索：名称 / 别名 / 类型 / 文献类型…" autocomplete="off">
      <button id="clearSearch" title="清空">×</button>
      <div id="suggest"></div>
    </div>

    <div id="tools">
      <button class="btn only-mobile" id="btnLegend">图例</button>
      <button class="btn" id="btnFit">适应画布</button>
      <button class="btn" id="btnAll" title="把整张图谱一次展开">全部展开</button>
      <button class="btn" id="btnLabels" title="显示全部标签">全部标签</button>
      <button class="btn" id="btnReset">重置视图</button>
    </div>
  </header>

  <div id="stage">
    <!-- 列表视图（手机默认） -->
    <div id="viewList">
      <div id="lgInner">
        <div id="searchChips"></div>
        <div id="lgIntro"></div>
        <div id="lgUrgent"></div>
        <div id="lgResults"></div>
        <div id="lgCats"></div>
      </div>
    </div>

    <!-- 画布视图（「全景图」：专业用户 / 看全局关系时用） -->
    <div id="viewGraph">
      <div id="chart"></div>
      <div id="settling"><span class="spin"></span><span>正在布局图谱…</span></div>
      <div id="stats"></div>
      <button type="button" id="egoExit">退出这一圈</button>
      <div id="hint"><b>点节点</b> → 展开它的关联 / 锁定 / 关闭 · <b>拖动</b> 平移 · <b>双指</b> 缩放</div>
    </div>
  </div>

</div>

<div id="scrim"></div>

<aside id="panel">
  <button id="panel-close">×</button>
  <div id="panel-head">
    <div id="p-crumbs"></div>
    <h2 id="p-name"></h2>
    <div id="p-meta"></div>
    <div class="p-actions">
      <button type="button" class="p-act" id="pExpand">展开</button>
      <button type="button" class="p-act" id="pLock">锁定</button>
      <button type="button" class="p-act danger" id="pRemove">关闭</button>
    </div>
    <p id="p-summary"></p>
    <button type="button" class="p-view" id="pEgo">在关系图里看这一圈 ›</button>
  </div>
  <div id="panel-body"></div>
</aside>

<div id="legend">
  <div class="legend-head">
    <h4>图例 · 节点类型</h4>
    <span id="legendAll">全选</span>
    <button id="legend-close" class="only-mobile" title="关闭">×</button>
  </div>
  <div id="legend-body"></div>
</div>

<script src="./lib/echarts.min.js"></script>
<script src="./data/topic-01-graph.js"></script>
<script src="./data/topic-01-patient.js"></script>
<script>
/* =====================================================================
   KG-CORE-START —— 纯逻辑核心（检索 / 证据类型解析），无 DOM 依赖。
   独立成块的目的：可被离线测试脚本原样抽出运行，测的就是线上这份代码。
   题目无关：显示名只来自数据文件 meta.topicName，代码里不出现任何题目名。
   ===================================================================== */
(function (root) {
  "use strict";

  /* 文献类型「英文 → 中文」同义并表。
     ⛔ 只有「文献类型」这一类同义词允许写进代码（题目无关的常量）；
        节点级同义词（英文名 / 旧称 / 客户原文错字）一律走数据里的 aliases。 */
  var EVIDENCE_EN_TO_ZH = {
    "guidelines": "指南",
    "systematic reviews": "系统评价",
    "meta analysis": "Meta分析"
  };

  /* 文献类型取值域（客户约定的 12 类）；数据里实际出现的类型也会并进来。 */
  var EVIDENCE_ZH_DOMAIN = [
    "指南", "共识", "标准", "建议", "推荐", "规范", "声明",
    "系统评价", "Meta分析", "书籍", "最佳证据", "推荐实践"
  ];

  /* 归一化：去首尾空格 · 大小写不敏感 · 去掉所有内部空白
     （英文多词检索词与节点文本用同一把尺子，天然对齐）。 */
  function norm(s) {
    if (s === null || s === undefined) return "";
    return String(s).toLowerCase().trim().replace(/\s+/g, "");
  }

  function typeTable(graph) {
    var t = {};
    (graph.nodeTypes || []).forEach(function (x) {
      if (!x || !x.key) return;
      t[x.key] = {
        key: x.key,
        label: x.label || x.key,
        color: x.color || "#5b7595",
        shape: x.shape || "circle",
        size: x.size || 22,
        desc: x.desc || ""
      };
    });
    return t;
  }

  /* 节点可被检索命中的全部文本（**逐条**给出，不合并）：名称 · 别名 · 标签 · 简介 · 类型名 · 属性
     逐条双向子串 = 与「客户检索词覆盖」判据同一把尺子（合并后再比会漏掉
     「检索词是节点文本的上一级」这种情况，例如检索词整句包含节点名）。 */
  function nodeText(graph, node, types) {
    var t = types || typeTable(graph);
    var ti = t[node.type];
    var parts = [node.name || ""];
    (node.aliases || []).forEach(function (a) { parts.push(a); });
    (node.tags || []).forEach(function (x) { parts.push(x); });
    parts.push(node.summary || "");
    if (ti) parts.push(ti.label);
    (node.attrs || []).forEach(function (a) {
      if (a) parts.push(a.k || ""); parts.push(a.v || "");
    });
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] === null || parts[i] === undefined) continue;
      var s = String(parts[i]).trim();
      if (!s) continue;
      out.push(norm(s));
    }
    return out;
  }

  /* 节点用 attrs 声明自己的文献类型时，认这几个**字段名**（数据模型的约定，不是节点类型键）
     —— 判据第 4 条「图例与类型由数据自带」：前端不按节点类型分叉，类型键一律不写死在代码里 */
  var EVIDENCE_TYPE_ATTR_KEYS = ["文献类型", "类型", "evidenceType", "证据类型"];

  function declaredEvidenceTypes(node) {
    var out = [];
    (node.attrs || []).forEach(function (a) {
      if (!a || !a.k || !a.v) return;
      if (EVIDENCE_TYPE_ATTR_KEYS.indexOf(a.k) < 0) return;
      out.push(String(a.v));
    });
    return out;
  }

  /* 该节点是否「引用了」这一类文献（evidence.type 或节点 attrs 声明的文献类型）*/
  function nodeHasEvidenceType(node, ev) {
    var ok = (node.evidence || []).some(function (e) {
      return e && e.type && norm(e.type) === ev;
    });
    if (ok) return true;
    return declaredEvidenceTypes(node).some(function (v) { return norm(v) === ev; });
  }

  /* 本图谱里出现过的全部文献类型（归一化后的小写键 → 原始写法） */
  function evidenceTypes(graph) {
    var out = {};
    (graph.nodes || []).forEach(function (n) {
      (n.evidence || []).forEach(function (e) {
        if (e && e.type) out[norm(e.type)] = e.type;
      });
      declaredEvidenceTypes(n).forEach(function (v) {
        var k = norm(v);
        if (!out[k]) out[k] = v;
      });
    });
    return out;
  }

    var cx = 0, cy = 0, cc = 0;
