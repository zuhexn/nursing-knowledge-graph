<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --line:#dde3ee; --text:#1d2433;
    --text-dim:#5b6678; --accent:#1f6feb; --accent-soft:#eaf1ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:40px 18px 60px;background:var(--bg);color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",sans-serif;
    line-height:1.8;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1000px;margin:0 auto;}
  h1{font-size:26px;margin:0 0 8px;}
  .lead{color:var(--text-dim);font-size:14.5px;margin:0 0 26px;}
  .topics{display:flex;flex-wrap:wrap;gap:20px;}
  .topic{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:22px 24px;flex:1 1 380px;min-width:320px;
  }
  .topic h2{font-size:19px;margin:0 0 4px;line-height:1.5;}
  .topic .meta{color:var(--text-dim);font-size:12.5px;margin:0 0 16px;}
  .links{display:flex;flex-direction:column;gap:10px;}
  .link{
    display:block;text-decoration:none;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;background:#fbfcfe;transition:.15s;
  }
  .link:hover{border-color:var(--accent);background:var(--accent-soft);}
  .link b{display:block;font-size:14.5px;color:var(--text);}
  .link span{font-size:12.5px;color:var(--text-dim);}
  .note{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-top:24px;font-size:13.5px;color:var(--text-dim);
  }
  .foot{color:var(--text-dim);font-size:12.5px;text-align:center;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>知识图谱</h1>
  <p class="lead">每个题目各自独立的一份知识图谱，互不切换、互不依赖。点进去即可浏览。</p>

  <div class="topics">
    <div class="topic">
      <h2>CT增强检查护理风险</h2>
      <p class="meta">碘对比剂相关不良反应 · 静脉外渗 · 肾功能保护的护理知识图谱</p>
      <div class="links">
        <a class="link" href="./topic-01-kg/index.html"><b>图谱页面</b><span>交互式知识图谱 · 力导向图 + 检索 + 节点详情</span></a>
      </div>
    </div>
    <div class="topic">
      <h2>恶心呕吐症状管理</h2>
      <p class="meta">面向患者的恶心呕吐症状管理知识图谱（含文献出处层）</p>
      <div class="links">
        <a class="link" href="./topic-02-kg/index.html"><b>图谱页面</b><span>交互式知识图谱 · 力导向图 + 检索 + 节点详情</span></a>
      </div>
    </div>
  </div>

  <div class="note">
    页面全部为纯静态资源（无后端接口 · 无运行时数据库），数据随页面一起发布，检索在浏览器本地完成；
    文献出处可在节点详情里逐条查看。
  </div>

  <p class="foot">知识图谱 · 公开访问</p>
</div>
</body>
</html>
