<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱</title>
  <style>
  :root{
    --bg:#0f1420;
    --panel:#161d2c;
    --panel-2:#1d2637;
    --line:#2b3852;
    --text:#e8eefc;
    --text-dim:#93a3c0;
    --accent:#f0b429;
    --accent-2:#4a9eff;
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
    --bar-h:calc(58px + var(--sab));
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",sans-serif;
    background:var(--bg);color:var(--text);
    overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;
  }

  /* ============ 应用外壳（手机优先：一屏铺满 · 自身不滚动） ============ */
  #app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;}

  /* ---------- 顶部：标题行 + 检索框 ---------- */
  #topbar{
    flex:0 0 auto;position:relative;z-index:20;
    padding:calc(var(--sat) + 9px) 13px 9px;
    background:linear-gradient(180deg,rgba(15,20,32,.99),rgba(15,20,32,.93));
    border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;gap:8px;
  }
  #brandRow{display:flex;align-items:center;gap:10px;min-width:0;}
  #brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3;}
  #brand b{font-size:16.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #brand span{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  #searchWrap{position:relative;width:100%;}
  #search{
    width:100%;height:44px;border-radius:22px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);padding:0 42px 0 40px;
    /* ⛔ 字号必须 ≥16px —— iOS 聚焦小于 16px 的输入框会自动放大整页 */
    font-size:16px;font-family:inherit;outline:none;transition:.18s;
  }
  #search:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(74,158,255,.16);}
  #search::placeholder{color:#61708c;}
  .search-ico{position:absolute;left:13px;top:13px;width:18px;height:18px;opacity:.55;pointer-events:none;}
  #clearSearch{
    position:absolute;right:11px;top:11px;width:22px;height:22px;border-radius:50%;
    border:none;background:#2b3852;color:#a9b8d4;cursor:pointer;display:none;
    font-size:14px;line-height:1;padding:0;
  }
  #suggest{
    position:absolute;top:50px;left:0;right:0;max-height:46vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 18px 40px rgba(0,0,0,.55);display:none;padding:6px;z-index:30;
    -webkit-overflow-scrolling:touch;
  }
  #suggestNote{padding:8px 11px;font-size:11.5px;color:var(--text-dim);border-bottom:1px solid var(--line);margin-bottom:4px;}
  #suggestNote b{color:var(--accent-2);font-weight:600;}
  .sg-item{display:flex;align-items:center;gap:10px;padding:12px 11px;border-radius:8px;cursor:pointer;}
  .sg-item:hover,.sg-item.active{background:var(--panel-2);}
  .sg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .sg-name{font-size:14.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sg-type{font-size:11.5px;color:var(--text-dim);flex-shrink:0;}
  .sg-empty{padding:16px;text-align:center;color:var(--text-dim);font-size:12.5px;}

  /* ---------- 工具条（手机 = 固定底部条） ---------- */
  #tools{
    position:fixed;left:0;right:0;bottom:0;z-index:25;
    display:flex;gap:8px;align-items:stretch;
    padding:7px 10px calc(var(--sab) + 7px);
    background:linear-gradient(0deg,rgba(15,20,32,.99),rgba(15,20,32,.9));
    border-top:1px solid var(--line);
  }
  .btn{
    flex:1 1 0;min-width:0;height:44px;padding:0 4px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-size:13.5px;font-family:inherit;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:translateY(1px);background:#233047;}
  .btn:hover{border-color:var(--accent-2);color:#fff;background:#233047;}
  .btn.on{background:rgba(240,180,41,.16);border-color:var(--accent);color:var(--accent);}

  /* ---------- 舞台（画布） ---------- */
  #stage{flex:1 1 auto;position:relative;min-height:0;}
  #chart{position:absolute;top:0;left:0;right:0;bottom:var(--bar-h);}
  #chart canvas{touch-action:none;}

  /* ---------- 统计角标 ---------- */
  #stats{
    position:absolute;left:10px;top:8px;z-index:12;
    background:rgba(22,29,44,.86);border:1px solid var(--line);border-radius:9px;
    padding:5px 9px;font-size:11px;color:var(--text-dim);line-height:1.5;
    max-width:calc(100% - 20px);pointer-events:none;
  }
  #stats b{color:var(--accent);font-size:12px;}

  /* ---------- 提示条（8 秒后淡出） ---------- */
  #hint{
    position:absolute;left:10px;right:10px;bottom:calc(var(--bar-h) + 8px);z-index:12;
    font-size:10.5px;color:#8494b4;text-align:center;
    background:rgba(22,29,44,.7);border:1px solid var(--line);border-radius:9px;padding:5px 10px;
    pointer-events:none;transition:opacity .6s;
  }
  #hint b{color:#b6c6e2;font-weight:600;}
  #hint.gone{opacity:0;}

  /* ---------- 底部抽屉（详情 / 图例共用） ---------- */
  #scrim{
    position:fixed;inset:0;z-index:30;background:rgba(6,9,16,.55);
    opacity:0;pointer-events:none;transition:opacity .24s;
  }
  #scrim.show{opacity:1;pointer-events:auto;}

  #panel{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    /* 抽屉不占满屏：上面要留出画布 —— 展开一个节点之后，新长出来的那一圈
       就在抽屉上方，看得到才算「点了一个，长出一片」。 */
    height:min(62vh,560px);height:min(62dvh,560px);
    background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    transform:translateY(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:0 -18px 44px rgba(0,0,0,.55);
  }
  #panel.open{transform:translateY(0);}
  #panel::before{
    content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
    width:42px;height:4px;border-radius:3px;background:#3b4d6e;
  }
  #panel-head{padding:22px 16px 12px;border-bottom:1px solid var(--line);position:relative;flex-shrink:0;}
  #panel-close{
    position:absolute;top:16px;right:12px;width:32px;height:32px;border-radius:9px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);
    cursor:pointer;font-size:16px;line-height:1;padding:0;
  }
  #panel-close:hover{color:#fff;border-color:var(--accent-2);}
  #p-name{font-size:19px;font-weight:700;margin:0 40px 8px 0;line-height:1.35;}
  #p-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .chip{font-size:11.5px;padding:3px 10px;border-radius:12px;background:#243149;color:#b9c8e2;}
  .chip.type{font-weight:600;}
  .chip.tag{background:transparent;border:1px solid var(--line);color:var(--text-dim);}
  .chip.alias{background:transparent;border:1px dashed #3b4d6e;color:#a9b8d4;}
  #p-summary{margin:12px 0 0;font-size:13.5px;line-height:1.75;color:#c3cfe6;}
  /* 节点操作（展开 / 锁定 / 关闭）—— Neo4j 那三个选项放在详情卡头部：
     手指点完节点，按钮就在眼前，不用在画布上够小图标。 */
  .p-actions{display:flex;gap:8px;margin:14px 0 0;}
  .p-act{
    flex:1;min-width:0;min-height:44px;padding:8px 6px;border-radius:10px;
    border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);
    font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;
    transition:border-color .15s,color .15s,background .15s;
  }
  .p-act:hover:not(:disabled){border-color:var(--accent);color:#fff;}
  .p-act:disabled{opacity:.4;cursor:default;}
  .p-act.on{border-color:var(--accent-2);color:var(--accent-2);background:rgba(240,180,41,.12);}
  .p-act.danger{color:#ffb4a8;border-color:rgba(255,120,100,.34);}
  .p-act.danger:hover:not(:disabled){border-color:#ff8a75;color:#ff8a75;background:rgba(255,120,100,.1);}
  #panel-body{flex:1;overflow-y:auto;padding:6px 16px calc(var(--sab) + 26px);-webkit-overflow-scrolling:touch;}

  .sec{margin-top:18px;}
  .sec-title{
    display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
    color:var(--accent);letter-spacing:.5px;margin:0 0 10px;
  }
  .sec-title::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent);}
  .sec-title .n{margin-left:auto;font-weight:400;color:#5f6e8a;font-size:11px;}
  .sec-hint{font-size:11.5px;color:#5f6e8a;margin:-6px 0 8px;}

  .assert{
    display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed #232f45;font-size:13.5px;
  }
  .assert:last-child{border-bottom:none;}
  .assert .k{
    flex-shrink:0;width:92px;color:var(--text-dim);font-size:12.5px;line-height:1.7;
  }
  .assert .v{flex:1;line-height:1.75;word-break:break-word;white-space:pre-wrap;color:#dbe5f6;}
  .assert .v.long{font-size:12.5px;color:#c3cfe6;}

  .ev{
    border:1px solid var(--line);border-radius:9px;background:var(--panel-2);
    padding:11px 12px;margin-bottom:9px;
  }
  .ev:last-child{margin-bottom:0;}
  .ev-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .ev-title{font-size:13.5px;font-weight:600;color:#dbe5f6;line-height:1.6;}
  .ev-src{font-size:12.5px;color:var(--text-dim);line-height:1.7;margin-top:4px;}
  .ev-cite{font-size:11.5px;color:#5f6e8a;line-height:1.7;margin-top:4px;word-break:break-word;}

  .obj-list{display:flex;flex-direction:column;gap:8px;}
  .obj{
    display:flex;align-items:center;gap:9px;padding:11px 11px;border-radius:9px;
    background:var(--panel-2);border:1px solid transparent;cursor:pointer;transition:.15s;
  }
  .obj:active{border-color:var(--accent-2);}
  .obj .rel{
    font-size:11px;color:var(--text-dim);background:#243149;border-radius:5px;
    padding:3px 7px;flex-shrink:0;min-width:54px;text-align:center;
  }
  .obj .nm{flex:1;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .obj .tp{font-size:11px;color:var(--text-dim);flex-shrink:0;}

  /* ---------- 图例（手机 = 底部抽屉；桌面 = 左下角浮层） ---------- */
  #legend{
    position:fixed;left:0;right:0;bottom:0;z-index:35;
    max-height:min(64vh,560px);max-height:min(64dvh,560px);
    background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    transform:translateY(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    padding:20px 16px calc(var(--sab) + 20px);overflow-y:auto;
    box-shadow:0 -18px 44px rgba(0,0,0,.55);
  }
  #legend.open{transform:translateY(0);}
  #legend::before{
    content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
    width:42px;height:4px;border-radius:3px;background:#3b4d6e;
  }
  .legend-head{display:flex;align-items:center;gap:10px;margin:0 0 10px;}
  #legend h4{margin:0;font-size:13px;color:var(--text-dim);font-weight:600;letter-spacing:.6px;}
  #legendAll{margin-left:auto;font-size:12px;font-weight:400;color:var(--accent-2);cursor:pointer;}
  #legend-close{
    width:28px;height:28px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text-dim);cursor:pointer;font-size:15px;line-height:1;padding:0;
  }
  #legend-close:hover{color:#fff;border-color:var(--accent-2);}
  .lg-items{display:flex;flex-wrap:wrap;gap:8px;}
  .lg-item{
    display:flex;align-items:center;gap:7px;font-size:13px;padding:8px 12px 8px 10px;
    border-radius:16px;background:#1d2637;border:1px solid transparent;
    cursor:pointer;user-select:none;transition:.15s;
  }
  .lg-item:active{border-color:#3b4d6e;}
  .lg-item.off{opacity:.32;}
  .lg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .lg-count{color:#5f6e8a;font-size:11px;}

  /* ---------- 首屏遮罩 ---------- */
  #loading{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);z-index:60;color:var(--text-dim);font-size:13.5px;flex-direction:column;gap:12px;
  }
  .spin{width:26px;height:26px;border:2px solid #2b3852;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* 布局中的提示：力导向布局跑完之前，图上还没有标签。
     不说一声，用户看到的是「一张没字的光秃秃的图」—— 像坏了。
     标签一算准就撤掉。 */
  #settling{
    position:absolute;left:50%;top:14px;transform:translateX(-50%);
    display:flex;align-items:center;gap:7px;
    background:rgba(22,29,44,.9);border:1px solid #2b3852;border-radius:999px;
    padding:6px 13px;font-size:12px;color:#b6c6e2;pointer-events:none;
    transition:opacity .25s;z-index:6;
  }
  #settling.gone{opacity:0;}
  #settling .spin{width:13px;height:13px;border-width:1.5px;}

  /* ===================================================================
     列表视图（手机默认 · 卡片流为主；画布降级为「全景图」这一可选层）
     —— 为什么不是「把桌面画布缩小放到手机上」：
        92 个节点摊在 390px 宽的屏上，节点间距约 4px，字根本放不下 ——
        那是结构问题，不是样式问题（缩小画布解决不了）。
        手机这条路走「分类卡流 → 词条卡 → 关联链条」，画布保留在「全景图」里，
        想看全局关系的人再点进去 —— 论文口径的「点选逐步延展」在列表里同样成立。
     =================================================================== */
  #viewList{
    position:absolute;top:0;left:0;right:0;bottom:0;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 13px calc(var(--sab) + 30px);
    visibility:hidden;pointer-events:none;
  }
  #viewList.on{visibility:visible;pointer-events:auto;}
  #viewGraph{position:absolute;top:0;left:0;right:0;bottom:0;visibility:hidden;pointer-events:none;}
  #viewGraph.on{visibility:visible;pointer-events:auto;}

  .lg-lead{font-size:14px;line-height:1.8;color:#c3cfe6;margin:0 0 8px;}
  .lg-disc{
    font-size:11.5px;line-height:1.7;color:#8494b4;margin:0 0 4px;
    border-left:2px solid var(--line);padding-left:9px;
  }
  .lg-ch{
    display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
    color:var(--accent);letter-spacing:.5px;margin:20px 0 10px;
  }
  .lg-ch::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent);}
  .lg-ch .lg-n{font-weight:400;color:#5f6e8a;font-size:11px;}

  /* ---------- 就医警示（患者层的「正确引导」落点） ---------- */
  .lg-urgent{
    border:1px solid #7a3333;background:rgba(122,38,38,.18);border-radius:14px;padding:12px 12px 6px;
  }
  .lg-uh{
    display:flex;align-items:flex-start;gap:8px;margin:0 0 10px;
    font-size:13px;font-weight:700;color:#ffb3a7;line-height:1.55;
  }
  .lg-uh::before{
    content:"!";flex-shrink:0;width:19px;height:19px;border-radius:50%;
    background:#c0392b;color:#fff;font-size:13px;text-align:center;line-height:19px;font-weight:700;
  }
  .u-item{
    display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;
    background:var(--panel-2);border:1px solid var(--line);border-radius:11px;
    padding:11px 12px;margin-bottom:8px;cursor:pointer;font-family:inherit;color:var(--text);
    -webkit-tap-highlight-color:transparent;transition:.15s;
  }
  .u-item:active{border-color:#ff8f80;transform:translateY(1px);}
  .u-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;}
  .u-plain{font-size:14px;font-weight:600;color:#ffe3df;line-height:1.55;}
  .u-act{font-size:12.5px;color:var(--accent);line-height:1.6;}
  .u-link{font-size:11.5px;color:var(--text-dim);line-height:1.5;}

  /* ---------- 分类卡 ---------- */
  .cat{border:1px solid var(--line);border-radius:13px;background:var(--panel);margin-bottom:9px;overflow:hidden;}
  .cat.open{border-color:#3b4d6e;}
  .cat-head{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:none;padding:13px 13px;color:var(--text);cursor:pointer;
    font-family:inherit;-webkit-tap-highlight-color:transparent;
  }
  .cat-head:active{background:var(--panel-2);}
  .cat-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .cat-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .cat-label{font-size:14.5px;font-weight:600;line-height:1.4;}
  .cat-desc{
    font-size:11.5px;color:var(--text-dim);line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .cat-n{font-size:12px;color:var(--accent);flex-shrink:0;}
  .cat-arrow{font-size:17px;color:#5f6e8a;flex-shrink:0;line-height:1;transition:transform .18s;}
  .cat.open .cat-arrow{transform:rotate(90deg);}

  /* ---------- 词条卡（分类展开后 / 检索结果） ---------- */
  .cat-body{padding:2px 9px 9px;border-top:1px solid var(--line);}
  .row{
    display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px dashed #232f45;
    padding:12px 4px;cursor:pointer;font-family:inherit;color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  .row:last-child{border-bottom:none;}
  .row:active{background:var(--panel-2);}
  .row-top{display:flex;align-items:baseline;gap:8px;}
  .row-name{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.45;}
  .row-tp{font-size:11px;flex-shrink:0;}
  .row-sum{
    font-size:12px;color:var(--text-dim);line-height:1.65;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .lg-empty{font-size:13px;color:var(--text-dim);padding:16px 4px;}
  #lgInner{max-width:820px;margin:0 auto;}

  /* ---------- 视图切换（顶栏分段控件） ---------- */
  #viewTabs{display:flex;gap:2px;flex-shrink:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:2px;}
  .tab{
    border:none;background:none;color:var(--text-dim);font-family:inherit;
    font-size:12px;padding:7px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;transition:.15s;
  }
  .tab.on{background:rgba(240,180,41,.16);color:var(--accent);font-weight:600;}
  .tab:hover{color:#fff;}

  /* 列表视图里不出现画布专属控件 */
  body[data-view="list"] #legend,body[data-view="list"] #suggest{display:none;}

  /* 滚动条 */
  #panel-body::-webkit-scrollbar,#suggest::-webkit-scrollbar,#legend::-webkit-scrollbar{width:7px;}
  #panel-body::-webkit-scrollbar-thumb,#suggest::-webkit-scrollbar-thumb,#legend::-webkit-scrollbar-thumb{background:#2b3852;border-radius:4px;}
  #panel-body::-webkit-scrollbar-track,#suggest::-webkit-scrollbar-track,#legend::-webkit-scrollbar-track{background:transparent;}

  /* ===================================================================
     宽屏（桌面 / 平板横屏）：恢复左右分栏 + 顶部横条
     —— 手机优先，宽屏只做「覆盖」，不另写一套逻辑
     =================================================================== */
  @media (min-width:861px){
    :root{--bar-h:0px;}
    #topbar{

<script>
/* =====================================================================
   KG-CORE-START —— 纯逻辑核心（检索 / 证据类型解析），无 DOM 依赖。
   独立成块的目的：可被离线测试脚本原样抽出运行，测的就是线上这份代码。
   题目无关：显示名只来自数据文件 meta.topicName，代码里不出现任何题目名。
   ===================================================================== */
(function (root) {
  "use strict";

  /* 文献类型「英文 → 中文」同义并表。
     ⛔ 只有「文献类型」这一类同义词允许写进代码（题目无关的常量）；
        节点级同义词（英文名 / 旧称 / 客户原文错字）一律走数据里的 aliases。 */
  var EVIDENCE_EN_TO_ZH = {
    "guidelines": "指南",
    "systematic reviews": "系统评价",
    "meta analysis": "Meta分析"
  };

  /* 文献类型取值域（客户约定的 12 类）；数据里实际出现的类型也会并进来。 */
  var EVIDENCE_ZH_DOMAIN = [
    "指南", "共识", "标准", "建议", "推荐", "规范", "声明",
    "系统评价", "Meta分析", "书籍", "最佳证据", "推荐实践"
  ];

  /* 归一化：去首尾空格 · 大小写不敏感 · 去掉所有内部空白
     （英文多词检索词与节点文本用同一把尺子，天然对齐）。 */
  function norm(s) {
    if (s === null || s === undefined) return "";
    return String(s).toLowerCase().trim().replace(/\s+/g, "");
  }

  function typeTable(graph) {
    var t = {};
    (graph.nodeTypes || []).forEach(function (x) {
      if (!x || !x.key) return;
      t[x.key] = {
        key: x.key,
        label: x.label || x.key,
        color: x.color || "#7f8ca6",
        shape: x.shape || "circle",
        size: x.size || 22,
        desc: x.desc || ""
      };
    });
    return t;
  }

  /* 节点可被检索命中的全部文本（**逐条**给出，不合并）：名称 · 别名 · 标签 · 简介 · 类型名 · 属性
     逐条双向子串 = 与「客户检索词覆盖」判据同一把尺子（合并后再比会漏掉
     「检索词是节点文本的上一级」这种情况，例如检索词整句包含节点名）。 */
  function nodeText(graph, node, types) {
    var t = types || typeTable(graph);
    var ti = t[node.type];
    var parts = [node.name || ""];
    (node.aliases || []).forEach(function (a) { parts.push(a); });
    (node.tags || []).forEach(function (x) { parts.push(x); });
    parts.push(node.summary || "");
    if (ti) parts.push(ti.label);
    (node.attrs || []).forEach(function (a) {
      if (a) parts.push(a.k || ""); parts.push(a.v || "");
    });
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] === null || parts[i] === undefined) continue;
      var s = String(parts[i]).trim();
      if (!s) continue;
      out.push(norm(s));
    }
    return out;
  }

  /* 节点用 attrs 声明自己的文献类型时，认这几个**字段名**（数据模型的约定，不是节点类型键）
     —— 判据第 4 条「图例与类型由数据自带」：前端不按节点类型分叉，类型键一律不写死在代码里 */
  var EVIDENCE_TYPE_ATTR_KEYS = ["文献类型", "类型", "evidenceType", "证据类型"];

  function declaredEvidenceTypes(node) {
    var out = [];
    (node.attrs || []).forEach(function (a) {
      if (!a || !a.k || !a.v) return;
      if (EVIDENCE_TYPE_ATTR_KEYS.indexOf(a.k) < 0) return;
      out.push(String(a.v));
    });
    return out;
  }

  /* 该节点是否「引用了」这一类文献（evidence.type 或节点 attrs 声明的文献类型）*/
  function nodeHasEvidenceType(node, ev) {
    var ok = (node.evidence || []).some(function (e) {
      return e && e.type && norm(e.type) === ev;
    });
    if (ok) return true;
    return declaredEvidenceTypes(node).some(function (v) { return norm(v) === ev; });
  }

  /* 本图谱里出现过的全部文献类型（归一化后的小写键 → 原始写法） */
  function evidenceTypes(graph) {
    var out = {};
    (graph.nodes || []).forEach(function (n) {
      (n.evidence || []).forEach(function (e) {
        if (e && e.type) out[norm(e.type)] = e.type;
      });
      declaredEvidenceTypes(n).forEach(function (v) {
        var k = norm(v);
        if (!out[k]) out[k] = v;
      });
    });
    return out;
  }

  /* 把一次检索解析成「文献类型」吗？返回归一化后的中文类型，否 → null。
     规则：英文同义表 → 中文取值域 → 数据里实际出现过的类型。 */
  function resolveEvidenceQuery(graph, q) {
    var qn = norm(q);
    if (!qn) return null;
    var k, i;
    for (k in EVIDENCE_EN_TO_ZH) {
      if (Object.prototype.hasOwnProperty.call(EVIDENCE_EN_TO_ZH, k) && norm(k) === qn) {
        return norm(EVIDENCE_EN_TO_ZH[k]);
      }
    }
    for (i = 0; i < EVIDENCE_ZH_DOMAIN.length; i++) {
      if (norm(EVIDENCE_ZH_DOMAIN[i]) === qn) return qn;
    }
    var present = evidenceTypes(graph);
    if (Object.prototype.hasOwnProperty.call(present, qn)) return qn;
    return null;
  }

  /* 检索：两条命中通道
     ① 节点文本通道（名称 / 别名 / 标签 / 简介 / 类型名 / 属性）—— 双向子串
     ② 文献类型通道（evidence.type）—— 命中「引用了该类型文献」的节点
     文献类型词走通道 ② 时**不**混入通道 ① 的命中（文献类型词不是节点名检索词）。 */
  function search(graph, query) {
    var qn = norm(query);
    if (!qn) return { channel: "none", hits: [], evidenceType: null };
    var types = typeTable(graph);
    var ev = resolveEvidenceQuery(graph, qn);
    if (ev) {
      var cited = [];
      (graph.nodes || []).forEach(function (n) {
        if (nodeHasEvidenceType(n, ev)) cited.push(n);
      });
      return { channel: "evidenceType", evidenceType: ev, hits: cited };
    }
    var hits = [];
    (graph.nodes || []).forEach(function (n) {
      var texts = nodeText(graph, n, types);
      for (var i = 0; i < texts.length; i++) {
        var t = texts[i];
        if (!t) continue;
        if (t.indexOf(qn) >= 0 || qn.indexOf(t) >= 0) { hits.push(n); return; }
      }
    });
    return { channel: "nodeText", evidenceType: null, hits: hits };
  }

  root.KGCORE = {
    norm: norm,
    typeTable: typeTable,
    nodeText: nodeText,
    nodeHasEvidenceType: nodeHasEvidenceType,
    evidenceTypes: evidenceTypes,
    resolveEvidenceQuery: resolveEvidenceQuery,
    search: search,
    EVIDENCE_EN_TO_ZH: EVIDENCE_EN_TO_ZH,
    EVIDENCE_ZH_DOMAIN: EVIDENCE_ZH_DOMAIN
  };
})(typeof window !== "undefined" ? window : globalThis);
/* =====================================================================
   KG-CORE-END
   ===================================================================== */
</script>
<script>
(function () {
  "use strict";

  var G = window.KG_GRAPH;
  if (!G) {
    document.getElementById("loading").innerHTML =
      '<div style="max-width:520px;line-height:1.9;text-align:center">' +
      '未找到图谱数据脚本（<code>data/*.js</code>）。<br>' +
      '请在项目根目录执行 <code>python build.py</code> 生成数据后刷新页面。</div>';
    return;
  }

  var C = window.KGCORE;

  /* ============ 窄屏判定（手机优先 · 861px 以下 = 手机布局） ============ */
  function isNarrow() { return window.innerWidth < 861; }

  /* ============ 题目元数据（显示名只在这里出现一次，来自数据文件） ============ */
  var META = G.meta || {};
  var TOPIC_NAME = META.topicName || "知识图谱";
  var TOPIC_SUB = META.subtitle || "";
  document.title = TOPIC_NAME + " · 知识图谱";
  document.getElementById("brandTitle").textContent = TOPIC_NAME;
  document.getElementById("brandSub").textContent = TOPIC_SUB;

  /* ============ 基础索引 ============ */
  var TYPES = C.typeTable(G);
  var TYPE_ORDER = Object.keys(TYPES);
  var FALLBACK = { color: "#7f8ca6", shape: "circle", size: 22 };
  var CATS = [];
  /* 类型表 = 数据声明的 nodeTypes（样式随数据走）+ 数据用到但未声明的兜底类型 */
  (G.nodeTypes || []).forEach(function (t) {
    if (!t || !t.key || !TYPES[t.key]) return;
    var info = TYPES[t.key];
    info.index = CATS.length;
    CATS.push(info);
  });
  (G.nodes || []).forEach(function (n) {
    if (!n.type || TYPES[n.type]) return;
    TYPES[n.type] = {
      key: n.type, label: n.type, color: FALLBACK.color,
      shape: FALLBACK.shape, size: FALLBACK.size, desc: "", index: CATS.length
    };
    CATS.push(TYPES[n.type]);
  });
  function typeOf(n) {
    return TYPES[n.type] || { key: n.type, label: n.type || "?", color: FALLBACK.color, shape: FALLBACK.shape, size: FALLBACK.size, index: 0 };
  }

  var REL = {};
  (G.relationTypes || []).forEach(function (r) { if (r && r.key) REL[r.key] = r; });

  var NODE = {};
  (G.nodes || []).forEach(function (n) { NODE[n.id] = n; });

  var degree = {};
  (G.edges || []).forEach(function (e) {
    degree[e.source] = (degree[e.source] || 0) + 1;
    degree[e.target] = (degree[e.target] || 0) + 1;
  });
  var maxDeg = Math.max.apply(null, Object.keys(degree).map(function (k) { return degree[k]; }).concat([1]));

  /* 枢纽节点（度数最高的一批）—— 手机上只给这几个挂标签：
     节点在屏幕上挨得近，标签一多就互相压字。
     候选给到 12 个，实际能画出几个由「避让」定：压字的、被画布切掉的自动不画。
     候选少 → 屏幕上大片空白没字；候选多 → 避让算法兜底。 */
  var hubSet = {};
  (G.nodes || []).slice().sort(function (a, b) {
    return (degree[b.id] || 0) - (degree[a.id] || 0);
  }).slice(0, 12).forEach(function (n) { hubSet[n.id] = true; });

  /* ============ 状态 ============ */
  var state = {
    hidden: {},        // type key -> true 表示隐藏
    labelsAll: false,
    selected: null,
    query: "",
    hits: [],          // 当前检索命中的节点 id 列表
    labelOff: {},      // id -> true 表示「被避让掉了，这一帧不画标签」
    labelSide: {},     // id -> "left" 表示标签翻到了节点左侧
    pos: {},           // id -> [x, y]：布局冻结后的节点坐标
    frozen: false,     // 布局是否已定型（定型后才放标签）
    vis: {},           // id -> true：当前画在画布上的节点（逐步展开的可见集）
    locked: {},        // id -> true：锁定 —— 重置时保留 · 展开时新节点避开它
    expanded: {},      // id -> true：已经展开过
    view: "graph"      // "list" 卡片流 | "graph" 画布（手机默认 list，桌面默认 graph）
  };
  /* 每次展开最多长这么多个：一次几十个点糊上来 = 又一次「一锅粥」。
     先按数据声明的类型顺序（论文框架就是顺序）和度数排，剩下的留在
     「展开 · N」里，想继续点就再点一下。 */
  var EXPAND_MAX = 16;
  var TORDER = {};
  CATS.forEach(function (t, i) { TORDER[t.key] = i; });
  function sortByTypeOrder(ids) {
    return ids.slice().sort(function (a, b) {
      var oa = TORDER[NODE[a].type], ob = TORDER[NODE[b].type];
      if (oa !== ob) return (oa == null ? 99 : oa) - (ob == null ? 99 : ob);
      return (degree[b] || 0) - (degree[a] || 0);
    });
  }

  /* ============ 患者层数据（可选 · 来自 data/<topicKey>-patient.js） ============
     这份文件是给「患者」看的那一层：免责声明 + 一句导语 + 就医警示。
     警示的每一句都挂在图谱里**已存在、且带文献出处**的节点上 ——
     构建时校验过（build.py 的 P 系列），所以这里不会出现没有出处的医学断言。
     题目无关：内容全部来自数据文件，代码里不出现任何题目名。 */
  var PG = window.KG_PATIENT || null;
  var DEFAULT_DISCLAIMER =
    "本页内容整理自公开文献，用于护理与健康科普，不能替代医生的诊断和治疗。身体不适请及时就医。";

  /* ============ 列表视图（卡片流为主 · 画布降级为可选的一层） ============ */
  var lgIntro   = document.getElementById("lgIntro");
  var lgUrgent  = document.getElementById("lgUrgent");
  var lgResults = document.getElementById("lgResults");
  var lgCats    = document.getElementById("lgCats");
  var expandedType = null;      /* 当前展开的分类（null = 全部收起） */

  function countByType() {
    var c = {};
    (G.nodes || []).forEach(function (n) { c[n.type] = (c[n.type] || 0) + 1; });
    return c;
  }
  function nodesOfType(key) {
    return (G.nodes || []).filter(function (n) { return n.type === key; });
  }
  /* 词条卡 —— 名字 + 一句大白话。
     节点的 summary 本身就是大白话（「嗓子发紧、像有东西卡住，是需要立刻处理的危险信号」），
     所以这里直接用，不必另写一套文案 —— 两处说法不会漂。 */
  function nodeRow(n) {
    var t = typeOf(n);
    return '<button type="button" class="row" data-id="' + esc(n.id) + '">' +
      '<span class="row-top"><span class="row-name">' + esc(n.name) + '</span>' +
      '<span class="row-tp" style="color:' + t.color + '">' + esc(t.label) + '</span></span>' +
      '<span class="row-sum">' + esc(n.summary || "") + '</span></button>';
  }
  /* 一个元素只绑一次（renderList 与 renderListResults 会先后重画同一块区域） */
  function bindOnce(root, sel, fn) {
    root.querySelectorAll(sel).forEach(function (el) {
      if (el.dataset.bound) return;
      el.dataset.bound = "1";
      el.addEventListener("click", fn);
    });
  }
  function bindListEvents() {
    bindOnce(lgCats, ".cat-head", function (ev) {
      var k = ev.currentTarget.dataset.type;
      expandedType = (expandedType === k) ? null : k;
      renderList();
      var box = lgCats.querySelector('.cat[data-type="' + k + '"]');
      if (box && expandedType === k) {
        try { box.scrollIntoView({ block: "nearest" }); } catch (e) {}
      }
    });
    bindOnce(lgCats, ".row", function (ev) { pick(ev.currentTarget.dataset.id); });
    bindOnce(lgUrgent, ".u-item", function (ev) { pick(ev.currentTarget.dataset.id); });
    bindOnce(lgResults, ".row", function (ev) { pick(ev.currentTarget.dataset.id); });
  }
  function renderList() {
    var countMap = countByType();
    var intro = (PG && PG.intro) ? PG.intro : "";
    var disc  = (PG && PG.disclaimer) ? PG.disclaimer : DEFAULT_DISCLAIMER;
    lgIntro.innerHTML =
      (intro ? '<p class="lg-lead">' + esc(intro) + '</p>' : '') +
      '<p class="lg-disc">' + esc(disc) + '</p>';

    /* 就医警示 —— 「正确引导」的落点：先让人对号入座，再点进去看依据 */
    var urgent = (PG && PG.urgent) || [];
    if (urgent.length) {
      lgUrgent.innerHTML =
        '<div class="lg-urgent"><h3 class="lg-uh">' +
        esc((PG && PG.urgentTitle) || "出现这些情况，请及时就医") + '</h3>' +
        urgent.map(function (u) {
          var n = NODE[u.nodeId];
          return '<button type="button" class="u-item" data-id="' + esc(u.nodeId) + '">' +
            '<span class="u-body">' +
            '<span class="u-plain">' + esc(u.plain) + '</span>' +
            '<span class="u-act">' + esc(u.action) + '</span>' +
            (n ? '<span class="u-link">相关知识：' + esc(n.name) + ' ›</span>' : '') +
            '</span></button>';
        }).join("") + '</div>';
    } else {

    /* 分类卡流 —— 顺序取自数据声明的 nodeTypes 顺序，

    var cats = CATS.filter(function (t) { return countMap[t.key]; });
    lgCats.innerHTML = '<h3 class="lg-ch">按分类浏览</h3>' + cats.map(function (t) {
      var open = expandedType === t.key;
      return '<div class="cat' + (open ? " open" : "") + '" data-type="' + esc(t.key) + '">' +
        '<button type="button" class="cat-head" data-type="' + esc(t.key) + '">' +
          '<span class="cat-dot" style="background:' + t.color + '"></span>' +
          '<span class="cat-txt"><span class="cat-label">' + esc(t.label) + '</span>' +
          '<span class="cat-desc">' + esc(t.desc || "") + '</span></span>' +
          '<span class="cat-n">' + (countMap[t.key]) + '</span>' +
          '<span class="cat-arrow">›</span>' +
        '</button>' +
        (open ? '<div class="cat-body">' +
          nodesOfType(t.key).map(nodeRow).join("") + '</div>' : '') +

  }
  /* 检索结果 —— 列表视图里用它替代下拉建议（手机上下拉会盖住内容） */
  function renderListResults(hits) {
    if (!state.query) { lgResults.innerHTML = ""; bindListEvents(); return; }
    if (!hits || !hits.length) {
      lgResults.innerHTML = '<div class="lg-empty">未找到匹配内容</div>';
      bindListEvents();
      return;
    }
    lgResults.innerHTML = '<h3 class="lg-ch">检索结果<span class="lg-n">' +
      hits.length + ' 条</span></h3>' + hits.map(nodeRow).join("");
    bindListEvents();
  }

  /* ============ 视图切换 ============ */
  var viewReady = false;      /* 首次 setView 是初始化，不重跑镜头适配 */
  function setView(v) {
    state.view = v;
    document.body.setAttribute("data-view", v);
    document.getElementById("viewList").classList.toggle("on", v === "list");
    document.getElementById("viewGraph").classList.toggle("on", v === "graph");
    document.getElementById("tabList").classList.toggle("on", v === "list");
    document.getElementById("tabGraph").classList.toggle("on", v === "graph");
    document.getElementById("tools").style.display = (v === "graph") ? "" : "none";
    updateActions();                   /* 切视图时同步按钮的可用性 */
    if (v === "list") {
      document.getElementById("suggest").style.display = "none";
      return;
    }
    if (!viewReady) return;
    /* 回到画布：镜头重新适配一次；检索词还在的话把下拉建议也补上。
       布局还没定型时**不要**在这里冻结 —— 冻结 = 把半程坐标定死 = 一团乱麻；
       让定型流程自己收尾，定型后再补高亮与检索态。 */
    setTimeout(function () {
      try { initialView(); } catch (e) {}
      if (!state.frozen) return;
      try { focusSet(); } catch (e) {}
      if (state.query) { try { doSearch(state.query); } catch (e) {} }
    }, 60);
  }
  document.getElementById("tabList").addEventListener("click", function () { setView("list"); });
  document.getElementById("tabGraph").addEventListener("click", function () { setView("graph"); });

  /* ============ 逐步展开（Neo4j 式：点一个节点 → 长出一圈） ============
     为什么不一次画全：92 个节点铺在 390px 的屏上间距只有约 4px，点不准也读不清
     —— 这是结构问题，改字号 / 配色都解决不了。改成从「主题节点」起步、点到哪长到哪，
     也就是论文正文写的那句「点选逐步延展」。
     题目无关：种子节点由数据推出来（第一个声明类型里度数最高的那个），
     代码里不出现任何题目名（判据第 11 条）。 */
  var ADJ = {};
  (G.edges || []).forEach(function (e) {
    (ADJ[e.source] = ADJ[e.source] || []).push(e.target);
    (ADJ[e.target] = ADJ[e.target] || []).push(e.source);
  });
  function neighborsOf(id) { return ADJ[id] || []; }
  function typeHidden(nid) {
    var n = NODE[nid];
    return !n || !!state.hidden[n.type];
  }
  /* 还没画出来、且没被类型筛选藏掉的邻居 —— 「展开 · N」里的 N 就是它 */
  function expandableOf(id) {
    var seen = {}, out = [];
    neighborsOf(id).forEach(function (nid) {
      if (seen[nid] || state.vis[nid] || typeHidden(nid)) return;
      seen[nid] = true; out.push(nid);
    });
    return sortByTypeOrder(out);
  }
  function seedNode() {
    function best(arr) {
      var b = null;
      (arr || []).forEach(function (n) {
        if (!b || (degree[n.id] || 0) > (degree[b.id] || 0)) b = n;
      });
      return b;
    }
    /* ① 名字就是题目名的那一个（数据里有就直接用它当中心）；
       ② 否则取第一种声明类型里度数最高的（论文框架第一层）；
       ③ 再没有就取全图度数最高的。 */
    var tname = (G.meta && G.meta.topicName) || "";
    if (tname) {
      var exact = (G.nodes || []).filter(function (n) { return n.name === tname; });
      if (exact.length) return best(exact);
    }
    var firstType = (CATS[0] || {}).key;
    return best((G.nodes || []).filter(function (n) { return n.type === firstType; })) || best(G.nodes);
  }
  var SEED_MAX_NEIGHBORS = 14;      /* 首屏上限：再多就不像「一张图」而像「一锅粥」 */
  function applySeed() {
    state.vis = {}; state.locked = {}; state.expanded = {};
    var root = seedNode();
    if (!root) return;
    state.vis[root.id] = true;
    /* 起步 = 主题节点 + 它的一圈邻居：既不空，又能一眼看出「还能往下点」。
       邻居多的时候只放前 14 个（按数据声明的类型顺序排，论文框架就是顺序）
       —— 其余的留在「展开 · N」里，点一下再长出来。 */
    var ns = sortByTypeOrder(neighborsOf(root.id).filter(function (nid) { return !typeHidden(nid); }));
    ns.slice(0, SEED_MAX_NEIGHBORS).forEach(function (nid) { state.vis[nid] = true; });
    state.expanded[root.id] = true;
  }
  /* 新节点的位置：围着「被展开的那个节点」摆一圈。
     旧节点一个都不动 —— 动了就是又一次「图一直抖」。 */
  function hashAngle(id) {
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 3600;
    return (h / 3600) * Math.PI * 2;
  }
  function tooClose(x, y, min, extra) {
    var keys = Object.keys(state.pos);
    for (var i = 0; i < keys.length; i++) {
      var p = state.pos[keys[i]];
      if (!p) continue;
      if (Math.abs(p[0] - x) < min && Math.abs(p[1] - y) < min) return true;
    }
    for (var j = 0; j < extra.length; j++) {
      if (Math.abs(extra[j][0] - x) < min && Math.abs(extra[j][1] - y) < min) return true;
    }
    return false;
  }
  function placeAround(pid, ids) {
    var p = state.pos[pid];
    if (!p) {
      /* 还没冻结时 pos 是空的 → 直接读当前布局坐标 */
      var d0 = chart.getModel().getSeriesByIndex(0).getData();
      for (var i0 = 0; i0 < d0.count(); i0++) {
        var raw0 = d0.getRawDataItem(i0);
        if (!raw0 || raw0.id !== pid) continue;
        var l0 = d0.getItemLayout(i0);
        if (l0 && !isNaN(l0[0])) p = [l0[0], l0[1]];
        break;
      }
    }
    if (!p) p = [0, 0];
    var n = Math.max(ids.length, 1);
    /* 往「外面」长：从已画出来的这团的质心指向父节点，子节点落在这个方向的
       外侧扇形里 —— 像树枝，而不是压回中间那一堆。父节点正好在质心上
       （一般就是根节点）时退回整圈均布。 */
    var cx = 0, cy = 0, cc = 0;
    Object.keys(state.pos).forEach(function (k) {
      var q = state.pos[k];
      if (q) { cx += q[0]; cy += q[1]; cc++; }
    });
    var away = 0, hasDir = false;
    if (cc > 1) {
      cx /= cc; cy /= cc;
      if (Math.abs(p[0] - cx) + Math.abs(p[1] - cy) > 2) {
        away = Math.atan2(p[1] - cy, p[0] - cx);
        hasDir = true;
      }
    }
    var base = hasDir ? away : hashAngle(pid);
    var span = hasDir ? Math.PI * 1.2 : Math.PI * 2;     /* 外侧扇形 ≈ 216° */
    var start = base - span / 2;
    var out = [];
    var ring = 96 + Math.min(n, 10) * 6;
    for (var k = 0; k < ids.length; k++) {
      var ang = start + (n === 1 ? span / 2 : k * span / (n - 1));
      var r = ring, x = p[0], y = p[1], guard = 0;
      while (guard++ < 40) {
        x = p[0] + Math.cos(ang) * r;
        y = p[1] + Math.sin(ang) * r;
        if (!tooClose(x, y, 64, out)) break;
        ang += 0.55; r += 14;            /* 撞上了 → 换个角度、再往外让一让 */
      }

  }
  function offscreen(id) {
    var p = state.pos[id];
    if (!p) return false;

    if (!q) return true;
    var m = 16;
    return q[0] < m || q[0] > chart.getWidth() - m || q[1] < m || q[1] > chart.getHeight() - m;
  }
  function expandNode(id) {
    var ids = expandableOf(id).slice(0, EXPAND_MAX);   /* 一次最多长一圈，剩下的下次再点 */
    if (!ids.length) return 0;
    freezeLayout();                     /* 旧的先定型，新节点才不会把老节点挤跑 */
    var pts = placeAround(id, ids);
    ids.forEach(function (nid, i) {
      state.vis[nid] = true;
      state.pos[nid] = pts[i];
    });
    state.expanded[id] = true;
    paintGraph();
    for (var i = 0; i < ids.length; i++) {
      if (offscreen(ids[i])) { fitView(isNarrow() ? 40 : 80); break; }
    }
    scheduleLabelAvoid();
    return ids.length;
  }
  function removeNode(id) {
    if (!id) return false;
    delete state.vis[id];
    delete state.expanded[id];
    delete state.locked[id];
    if (state.selected === id) {
      state.selected = null;
      document.getElementById("panel").classList.remove("open");
      document.getElementById("scrim").classList.remove("show");
    }
    paintGraph();
    scheduleLabelAvoid();
    return true;
  }
  /* 把图例里刚点开的这类节点补上：只补「挂在已展开节点上的」那些 ——
     否则用户点开「文献」，画布上什么也不会发生（它们根本还没被展开过）。 */
  function revealNeighborsOfType(k) {
    var added = 0;
    Object.keys(state.vis).forEach(function (vid) {
      var ids = neighborsOf(vid).filter(function (nid) {
        var n = NODE[nid];
        return n && n.type === k && !state.vis[nid];
      });
      if (!ids.length) return;
      var pts = placeAround(vid, ids);
      ids.forEach(function (nid, i) {
        if (state.vis[nid]) return;
        state.vis[nid] = true;
        state.pos[nid] = pts[i];
        added++;
      });
    });
    return added;
  }
  function toggleLock(id) {
    if (!id) return;
    if (state.locked[id]) delete state.locked[id];
    else state.locked[id] = true;
    paintGraph();
  }
  /* 检索命中的节点可能不在画布上（还没展开到）—— 选中前先把它放出来 */
  function revealNode(id) {
    if (state.vis[id]) return;
    var c = chart.convertFromPixel({ seriesIndex: 0 },
      [chart.getWidth() / 2, chart.getHeight() / 2]) || [0, 0];
    state.pos[id] = [c[0], c[1]];
    state.vis[id] = true;
  }
  /* 点选按「离手指最近的点」算，而不是「画在最上层的那个」：
     节点小、彼此又挨得近时，zrender 的命中是「画得晚的赢」——
     点 A 会打开 B。最近邻之后，指头粗一点也点得中，点哪儿就是哪儿。 */
  function nearestNode(px, py, maxDist) {
    var best = null, bestD = maxDist;
    Object.keys(state.vis).forEach(function (id) {
      if (typeHidden(id)) return;
      var p = state.pos[id];
      if (!p) return;
      var q = chart.convertToPixel({ seriesIndex: 0 }, p);
      if (!q || isNaN(q[0]) || isNaN(q[1])) return;
      var dx = q[0] - px, dy = q[1] - py;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d <= bestD) { bestD = d; best = id; }
    });
    return best;
  }

  /* ============ 构建 ECharts 数据 ============ */
  function nodeSymbolSize(n) {
    var base = typeOf(n).size || 24;
    var d = degree[n.id] || 0;
    var s = Math.round(base * (0.72 + 0.75 * Math.sqrt(d / maxDeg)));
    /* 手机上节点要小 —— 逐步展开之后屏幕上本来就只有十几二十个节点，
       不再靠「把节点撑大」来点得中（点选按最近邻算，见 nearestNode）。 */
    return isNarrow() ? Math.max(13, Math.round(s * 0.62)) : s;
  }
  /* 画布上的标签只放「短名」—— 文献题名动辄一两百字符，
     原样画出来会冲出屏幕右边（完整题名在 tooltip 与详情面板里看得到）。 */
  function shortLabel(name) {
    var s = String(name == null ? "" : name);
    if (s.length <= 16) return s;
    var cut = s.slice(0, 16);
    /* 拉丁文按词边界切，别切在半截单词上 */
    if (!/[\u4e00-\u9fff]/.test(cut)) {
      var sp = cut.lastIndexOf(" ");
      if (sp >= 8) cut = cut.slice(0, sp);
    }
    return cut.replace(/[\s,;:.]+$/, "") + "…";
  }
  /* 文本像素宽度：用真实字体量，别估。
     估算（拉丁按 0.56 字宽）会系统性偏窄 —— 实测 "Management and…" 在 13px 下
     真实 121px / 估算 109px，偏窄 11%：避让算出来的框比画出来的字窄，
     两个标签就会压到一起。真量一次（canvas measureText）成本可忽略。 */
  var _measureCtx = null, _measureCache = {};
  function measureCtx() {
    if (_measureCtx === null) {

      catch (e) { _measureCtx = false; }
    }
    return _measureCtx || null;
  }
  function textWidth(str, fs) {
    var key = fs + "|" + str;
    if (_measureCache[key] != null) return _measureCache[key];
    var w = 0, ctx = measureCtx();
    if (ctx) {
      try {
        ctx.font = fs + "px sans-serif";
        w = ctx.measureText(str).width;
      } catch (e) { w = 0; }
    }
    if (!w) {   /* 量不出来（字体未就绪 / 老浏览器）→ 退回估算 */
      for (var i = 0; i < str.length; i++) {
        w += str.charCodeAt(i) > 0x2e80 ? fs : fs * 0.56;
      }
    }
    _measureCache[key] = w;
    return w;
  }

  function shouldShowLabel(n) {
    if (state.labelsAll) return true;
    /* 窄屏：先都试着标 —— 放不下的由避让算法自动不画。
       逐步展开之后画面上的节点本来就少，标出来才认得出哪个是哪个。 */
    if (isNarrow()) return true;
    return (degree[n.id] || 0) >= 5;
  }
  function buildNodes() {
    return (G.nodes || []).filter(function (n) { return state.vis[n.id]; }).map(function (n) {
      var t = typeOf(n);
      var it = {
        id: n.id,
        name: n.name,
        category: t.index,
        symbolSize: nodeSymbolSize(n),
        symbol: t.shape === "pin" ? "circle" : (t.shape || "circle"),
        itemStyle: {
          color: t.color,
          borderColor: "rgba(255,255,255,.55)",
          borderWidth: 1.2,
          shadowBlur: 12,
          shadowColor: "rgba(0,0,0,.55)"
        },
        label: {
          /* 布局没定型之前不画标签 —— 标签是按坐标摆的，
             坐标还在动，摆出来的字就追不上节点（还会互相压字）。
             定型之后一次性算准，见 freezeLayout()。 */
          show: state.frozen && shouldShowLabel(n) && !state.labelOff[n.id],
          fontSize: isNarrow() ? 13 : 11.5,
          color: "#e8eefc",

          distance: 5,

      var p = state.pos[n.id];

    return (G.edges || []).filter(function (e) {

      return {
        source: e.source,
        target: e.target,
        value: e.label,
        lineStyle: {
          color: (a ? typeOf(a).color : "#2b3852"),
          opacity: .42, width: 1.1, curveness: .06
        }
      };

  /* ============ 初始化图表 ============ */
  var chart = echarts.init(document.getElementById("chart"), null, { renderer: "canvas" });
  applySeed();          /* 画布从「主题节点 + 一圈邻居」起步，不是一屏铺满 */
  var option = {
    backgroundColor: "transparent",
    animationDuration: 700,
    animationEasingUpdate: "quinticInOut",
    tooltip: {
      confine: true,          /* 手机上提示框不许溢出画布 */
      backgroundColor: "rgba(22,29,44,.96)",
      borderColor: "#2b3852",
      borderWidth: 1,
      padding: [9, 13],
      textStyle: { color: "#e8eefc", fontSize: 12 },
      formatter: function (p) {
        if (p.dataType === "edge") {
          var a = NODE[p.data.source], b = NODE[p.data.target];
          return '<b style="color:#f0b429">' + esc(p.data.value) + '</b><br>' +

          '<br><span style="color:' + t.color + '">' + esc(t.label) + '</span>' +
          '<br><span style="color:#93a3c0">度数 ' + (degree[n.id] || 0) + ' · 点击可查看详情并展开关联</span>';

    },
    series: [{
      id: "kg",
      type: "graph",
      layout: "force",
      roam: true,

        ? { repulsion: 210, edgeLength: [46, 118], gravity: 0.055, friction: 0.18, layoutAnimation: true, initLayout: "circular" }
        : { repulsion: 380, edgeLength: [70, 190], gravity: 0.075, friction: 0.16, layoutAnimation: true, initLayout: "circular" },
      emphasis: {
        focus: "adjacency",
        scale: 1.16,
        itemStyle: { borderColor: "#f0b429", borderWidth: 3 },
        label: { show: true, fontSize: 13, fontWeight: "bold" },
        lineStyle: { width: 2.6, opacity: .95 }
      },
      blur: {
        itemStyle: { opacity: .16 },
        label: { show: false },
        lineStyle: { opacity: .05 }
      },
      select: {
        itemStyle: { borderColor: "#f0b429", borderWidth: 3 },
        label: { show: true },
        disabled: false
      },
      labelLayout: { hideOverlap: true },
      lineStyle: { curveness: .06 }
    }]
  };
  chart.setOption(option);

  /* 视口变化先跟着重排；只有宽度变了（旋转 / 改窗口）才重新适配视图 */
  var lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    chart.resize();
    if (window.innerWidth !== lastW) {
      lastW = window.innerWidth;
      setTimeout(function () { initialView(); }, 260);
      setTimeout(function () { initialView(); }, 1200);   /* 布局还在长 → 补一次适配 */
    }
  });

  /* ============ 图例（由数据自带，不在代码里写死） ============ */
  function renderLegend() {
    var body = document.getElementById("legend-body");
    var countMap = {};
    (G.nodes || []).forEach(function (n) { countMap[n.type] = (countMap[n.type] || 0) + 1; });
    var items = CATS.filter(function (t) { return countMap[t.key]; });
    body.innerHTML = '<div class="lg-items">' + items.map(function (t) {
      return '<div class="lg-item' + (state.hidden[t.key] ? " off" : "") + '" data-type="' + esc(t.key) + '" title="' + esc(t.desc || t.label) + '">' +
        '<span class="lg-dot" style="background:' + t.color + '"></span>' +
        '<span>' + esc(t.label) + '</span>' +
        '<span class="lg-count">' + (countMap[t.key] || 0) + '</span></div>';
    }).join("") + '</div>';
    body.querySelectorAll(".lg-item").forEach(function (el) {
      el.addEventListener("click", function () {
        var k = el.dataset.type;
        state.hidden[k] = !state.hidden[k];
        el.classList.toggle("off", !!state.hidden[k]);
        if (!state.hidden[k]) revealNeighborsOfType(k);
        applyFilter();
      });
    });
    document.getElementById("legendAll").addEventListener("click", function () {
      var offTypes = Object.keys(state.hidden).filter(function (k) { return state.hidden[k]; });
      state.hidden = {};
      body.querySelectorAll(".lg-item").forEach(function (el) { el.classList.remove("off"); });
      offTypes.forEach(function (k) { revealNeighborsOfType(k); });
      applyFilter();
    });
  }

  /* ============ 画布渲染：一个出口 ============
     隐藏类型 / 检索命中 / 选中聚焦 / 锁定，全部在这里一次算完。
     旧的 applyFilter 与 focusSet 各算一套 —— focusSet 里漏掉了「隐藏类型」
     这一支，于是点一下节点，刚才筛掉的类型又全冒出来。合并成一个出口，
     不再有两套口径。 */
  function paintGraph() {
    var sel = (state.selected && state.vis[state.selected]) ? state.selected : null;
    var focus = null;
    if (sel) {
      focus = {};
      focus[sel] = true;
      neighborsOf(sel).forEach(function (nid) { if (state.vis[nid]) focus[nid] = true; });
    }
    var nodes = buildNodes().map(function (d) {
      if (state.hidden[d._type]) {
        d.itemStyle = { opacity: 0, color: "transparent", borderWidth: 0, shadowBlur: 0 };
        d.label.show = false;
        return d;
      }
      if (state.query) {
        if (state.hitsMap[d.id]) {
          d.itemStyle = { color: typeOf(d).color, borderColor: "#f0b429", borderWidth: 2, opacity: 1, shadowBlur: 18, shadowColor: "rgba(240,180,41,.5)" };
          d.label.show = true;
        } else {
          d.itemStyle = { color: typeOf(d).color, opacity: .12, borderWidth: 0, shadowBlur: 0 };
          d.label.show = false;
        }
      } else if (focus) {
        if (focus[d.id]) {
          d.itemStyle = {
            color: typeOf(d).color,
            borderColor: d.id === sel ? "#f0b429" : "rgba(240,180,41,.6)",
            borderWidth: d.id === sel ? 3 : 2,
            opacity: 1, shadowBlur: 16, shadowColor: "rgba(0,0,0,.6)"
          };
          d.label.show = true;
        } else {
          d.itemStyle = { color: typeOf(d).color, opacity: .14, borderWidth: 0, shadowBlur: 0 };
          d.label.show = false;
        }
      }
      /* 锁定 = 画一圈青边（重置时保留它；展开时新节点避开它） */
      if (state.locked[d.id]) {
        d.itemStyle.borderColor = "#7fd1ff";
        if (!focus || !focus[d.id]) d.itemStyle.borderWidth = 2;
      }
      return d;
    });
    var links = buildLinks().map(function (l) {
      var a = NODE[l.source], b = NODE[l.target];
      if ((a && state.hidden[a.type]) || (b && state.hidden[b.type])) {
        l.lineStyle = { opacity: 0, width: 0 };
        return l;
      }
      if (state.query) {
        if (state.hitsMap[l.source] && state.hitsMap[l.target]) {
          l.lineStyle = { color: "#f0b429", opacity: .95, width: 2.2, curveness: .06 };
        } else {
          l.lineStyle = { color: "#2b3852", opacity: .12, width: 1, curveness: .06 };
        }
      } else if (focus) {
        if (focus[l.source] && focus[l.target]) {
          l.lineStyle = { color: "#f0b429", opacity: .9, width: 2.2, curveness: .06 };
        } else {
          l.lineStyle = { color: "#2b3852", opacity: .1, width: 1, curveness: .06 };
        }
      }
      return l;
    });
    chart.setOption({ series: [{ id: "kg", data: nodes, links: links }] });
    updateStats();
  }
  function applyFilter() { freezeLayout(); paintGraph(); }

  /* 选中一个节点 → 高亮它 + 它的直接关联节点，其余压暗 */
  function focusSet() {
    /* 列表视图下画布不可见 —— 不碰它（碰了会白白重启一次力导向布局） */
    if (state.view === "list") return;
    freezeLayout();          /* 换数据会重启布局 → 先定型（已定型则空转） */
    paintGraph();
  }

  /* ============ 检索（三通道） ============ */
  function doSearch(q) {
    var box = document.getElementById("suggest");
    state.query = (q || "").trim();
    document.getElementById("clearSearch").style.display = state.query ? "block" : "none";
    if (!state.query) {
      box.style.display = "none";
      state.hits = []; state.hitsMap = {};
      renderListResults([]);
      focusSet();
      return;
    }
    var res = C.search(G, state.query);
    var hits = res.hits || [];
    state.hits = hits.map(function (n) { return n.id; });
    state.hitsMap = {};
    state.hits.forEach(function (id) { state.hitsMap[id] = true; });

    var qn = C.norm(state.query);
    hits.sort(function (a, b) {
      var an = C.norm(a.name).indexOf(qn), bn = C.norm(b.name).indexOf(qn);
      if (an !== bn) return (an < 0 ? 999 : an) - (bn < 0 ? 999 : bn);
      return (degree[b.id] || 0) - (degree[a.id] || 0);
    });

    var note = "";
    if (res.channel === "evidenceType") {
      note = '按<b>文献类型</b>「' + esc(res.evidenceType) + '」命中 ' + hits.length + ' 个节点';
    } else {
      note = '按<b>名称 / 别名</b>命中 ' + hits.length + ' 个节点';
    }
    /* 列表视图：结果直接铺在列表里（下拉建议在手机上会盖住内容） */
    renderListResults(hits);

    /* 画布视图：下拉建议（inline 样式会盖过样式表，所以这里必须显式开关） */
    if (state.view !== "graph") {
      /* 手机上「打了字却看不到变化」= 以为页面坏了 ⇒ 把结果滚到眼前。
         （结果块在分类流上方；不滚的话用户看着分类卡以为检索没生效）
         ⚠️ 只在结果块**不在视野里**时滚 —— 每敲一个字都把用户拽回顶部
            = 另一种难用（正在读结果的人会被打断）。 */
      if (state.query) {
        try {
          var vr = lgResults.getBoundingClientRect();
          var lr = document.getElementById("viewList").getBoundingClientRect();
          if (vr.top < lr.top || vr.bottom > lr.bottom) {
            lgResults.scrollIntoView({ block: "start" });
          }
        } catch (e) {}
      }
      focusSet();
      return;
    }
    var top = hits.slice(0, 24);
    box.innerHTML = '<div id="suggestNote">' + note + '</div>' +
      (top.length ? top.map(function (n, i) {
        var t = typeOf(n);
        return '<div class="sg-item' + (i === 0 ? " active" : "") + '" data-id="' + esc(n.id) + '">' +
          '<span class="sg-dot" style="background:' + t.color + '"></span>' +
          '<span class="sg-name">' + esc(n.name) + '</span>' +
          '<span class="sg-type">' + esc(t.label) + '</span></div>';
      }).join("") : '<div class="sg-empty">未找到匹配节点</div>');
    box.style.display = "block";
    box.querySelectorAll(".sg-item").forEach(function (el) {
      el.addEventListener("click", function () { pick(el.dataset.id); });
    });
    focusSet();
  }

  /* ============ 详情面板 ============ */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }
  function other(e, n) { return e.source === n.id ? e.target : e.source; }
  function relText(e, n) {
    return (e.source === n.id) ? (e.label + " →") : ("← " + e.label);
  }

  function renderPanel(n) {
    var t = typeOf(n);
    document.getElementById("p-name").textContent = n.name || "";
    document.getElementById("p-meta").innerHTML =
      '<span class="chip type" style="background:' + t.color + '33;color:' + t.color + '">' + esc(t.label) + '</span>' +
      '<span class="chip">度数 ' + (degree[n.id] || 0) + '</span>' +
      (n.tags || []).map(function (g) { return '<span class="chip tag">' + esc(g) + '</span>'; }).join("") +
      (n.aliases || []).map(function (a) { return '<span class="chip alias">' + esc(a) + '</span>'; }).join("");
    document.getElementById("p-summary").textContent = n.summary || "";

    var body = document.getElementById("panel-body");
    var html = "";

    /* --- 属性 --- */
    if (n.attrs && n.attrs.length) {
      html += '<div class="sec"><h3 class="sec-title">属性<span class="n">' + n.attrs.length + ' 条</span></h3><div>' +
        n.attrs.map(function (a) {
          var long = String(a.v).length > 34;
          return '<div class="assert"><div class="k">' + esc(a.k) + '</div>' +
            '<div class="v' + (long ? " long" : "") + '">' + esc(a.v) + '</div></div>';
        }).join("") + '</div></div>';
    }

    /* --- 别名（客户原文的英文写法 / 旧称 / 错字写法都在这里） --- */
    if (n.aliases && n.aliases.length) {
      html += '<div class="sec"><h3 class="sec-title">别名<span class="n">' + n.aliases.length + ' 个</span></h3>' +
        '<div>' + n.aliases.map(function (a) {
          return '<span class="chip alias" style="margin:0 6px 6px 0;display:inline-block;">' + esc(a) + '</span>';
        }).join("") + '</div></div>';
    }

    /* --- 文献出处 --- */
    if (n.evidence && n.evidence.length) {
      html += '<div class="sec"><h3 class="sec-title">文献出处<span class="n">' + n.evidence.length + ' 条</span></h3>' +
        n.evidence.map(function (ev) {
          if (!ev) return "";
          var head = '';
          if (ev.type) head += '<span class="chip type">' + esc(ev.type) + '</span>';
          var title = ev.title || "";
          var src = [ev.author, ev.journal, ev.year].filter(function (x) {
            return x !== null && x !== undefined && String(x).trim() !== "";
          }).map(function (x) { return esc(x); }).join(" · ");
          var body2 = '';
          if (title) body2 += '<div class="ev-title">' + esc(title) + '</div>';
          if (src) body2 += '<div class="ev-src">' + src + '</div>';
          if (ev.cite) body2 += '<div class="ev-cite">' + esc(ev.cite) + '</div>';
          if (!title && !src && !ev.cite) body2 = '<div class="ev-src">（无出处信息）</div>';
          return '<div class="ev">' + (head ? '<div class="ev-head">' + head + '</div>' : '') + body2 + '</div>';
        }).join("") + '</div></div>';
    }

    /* --- 关联节点（点选逐步延展的落点） --- */
    var rel = (G.edges || []).filter(function (e) {
      return e.source === n.id || e.target === n.id;
    });
    if (rel.length) {
      html += '<div class="sec"><h3 class="sec-title">关联节点<span class="n">' + rel.length + ' 个</span></h3>' +
        '<div class="sec-hint">点击可跳转到该节点</div><div class="obj-list">' +
        rel.map(function (e) {
          var oid = other(e, n);
          var o = NODE[oid];
          if (!o) return "";
          return '<div class="obj" data-id="' + esc(o.id) + '">' +
            '<span class="rel">' + esc(relText(e, n)) + '</span>' +
            '<span class="nm">' + esc(o.name) + '</span>' +
            '<span class="tp" style="color:' + typeOf(o).color + '">' + esc(typeOf(o).label) + '</span></div>';
        }).join("") + '</div></div>';
    }

    if (!html) {
      html = '<div class="sec"><div class="sec-hint">该节点暂无附加信息</div></div>';
    }

    body.innerHTML = html;
    body.scrollTop = 0;
    body.querySelectorAll(".obj").forEach(function (el) {
      el.addEventListener("click", function () { pick(el.dataset.id); });
    });
  }

  /* 把节点挪到视野中央 —— 用户从检索里选中一个「看不见」的节点时，
     面板打开了但图没动，等于让人猜它在哪儿。
     已经在画面里的不动镜头（别把用户正在看的东西甩走）。 */
  function centerOn(id) {
    try {
      var model = chart.getModel().getSeriesByIndex(0);
      var data = model.getData();
      var idx = -1;
      for (var i = 0; i < data.count(); i++) {
        var it = data.getRawDataItem(i);
        if (it && it.id === id) { idx = i; break; }
      }
      if (idx < 0) return false;
      var l = data.getItemLayout(idx);
      if (!l || isNaN(l[0]) || isNaN(l[1])) return false;
      var px = chart.convertToPixel({ seriesIndex: 0 }, l);
      if (!px || isNaN(px[0]) || isNaN(px[1])) return false;
      var w = chart.getWidth(), h = chart.getHeight(), m = 30;
      /* 底部详情抽屉打开时，它盖住画布下半截 —— 目标点要落在「还看得见的那条」中间，
         否则节点被抽屉盖住，等于还是看不见。
         可见高度按「抽屉顶边在画布里的位置」算（抽屉贴的是视口底边，不是画布底边）。 */
      var vis = h;
      var panel = document.getElementById("panel");
      if (isNarrow() && panel && panel.classList.contains("open")) {
        /* 用 offsetTop（布局位置）而不是 getBoundingClientRect（会算上正在跑的滑入动画）*/
        var pt = panel.offsetTop;
        var cr = chart.getDom().getBoundingClientRect();
        vis = Math.max(70, Math.min(h, pt - cr.top));
      }
      if (px[0] >= m && px[0] <= w - m && px[1] >= m && px[1] <= vis - m) return false;
      var zoom = (chart.getOption().series[0] || {}).zoom || 1;
      var dy = (h - vis) / 2 / zoom;
      chart.setOption({ series: [{ id: "kg", center: [l[0], l[1] + dy] }] });
      return true;
    } catch (e) { return false; }
  }

  function pick(id) {
    var n = NODE[id];
    if (!n) return;
    revealNode(id);                    /* 检索命中的节点可能还没展开出来 —— 先放上画布 */
    state.selected = id;
    renderPanel(n);
    updateActions();
    document.getElementById("panel").classList.add("open");
    showScrim(isNarrow());
    document.getElementById("suggest").style.display = "none";
    /* 列表视图下画布不可见 —— 只开详情抽屉，不去动镜头与高亮 */
    if (state.view !== "graph") return;
    freezeLayout();                    /* 选中之前先定型：坐标稳了，选中的节点才不会跑 */
    try { chart.dispatchAction({ type: "select", seriesId: "kg", name: n.name }); } catch (e) {}
    if (centerOn(id)) scheduleLabelAvoid();   /* 镜头动过 → 标签按新坐标重排 */
    focusSet();
  }

  /* 画布点选：取「离手指最近的节点」而不是 zrender 命中的那个元素
     （节点小、又挨得近时，命中是画得晚的赢 —— 点 A 会打开 B）。 */
  var downAt = null;
  chart.getZr().on("mousedown", function (e) { downAt = [e.offsetX, e.offsetY]; });
  chart.getZr().on("click", function (e) {
    if (downAt) {
      var dx = e.offsetX - downAt[0], dy = e.offsetY - downAt[1];
      downAt = null;
      if (Math.sqrt(dx * dx + dy * dy) > 10) return;   /* 拖动平移，不算点选 */
    }
    var hit = nearestNode(e.offsetX, e.offsetY, isNarrow() ? 38 : 26);
    if (hit) pick(hit);
  });

  /* ============ 节点操作（展开 / 锁定 / 关闭） ============ */
  var btnExpand = document.getElementById("pExpand");
  var btnLock = document.getElementById("pLock");
  var btnRemove = document.getElementById("pRemove");

  function updateActions() {
    /* 这三个按钮是「画布上的操作」：列表视图里画布根本不在眼前，
       放出来只会让人以为点了会变 —— 那一层只做阅读。 */
    var row = document.querySelector(".p-actions");
    if (row) row.style.display = (state.view === "graph") ? "" : "none";
    var id = state.selected, n = id ? NODE[id] : null;
    var more = n ? expandableOf(id).length : 0;
    btnExpand.textContent = !n ? "展开" : (more ? "展开 · " + more : "已全部展开");
    btnExpand.disabled = !n || !more;
    btnLock.textContent = (id && state.locked[id]) ? "已锁定" : "锁定";
    btnLock.classList.toggle("on", !!(id && state.locked[id]));
    btnLock.disabled = !n;
    btnRemove.disabled = !n;
  }
  btnExpand.addEventListener("click", function () {
    if (!state.selected) return;
    expandNode(state.selected);
    updateActions();
  });
  btnLock.addEventListener("click", function () {
    toggleLock(state.selected);
    updateActions();
  });
  btnRemove.addEventListener("click", function () {
    removeNode(state.selected);
  });
  document.getElementById("panel-close").addEventListener("click", function () {
    document.getElementById("panel").classList.remove("open");
    document.getElementById("scrim").classList.remove("show");
    state.selected = null;
    try { chart.dispatchAction({ type: "unselect", seriesId: "kg" }); } catch (e) {}
    focusSet();
  });

  /* ============ 底部抽屉（图例 / 详情）· 手机端交互 ============ */
  function showScrim(on) {
    document.getElementById("scrim").classList.toggle("show", !!on);
  }
  document.getElementById("btnLegend").addEventListener("click", function () {
    var lg = document.getElementById("legend");
    var open = !lg.classList.contains("open");
    lg.classList.toggle("open", open);
    document.getElementById("btnLegend").classList.toggle("on", open);
    showScrim(open);
  });
  document.getElementById("legend-close").addEventListener("click", function () {
    document.getElementById("legend").classList.remove("open");
    document.getElementById("btnLegend").classList.remove("on");
    showScrim(false);
  });
  document.getElementById("scrim").addEventListener("click", function () {
    document.getElementById("legend").classList.remove("open");
    document.getElementById("btnLegend").classList.remove("on");
    document.getElementById("panel").classList.remove("open");
    showScrim(false);
  });

  /* ============ 检索框交互 ============ */
  var searchEl = document.getElementById("search");
  var timer = null;
  searchEl.addEventListener("input", function () {
    clearTimeout(timer);
    var v = searchEl.value;
    timer = setTimeout(function () { doSearch(v); }, 140);
    if (state.view === "graph") freezeLayout();   /* 开始检索 = 用户要动手了 → 布局定型，别再抖 */
  });
  searchEl.addEventListener("focus", function () {
    if (searchEl.value.trim()) doSearch(searchEl.value);
  });
  searchEl.addEventListener("keydown", function (ev) {
    /* 列表视图：回车直接打开第一条结果（手机上没有下拉建议可上下键选） */
    if (state.view === "list") {
      if (ev.key === "Enter" && state.hits.length) {
        ev.preventDefault();
        pick(state.hits[0]);
      } else if (ev.key === "Escape") {
        searchEl.value = "";
        doSearch("");
      }
      return;
    }
    var box = document.getElementById("suggest");
    var items = box.querySelectorAll(".sg-item");
    if (!items.length || box.style.display === "none") {
      if (ev.key === "Enter" && items.length) { pick(items[0].dataset.id); }
      return;
    }
    var cur = box.querySelector(".sg-item.active");
    var idx = Array.prototype.indexOf.call(items, cur);
    if (ev.key === "ArrowDown") {
      ev.preventDefault();
      if (cur) cur.classList.remove("active");
      items[(idx + 1) % items.length].classList.add("active");
    } else if (ev.key === "ArrowUp") {
      ev.preventDefault();
      if (cur) cur.classList.remove("active");
      items[(idx - 1 + items.length) % items.length].classList.add("active");
    } else if (ev.key === "Enter") {
      ev.preventDefault();
      var tgt = box.querySelector(".sg-item.active") || items[0];
      if (tgt) pick(tgt.dataset.id);
    } else if (ev.key === "Escape") {
      box.style.display = "none";
    }
  });
  document.addEventListener("click", function (ev) {
    if (!document.getElementById("searchWrap").contains(ev.target)) {
      document.getElementById("suggest").style.display = "none";
    }
  });
  document.getElementById("clearSearch").addEventListener("click", function () {
    searchEl.value = "";
    doSearch("");
    searchEl.focus();
  });

  /* ============ 标签避让 ============
     ECharts 的 labelLayout 对 graph 系列不生效（5.5.1 实测：照样压字），
     这里自己按「度数高的先放」贪心排 —— 与已放标签相撞的就不画。
     标签默认贴在节点右侧；右边放不下就翻到左侧，不让它冲出画布。 */
  var avoidTimer = null, avoiding = false;
  function scheduleLabelAvoid() {
    if (avoidTimer) clearTimeout(avoidTimer);
    avoidTimer = setTimeout(applyLabelAvoid, 160);
  }
  function applyLabelAvoid() {
    if (avoiding) return;
    /* 布局没定型之前不算标签：算出来的位置是按「马上就会变的坐标」摆的，
       而且算标签要改数据、改数据会重启力导向布局 —— 越算越抖。
       定型（freezeLayout）之后再算一次，那时坐标是真的。 */
    if (!state.frozen) return;
    avoiding = true;
    try {
      var off = {}, side = {};
      if (!state.labelsAll) {
        var model = chart.getModel().getSeriesByIndex(0);
        var data = model.getData();
        var fs = isNarrow() ? 13 : 11.5;
        var W = chart.getWidth();
        var idxOf = {};
        for (var i = 0; i < data.count(); i++) {
          var rawItem = data.getRawDataItem(i);
          if (rawItem && rawItem.id != null) idxOf[rawItem.id] = i;
        }
        var cands = [];
        (G.nodes || []).forEach(function (n) {
          if (state.hidden[n.type]) return;
          if (!shouldShowLabel(n)) return;
          cands.push(n);
        });
        cands.sort(function (a, b) { return (degree[b.id] || 0) - (degree[a.id] || 0); });
        var boxes = [];
        cands.forEach(function (n) {
          var idx = idxOf[n.id];
          if (idx == null) return;
          var layout = data.getItemLayout(idx);
          if (!layout || isNaN(layout[0]) || isNaN(layout[1])) return;
          var px = chart.convertToPixel({ seriesIndex: 0 }, layout);
          if (!px || isNaN(px[0]) || isNaN(px[1])) return;
          var txt = shortLabel(n.name);
          var tw = textWidth(txt, fs);
          var half = nodeSymbolSize(n) / 2 + 5;
          var s = "right";
          if (px[0] + half + tw > W - 4) s = "left";   /* 右边放不下 → 翻到左边 */
          var x0 = s === "right" ? px[0] + half : px[0] - half - tw;
          /* 翻边之后仍可能贴到画布外（节点本身在画布边缘，或已在视野之外）——
             再换一次边；两边都放不下就不画这个标签：宁可少一个标签，
             也不让半截字被画布切掉。 */
          if (x0 < 4 || x0 + tw > W - 4) {
            var alt = s === "right" ? "left" : "right";
            var ax0 = alt === "right" ? px[0] + half : px[0] - half - tw;
            if (ax0 >= 4 && ax0 + tw <= W - 4) { s = alt; x0 = ax0; }
            else { off[n.id] = true; return; }
          }
          var x1 = x0 + tw;
          var y0 = px[1] - fs * 0.62;
          var y1 = y0 + fs * 1.24;
          var hit = false;
          for (var b = 0; b < boxes.length; b++) {
            var o = boxes[b];
            if (x0 < o.x1 + 2 && x1 + 2 > o.x0 && y0 < o.y1 + 2 && y1 + 2 > o.y0) { hit = true; break; }
          }
          if (hit) { off[n.id] = true; return; }
          boxes.push({ x0: x0, x1: x1, y0: y0, y1: y1 });
          side[n.id] = s;
        });
      }
      state.labelOff = off;
      state.labelSide = side;
      focusSet();          /* 走既有通道重画：保留检索高亮 / 选中态 */
    } finally {
      avoiding = false;
    }
  }
  chart.on("roam", function () {
    if (avoiding) return;
    freezeLayout();                 /* 用户在拖 / 缩 → 布局就此定型 */
    scheduleLabelAvoid();
  });

  /* ============ 视图控制 ============ */
  /* fitView：把当前可见节点整体收进画布。
     minAbs = 绝对缩放下限 —— 手机上不许缩到「看不清也点不着」，
     宁可让图溢出画布让用户拖，也不给一堆点不中的小点。
     fillH = 只按高度铺满（窄屏首屏用）：竖屏 9:16 优先 ——
     图铺满屏幕高度，宽度上溢出由拖动解决，节点大到点得中；
     「适应画布」按钮随时能收回全图。 */
  function fitView(pad, minAbs, fillH) {
    pad = pad || 70;
    chart.resize();
    var w = chart.getWidth(), h = chart.getHeight();
    var zoom0 = (chart.getOption().series[0] || {}).zoom || 1;
    var model = chart.getModel().getSeriesByIndex(0);
    var data = model.getData();
    /* 画布范围只按「有边相连」的节点算 —— 孤立节点（没有任何关系的节点）会被
       力导向甩到很远；把它算进来，整张图会缩成一小团、中心点也会被带偏。
       孤立节点照常渲染、照常搜得到，只是不占默认视野。 */
    function extent(onlyConnected) {
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, n = 0;
      for (var i = 0; i < data.count(); i++) {
        var it = data.getRawDataItem(i);
        if (it && it.itemStyle && it.itemStyle.opacity === 0) continue;
        if (onlyConnected && it && !(degree[it.id] > 0)) continue;
        var layout = data.getItemLayout(i);
        if (!layout || isNaN(layout[0]) || isNaN(layout[1])) continue;
        var px = chart.convertToPixel({ seriesIndex: 0 }, layout);
        if (!px || isNaN(px[0]) || isNaN(px[1])) continue;
        if (px[0] < minX) minX = px[0];
        if (px[0] > maxX) maxX = px[0];
        if (px[1] < minY) minY = px[1];
        if (px[1] > maxY) maxY = px[1];
        n++;
      }
      return { minX: minX, minY: minY, maxX: maxX, maxY: maxY, n: n };
    }
    var e = extent(true);
    if (!e.n) e = extent(false);      /* 全图都是孤立节点 → 退回按全量算 */
    if (!e.n) return;
    var minX = e.minX, minY = e.minY, maxX = e.maxX, maxY = e.maxY;
    var sx = (maxX - minX) < 1 ? 1 : (w - 2 * pad) / (maxX - minX);
    var sy = (maxY - minY) < 1 ? 1 : (h - 2 * pad) / (maxY - minY);
    var ratio = fillH ? sy : Math.min(sx, sy);
    var abs = zoom0 * Math.min(ratio, 2.5);
    if (minAbs && abs < minAbs) abs = minAbs;
    var centerPx = [(minX + maxX) / 2, (minY + maxY) / 2];
    var gc = chart.convertFromPixel({ seriesIndex: 0 }, centerPx) || [0, 0];
    chart.setOption({ series: [{ id: "kg", zoom: abs, center: gc }] });
  }

  /* 首屏视图：宽屏 = 全图收进画布；
     窄屏 = 图铺满竖屏高度（9:16 的用法：节点大、点得中、字看得清），
     宽度上溢出靠拖动，全图靠「适应画布」按钮。 */
  function initialView() {
    /* 起步只有「主题节点 + 一圈邻居」，全收进屏比铺满高度更好用；
       下限 0.62 防止节点被缩到点不着（点选按最近邻算，仍有 38px 容错）。 */
    if (isNarrow()) fitView(36, 0.62, false);
    else fitView(80);
    scheduleLabelAvoid();
  }

  document.getElementById("btnFit").addEventListener("click", function () {
    freezeLayout();                    /* 用户动手了 → 布局就此定型 */
    fitView(isNarrow() ? 40 : 80);     /* 按钮 = 看全图（不设缩放下限） */
    scheduleLabelAvoid();
  });
  document.getElementById("btnLabels").addEventListener("click", function () {
    freezeLayout();
    state.labelsAll = !state.labelsAll;
    document.getElementById("btnLabels").classList.toggle("on", state.labelsAll);
    state.labelOff = {}; state.labelSide = {};
    chart.setOption({ series: [{ id: "kg", data: buildNodes() }] });
  });
  /* 布局从头再跑一遍：解冻、坐标作废、提示条重新挂上。
     逐步展开的节点是我们自己摆的位置（不跑力导向）；只有「全部展开」和
     「重置」这种一次换掉大半张图的操作，才值得重跑一次布局。 */
  function relayout() {
    state.frozen = false; state.pos = {};
    state.labelOff = {}; state.labelSide = {};
    prevLayoutPos = null; lastExtent = null; stableRounds = 0;
    var badge = document.getElementById("settling");
    if (badge) badge.classList.remove("gone");
    chart.clear();
    option.series[0].data = buildNodes();
    option.series[0].links = buildLinks();
    chart.setOption(option);
    updateStats();
    setTimeout(function () { settleView(0); }, 1200);
    setTimeout(function () { initialView(); }, 900);
  }

  document.getElementById("btnAll").addEventListener("click", function () {
    (G.nodes || []).forEach(function (n) {
      if (!typeHidden(n.id)) { state.vis[n.id] = true; state.expanded[n.id] = true; }
    });
    state.selected = null;
    document.getElementById("panel").classList.remove("open");
    document.getElementById("scrim").classList.remove("show");
    relayout();
  });

  document.getElementById("btnReset").addEventListener("click", function () {
    var keep = state.locked;
    searchEl.value = "";
    state.hidden = {};                   /* 回到出厂口径：不藏任何类型 */
    state.labelsAll = false; state.selected = null;
    state.query = ""; state.hits = []; state.hitsMap = {};
    document.querySelectorAll("#legend-body .lg-item").forEach(function (el) {
      el.classList.toggle("off", !!state.hidden[el.dataset.type]);
    });
    document.getElementById("btnLabels").classList.remove("on");
    document.getElementById("clearSearch").style.display = "none";
    document.getElementById("panel").classList.remove("open");
    document.getElementById("legend").classList.remove("open");
    document.getElementById("btnLegend").classList.remove("on");
    document.getElementById("scrim").classList.remove("show");
    document.getElementById("suggest").style.display = "none";
    applySeed();
    /* 锁定的节点在重置后仍然留着 —— 这就是「锁定」的用处 */
    Object.keys(keep).forEach(function (id) {
      if (NODE[id]) { state.vis[id] = true; state.locked[id] = true; }
    });
    relayout();
  });

  /* ============ 统计角标（自己算，不依赖数据里额外字段） ============
     画布是逐步展开的 ⇒ 角标必须同时给「可见 / 共多少」，
     否则用户会以为图谱只有眼前这些。 */
  var relTypesUsed = {};
  (G.edges || []).forEach(function (e) { relTypesUsed[e.type] = (relTypesUsed[e.type] || 0) + 1; });
  var nodeTypesUsed = {};
  (G.nodes || []).forEach(function (n) { nodeTypesUsed[n.type] = (nodeTypesUsed[n.type] || 0) + 1; });
  function updateStats() {
    var vis = Object.keys(state.vis).length, all = (G.nodes || []).length;
    document.getElementById("stats").innerHTML =
      "可见 <b>" + vis + "</b> / 共 <b>" + all + "</b> 节点 · 关系 <b>" + (G.edges || []).length + "</b> · " +
      Object.keys(nodeTypesUsed).length + " 类实体 · " +
      Object.keys(relTypesUsed).filter(function (k) { return relTypesUsed[k]; }).length + " 类关系";
  }
  updateStats();

  renderLegend();

  /* 提示条：几秒后淡出（不长期占屏） */
  setTimeout(function () {
    var hint = document.getElementById("hint");
    if (hint) hint.classList.add("gone");
  }, 6500);

  /* 首屏视图：力导向布局要跑一会儿才定型 —— 固定延时适配会适配到「还没定型的布局」，
     图看起来是冲出画布的。改成反复适配，直到图的范围不再变化为止；
     用户已动手（拖动 / 缩放）就停手，不打乱他。 */
  var userMoved = false;
  /* 用户一动手就把布局冻住 —— 节点在动的话，手指按不住也点不准。
     冻住之后图不再抖，交互才是稳的。 */
  chart.getZr().on("mousedown", function () { userMoved = true; freezeLayout(); });
  chart.getZr().on("wheel", function () { userMoved = true; freezeLayout(); });

  /* 图的范围（系列坐标）—— 布局变了它就变。
     只按「有边相连」的节点算：孤立节点会被力导向甩着漂，计进去会让
     「定型判定」一直不收敛（每轮都在重新适配）。 */
  function graphExtent() {
    var model = chart.getModel().getSeriesByIndex(0);
    var data = model.getData();
    var mnX = Infinity, mnY = Infinity, mxX = -Infinity, mxY = -Infinity, n = 0;
    for (var i = 0; i < data.count(); i++) {
      var it = data.getRawDataItem(i);
      if (it && !(degree[it.id] > 0)) continue;
      var l = data.getItemLayout(i);
      if (!l || isNaN(l[0]) || isNaN(l[1])) continue;
      if (l[0] < mnX) mnX = l[0];
      if (l[0] > mxX) mxX = l[0];
      if (l[1] < mnY) mnY = l[1];
      if (l[1] > mxY) mxY = l[1];
      n++;
    }
    if (!n) return 0;
    return Math.max(mxX - mnX, mxY - mnY);
  }

  /* 布局漂移量：这一轮（两次采样之间）节点挪了多远。
     外框不变 ≠ 布局定型 —— 中间的节点还在慢慢挪，标签却按旧坐标摆着，
     就会跟别的标签压到一起（实测：R04 与「过敏反应」打架）。
     所以「定型」看漂移，不只看外框。
     孤立节点不计入：它被力导向甩着漂，会让「定型」永远不成立，
     而它本来就不带标签，漂不漂不影响标签避让。 */
  var prevLayoutPos = null;
  function layoutDrift() {
    var model = chart.getModel().getSeriesByIndex(0);
    var data = model.getData();
    var cur = [], maxd = 0;
    for (var i = 0; i < data.count(); i++) {
      var it = data.getRawDataItem(i);
      if (it && !(degree[it.id] > 0)) { cur.push(null); continue; }
      var l = data.getItemLayout(i);
      cur.push(l ? [l[0], l[1]] : null);
    }
    if (prevLayoutPos && prevLayoutPos.length === cur.length) {
      for (var j = 0; j < cur.length; j++) {
        var a = prevLayoutPos[j], b = cur[j];
        if (!a || !b) continue;
        var d = Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
        if (d > maxd) maxd = d;
      }
    }
    prevLayoutPos = cur;
    return maxd;
  }

  /* ============ 冻结布局（关键一步） ============
     ECharts 每次 setOption 换掉 series.data，都会重跑一遍力导向布局，
     整张图立刻抖起来（实测：一次 setOption 后立刻漂 23.7px，之后还在动）。
     于是形成自喂循环：放标签要改数据 → 改数据触发重排 → 图动了 →
     标签追不上坐标 → 再放标签 → 又触发重排 …… 抖到超时才停。

     冻结 = 把当前坐标写回数据项 + 切到 layout:'none'（不再跑布局引擎）。
     冻住之后：图不动，标签一次算准，也就永远追不上。
     实测冻结瞬间：位置零跳动、之后零漂移，坐标换算照常。 */
  function freezeLayout() {
    if (state.frozen) return false;
    try {
      var model = chart.getModel().getSeriesByIndex(0);
      var data = model.getData();
      for (var i = 0; i < data.count(); i++) {
        var raw = data.getRawDataItem(i);
        if (!raw || raw.id == null) continue;
        var l = data.getItemLayout(i);
        if (!l || isNaN(l[0]) || isNaN(l[1])) continue;
        state.pos[raw.id] = [l[0], l[1]];
      }
      state.frozen = true;
      /* 这一帧先把标签全关掉：标签还没算避让，全画出来会先压字一下。
         避让算完（160ms 后）再由 focusSet 决定哪些该亮。 */
      var items = buildNodes().map(function (d) { d.label.show = false; return d; });
      chart.setOption({ series: [{ id: "kg", layout: "none", data: items }] });
      /* 切到 layout:'none' 之后，图的比例尺跟布局运行时不是一套了 ——
         不重新适配的话，整张图会缩成中间一小团（实测：310px 的画布只占 216px）。
         冻住的坐标是最终坐标，此刻适配一次就是最终视图。 */
      initialView();
      var badge = document.getElementById("settling");
      if (badge) badge.classList.add("gone");
      scheduleLabelAvoid();          /* 冻住了 → 标签一次算准 */
      return true;
    } catch (e) {
      state.frozen = false;
      return false;
    }
  }

  var lastExtent = null, stableRounds = 0;
  function settleView(round) {
    round = round || 0;
    if (state.frozen) return;
    var drift = layoutDrift();                          /* 这一轮节点挪了多少 */
    if (userMoved) {
      /* 用户已经自己控视图（拖动 / 缩放）→ 停手，别把人家正在看的东西甩走；
         同时把布局冻住 —— 节点还在动的话，手指按不住也点不准。 */
      freezeLayout();
      return;
    }
    if (round >= 9) { freezeLayout(); return; }    /* 最多等约 5 秒（起步只画一圈，收敛很快） */
    var ext = graphExtent();
    var changed = lastExtent === null || Math.abs(ext - lastExtent) / (lastExtent || 1) >= 0.005;
    if (changed) {
      initialView();          /* 布局变了 → 重新适配 */
      lastExtent = ext;
      stableRounds = 0;
    }
    if (drift > 0.5) {
      /* 位置还在动（哪怕外框没变）→ 还不能定型 */
      stableRounds = 0;
    } else {
      stableRounds++;
      if (stableRounds >= 2) { freezeLayout(); return; }   /* 连续两轮稳定 → 收工 */
    }
    setTimeout(function () { settleView(round + 1); }, 400);
  }
  setTimeout(function () { settleView(0); }, 1200);

  /* ============ 起步：手机默认「卡片流」，桌面默认「全景图」 ============
     为什么手机默认不是画布：92 个节点摊在 390px 宽的屏上，节点间距约 4px，
     字根本放不下 —— 那是结构问题，不是样式问题（把桌面画布缩小解决不了）。
     想看全局关系的人点右上角「全景图」即可。 */
  state.view = isNarrow() ? "list" : "graph";
  setView(state.view);
  viewReady = true;
  renderList();

  document.getElementById("loading").style.display = "none";
})();
</script>
</body>
</html>
